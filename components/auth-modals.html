<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
        <div class="auth-tabs">
            <button class="auth-tab active" type="button" onclick="openModal('loginModal')"><i class="fas fa-right-to-bracket"></i> <span data-i18n="auth.login">LOGIN</span></button>
            <button class="auth-tab" type="button" onclick="switchModal('loginModal', 'registerModal')"><i class="fas fa-user-plus"></i> <span data-i18n="auth.register">REGISTER</span></button>
        </div>
        <h2 class="modal-title" data-i18n="auth_modal.login_title" style="text-align: center;">WELCOME BACK</h2>

        <button class="btn-discord" type="button">
            <i class="fab fa-discord"></i>
            <span data-i18n="auth_modal.login_discord">LOGIN WITH DISCORD</span>
        </button>

        <div class="divider" data-i18n="common.or">OR</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label data-i18n="auth.username">USERNAME</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input id="login-username" type="text" required minlength="4" maxlength="10" data-i18n-placeholder="auth.username_placeholder" placeholder="4-10 characters">
                </div>
            </div>
            <div class="input-group">
                <label data-i18n="auth.password">PASSWORD</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input id="login-password" type="password" required minlength="4" maxlength="10" data-i18n-placeholder="auth.password_placeholder" placeholder="4-10 characters">
                </div>
            </div>

            <div class="human-verify">
                <div class="human-verify__head" data-i18n="auth.human_verification">HUMAN VERIFICATION <span class="human-verify__timer" id="login-captcha-timer" style="color: rgba(255, 255, 255, 0.7); font-size: 0.65rem; margin-left: 8px;"></span></div>
                <div class="human-verify__code" aria-label="Captcha">
                    <span class="human-verify__value" id="login-captcha-value">-</span>
                    <button class="human-verify__refresh" id="login-captcha-refresh" type="button" aria-label="Refresh"><i class="fas fa-rotate"></i></button>
                </div>
                <div class="input-group">
                    <label data-i18n="auth.enter_code">ENTER THE CODE</label>
                    <input id="login-captcha-input" type="text" placeholder="5 characters" autocomplete="off" maxlength="8" />
                </div>
            </div>
            <button type="submit" class="btn-ribbon">
                <i class="fas fa-right-to-bracket"></i>
                <span data-i18n="auth.login">LOGIN</span>
            </button>
        </form>
        <div class="modal-footer"></div>
    </div>
</div>

<div id="registerModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('registerModal')">&times;</span>
        <div class="auth-tabs">
            <button class="auth-tab" type="button" onclick="switchModal('registerModal', 'loginModal')"><i class="fas fa-right-to-bracket"></i> <span data-i18n="auth.login">LOGIN</span></button>
            <button class="auth-tab active" type="button" onclick="openModal('registerModal')"><i class="fas fa-user-plus"></i> <span data-i18n="auth.register">REGISTER</span></button>
        </div>
        <h2 class="modal-title" data-i18n="auth_modal.register_title" style="text-align: center;">CREATE ACCOUNT</h2>

        <button class="btn-discord" type="button">
            <i class="fab fa-discord"></i>
            <span data-i18n="auth_modal.register_discord">REGISTER WITH DISCORD</span>
        </button>

        <div class="divider" data-i18n="common.or">OR</div>

        <form onsubmit="handleRegister(event)">
            <div class="row">
                <div class="input-group">
                    <label data-i18n="auth.username">USERNAME</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input id="register-username" type="text" required minlength="4" maxlength="10" data-i18n-placeholder="auth.username_placeholder" placeholder="4-10 characters">
                    </div>
                </div>
                <div class="input-group">
                    <label data-i18n="auth.email">EMAIL</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input id="register-email" type="email" required data-i18n-placeholder="auth.email_placeholder" placeholder="you@example.com">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="input-group">
                    <label data-i18n="auth.password">PASSWORD</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input id="register-password" type="password" required minlength="4" maxlength="10" data-i18n-placeholder="auth.password_placeholder" placeholder="4-10 characters">
                    </div>
                </div>
                <div class="input-group">
                    <label data-i18n="auth.confirm_password">CONFIRM PASSWORD</label>
                    <div class="input-icon">
                        <i class="fas fa-shield"></i>
                        <input id="register-confirm-password" type="password" required minlength="4" maxlength="10" data-i18n-placeholder="auth.confirm_password_placeholder" placeholder="Repeat password">
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label data-i18n="auth.referral_optional">REFERRAL (OPTIONAL)</label>
                <div class="input-icon">
                    <i class="fas fa-ticket"></i>
                    <input id="register-referral" type="text" data-i18n-placeholder="auth.referral_placeholder" placeholder="Referral code">
                </div>
            </div>
            <div class="input-group">
                <label data-i18n="auth.country">COUNTRY</label>
                <select id="register-country" required class="is-hidden" hidden></select>
                <div id="register-country-dd" class="dd dd--modal" aria-label="Country">
                    <button id="register-country-dd-btn" class="dd-btn dd-btn--modal" type="button" aria-haspopup="listbox" aria-expanded="false">
                        <span id="register-country-dd-label" class="dd-label">Select...</span>
                        <span class="dd-chevron" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
                    </button>
                    <div id="register-country-dd-panel" class="dd-panel dd-panel--modal" role="listbox" tabindex="-1" hidden>
                        <div class="dd-search">
                            <i class="fas fa-search" aria-hidden="true"></i>
                            <input id="register-country-search" type="text" placeholder="Search..." autocomplete="off">
                        </div>
                        <div id="register-country-dd-list" class="dd-list"></div>
                    </div>
                </div>
            </div>

            <div class="human-verify">
                <div class="human-verify__head" data-i18n="auth.human_verification">HUMAN VERIFICATION <span class="human-verify__timer" id="register-captcha-timer" style="color: rgba(255, 255, 255, 0.7); font-size: 0.65rem; margin-left: 8px;"></span></div>
                <div class="human-verify__code" aria-label="Captcha">
                    <span class="human-verify__value" id="register-captcha-value">-</span>
                    <button class="human-verify__refresh" id="register-captcha-refresh" type="button" aria-label="Refresh"><i class="fas fa-rotate"></i></button>
                </div>
                <div class="input-group">
                    <label data-i18n="auth.enter_code">ENTER THE CODE</label>
                    <input id="register-captcha-input" type="text" placeholder="5 characters" autocomplete="off" maxlength="8" />
                </div>
            </div>
            <button type="submit" class="btn-ribbon">
                <i class="fas fa-user-plus"></i>
                <span data-i18n="auth.register">REGISTER</span>
            </button>
        </form>
        <div class="modal-footer"></div>
    </div>
</div>
