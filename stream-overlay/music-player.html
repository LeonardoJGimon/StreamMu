<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Master Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); }

        :root {
            --gold: #c0a375;
            --gold-bright: #f0d7a9;
            --crimson: #800000;
            --bg-dark: rgba(5, 5, 5, 0.95);
        }

        body {
            margin: 0; padding: 20px; background: transparent;
            font-family: 'Alegreya', serif; color: #fff;
        }

        .player-container {
            width: 380px;
            background: var(--bg-dark);
            border: 2px solid var(--gold);
            padding: 20px;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            clip-path: polygon(0 0, 92% 0, 100% 15%, 100% 100%, 8% 100%, 0 85%);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(192, 163, 117, 0.2);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .disc-icon {
            font-size: 2.5rem;
            color: var(--gold);
            animation: rotate 4s infinite linear;
            animation-play-state: paused;
        }
        .playing .disc-icon { animation-play-state: running; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .song-info { flex: 1; overflow: hidden; }
        .song-title {
            font-family: 'Exocet', serif;
            font-size: 1rem;
            color: var(--gold-bright);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(192, 163, 117, 0.4);
        }
        .song-artist { font-size: 0.75rem; color: #666; text-transform: uppercase; margin-top: 5px; }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .btn {
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { color: #fff; transform: scale(1.2); filter: drop-shadow(0 0 10px var(--gold)); }
        .btn-play { font-size: 2.2rem; }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #111;
            margin: 15px 0 5px 0;
            border: 1px solid rgba(192, 163, 117, 0.1);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--crimson), #ff4500);
            width: 0%;
            box-shadow: 0 0 15px var(--crimson);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--gold);
            opacity: 0.7;
        }
        
        .playlist-status {
            text-align: center;
            font-size: 0.6rem;
            color: #444;
            margin-top: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="player-container" id="player">
        <div class="player-header">
            <i class="fas fa-compact-disc disc-icon"></i>
            <div class="song-info">
                <div class="song-title" id="title">Cargando Grimorio...</div>
                <div class="song-artist" id="artist">Biblioteca Mu Neutro</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time-info">
            <span id="current">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="btn" onclick="prev()"><i class="fas fa-backward"></i></button>
            <button class="btn btn-play" id="play-btn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
            <button class="btn" onclick="next()"><i class="fas fa-forward"></i></button>
        </div>

        <div class="playlist-status" id="status">CANCIÓN 1 DE 30</div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        // LISTA GENERADA DESDE TUS FOTOS
        const songs = [
            { title: "Chill Magic", artist: "prettyjohn1" },
            { title: "Presentation Beat", artist: "prettyjohn1" },
            { title: "Sport Hip-Hop Trap", artist: "prettyjohn1" },
            { title: "Autumn Leaves Falling", artist: "alex-morgan" },
            { title: "Ambient Electronica", artist: "alex-morgan" },
            { title: "Nocturne N20 Hip-Hop", artist: "Pink_Sound" },
            { title: "Sad LoFi Beats", artist: "AtlasAudio" },
            { title: "Hip-Hop Instrumental", artist: "leberch" },
            { title: "Lofi Night Chill", artist: "leberch" },
            { title: "Travelling Background", artist: "Monume" },
            { title: "Guitar Medieval Beat", artist: "Monume" },
            { title: "Advertising Beats", artist: "Monume" },
            { title: "Travel Vlog Beat", artist: "Monume" },
            { title: "Spring Season Beat", artist: "Monume" },
            { title: "Product Launch Review", artist: "Monume" },
            { title: "Vlog Vlogs Minimal", artist: "Monume" },
            { title: "Summer Beats", artist: "Monume" },
            { title: "Educational Tutorial", artist: "Monume" },
            { title: "Beat Minimalist", artist: "Monume" },
            { title: "HipHop Beat Master", artist: "Monume" },
            { title: "Dramatic Cinematic Beat", artist: "Monume" },
            { title: "Fashion Show Vogue", artist: "Monume" },
            { title: "Promo Commercial Beat", artist: "Monume" },
            { title: "Wild West Desert", artist: "Monume" },
            { title: "Short Films Ambient", artist: "Monume" },
            { title: "Nature Meditation", artist: "Monume" },
            { title: "Background Music No-Copyright", artist: "AbsoluteSound" },
            { title: "Fast Lofi Emotions", artist: "AbsoluteSound" },
            { title: "Lofi Girl Chill", artist: "SolarFLEX" },
            { title: "Trap Hype Beat", artist: "SolarFLEX" }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const player = document.getElementById('player');
        const progressBar = document.getElementById('progress-bar');

        function loadSong(index) {
            const song = songs[index];
            document.getElementById('title').innerText = song.title;
            document.getElementById('artist').innerText = song.artist;
            document.getElementById('status').innerText = `CANCIÓN ${index + 1} DE ${songs.length}`;
            
            // BUSCARA EL ARCHIVO beat1.mp3, beat2.mp3, etc en tu carpeta assets/music
            audio.src = `../assets/music/beat${index + 1}.mp3`;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    player.classList.add('playing');
                }).catch(e => alert("Error: Asegúrate de tener los archivos beat1.mp3... en la carpeta assets/music"));
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                player.classList.remove('playing');
            }
        }

        function next() {
            currentIndex = (currentIndex + 1) % songs.length;
            loadSong(currentIndex);
            audio.play();
            player.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }

        function prev() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadSong(currentIndex);
            audio.play();
            player.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }

        window.addEventListener('load', () => {
            loadSong(currentIndex);
            // Intentar auto-play
            setTimeout(() => {
                audio.play().then(() => {
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    player.classList.add('playing');
                }).catch(e => console.log("Esperando interacción..."));
            }, 2000);
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
            document.getElementById('current').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', next);

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }
    </script>
</body>
</html>
