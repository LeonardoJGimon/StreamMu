<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); }

        :root {
            --gold: #c0a375;
            --gold-bright: #f0d7a9;
            --crimson: #800000;
            --bg-dark: rgba(10, 10, 10, 0.9);
        }

        body {
            margin: 0; padding: 20px; background: transparent;
            font-family: 'Alegreya', serif; color: #fff;
            overflow: hidden;
        }

        /* REPRODUCTOR ESTILO GRIMORIO */
        .player-container {
            width: 350px;
            background: var(--bg-dark);
            border: 2px solid var(--gold);
            padding: 15px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            clip-path: polygon(0 0, 95% 0, 100% 15%, 100% 100%, 5% 100%, 0 85%);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(192, 163, 117, 0.3);
            padding-bottom: 10px;
        }

        .disc-icon {
            font-size: 2rem;
            color: var(--gold);
            animation: rotate 5s infinite linear;
            animation-play-state: paused;
        }
        .playing .disc-icon { animation-play-state: running; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .song-info { flex: 1; overflow: hidden; }
        .song-title {
            font-family: 'Exocet', serif;
            font-size: 0.9rem;
            color: var(--gold-bright);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 1px;
        }
        .song-artist { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        /* CONTROLES */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { color: #fff; transform: scale(1.1); }
        .btn-play { font-size: 1.8rem; }

        /* BARRA DE PROGRESO */
        .progress-container {
            width: 100%;
            height: 4px;
            background: #222;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: var(--crimson);
            width: 0%;
            box-shadow: 0 0 10px var(--crimson);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--gold);
            margin-top: -5px;
        }
    </style>
</head>
<body>

    <div class="player-container" id="player">
        <div class="player-header">
            <i class="fas fa-compact-disc disc-icon"></i>
            <div class="song-info">
                <div class="song-title" id="title">Selecciona una canción</div>
                <div class="song-artist" id="artist">Biblioteca de Beats</div>
            </div>
        </div>

        <div class="progress-container" id="progress-area">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time-info">
            <span id="current">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="btn" onclick="prev()"><i class="fas fa-step-backward"></i></button>
            <button class="btn btn-play" id="play-btn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
            <button class="btn" onclick="next()"><i class="fas fa-step-forward"></i></button>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        // LISTA DE BEATS (Aquí puedes añadir los tuyos)
        const playlist = [
            { 
                title: "Gothic Beat Ambient", 
                artist: "Monume", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" // Link de ejemplo
            },
            { 
                title: "Lofi Dungeon Chill", 
                artist: "Pink_Sound", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" 
            },
            { 
                title: "Dark Hip-Hop Mu", 
                artist: "AbsoluteSound", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" 
            }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const player = document.getElementById('player');
        const progressBar = document.getElementById('progress-bar');

        function loadSong(index) {
            const song = playlist[index];
            document.getElementById('title').innerText = song.title;
            document.getElementById('artist').innerText = song.artist;
            audio.src = song.url;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                player.classList.add('playing');
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                player.classList.remove('playing');
            }
        }

        function next() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadSong(currentIndex);
            audio.play();
            player.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }

        function prev() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentIndex);
            audio.play();
            player.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }

        // Auto-play al cargar (Si el navegador lo permite)
        window.addEventListener('load', () => {
            loadSong(currentIndex);
            // Nota: Algunos navegadores bloquean el autoplay. 
            // En OBS funciona si activas "Controlar audio vía OBS".
            setTimeout(() => {
                audio.play().catch(e => console.log("Autoplay bloqueado. Haz clic en Play."));
            }, 1000);
        });

        // Actualizar barra de progreso
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
            
            document.getElementById('current').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', next);

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }
    </script>
</body>
</html>
