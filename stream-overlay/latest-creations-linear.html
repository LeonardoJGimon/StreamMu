<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Últimos Guerreros (Linear Edition)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); font-weight: 400; }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --row-bg: rgba(10, 10, 10, 0.95);
            --widget-height: 100px;
        }

        body {
            margin: 0; padding: 20px; background: transparent;
            font-family: 'Alegreya', serif; color: #ccc;
            width: 100vw; height: auto; 
            overflow: hidden; box-sizing: border-box;
        }

        /* CONTENEDOR PRINCIPAL - FIX DEFINITIVO */
        .linear-container {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            height: var(--widget-height);
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(192, 163, 117, 0.3);
            box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative;
            margin-left: 80px; /* Espacio para el logo */
            width: fit-content; /* Se ajusta al contenido */
            overflow: visible;
        }

        /* LOGO QUE SOBRESALE */
        .header-logo {
            position: absolute;
            left: -85px;
            top: 50%;
            transform: translateY(-50%);
            width: 130px;
            height: 130px;
            z-index: 100;
            filter: drop-shadow(0 0 20px rgba(0,0,0,1));
        }

        .widget-header {
            background: linear-gradient(180deg, var(--crimson) 0%, #1a0505 100%);
            padding: 0 40px 0 60px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            border-right: 2px solid var(--gold);
            min-width: 150px;
            position: relative;
            z-index: 10;
        }

        .header-label {
            font-size: 0.75rem;
            color: #fff;
            opacity: 0.8;
            letter-spacing: 5px;
            font-family: 'Exocet', serif;
            margin-bottom: 3px;
        }

        .header-title {
            font-family: 'Exocet', serif;
            font-size: 1.4rem;
            color: var(--gold);
            letter-spacing: 3px;
            white-space: nowrap;
            text-shadow: 0 0 15px rgba(255, 46, 46, 0.6);
        }

        .cards-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            padding: 0 30px;
            position: relative;
            flex: 1;
            overflow: visible; /* CRITICO PARA LAS ETIQUETAS */
        }

        .hall-card {
            display: grid; 
            grid-template-columns: 55px 1fr auto; 
            gap: 12px;
            width: 330px;
            height: 70px;
            align-items: center; 
            background: var(--row-bg); 
            padding: 0 15px;
            position: relative; 
            border: 1px solid rgba(192, 163, 117, 0.15);
            box-sizing: border-box;
            transition: all 0.5s ease;
        }

        /* ETIQUETA SUPERIOR */
        .category-label {
            position: absolute; 
            top: -12px; 
            left: 10px; 
            background: var(--crimson);
            color: white; 
            font-family: 'Exocet', serif; 
            font-size: 0.6rem;
            padding: 2px 10px; 
            letter-spacing: 1px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border: 1px solid var(--gold);
            z-index: 20;
        }

        .hall-card.new-entry {
            animation: slideInWidth 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        @keyframes slideInWidth {
            from { width: 0; opacity: 0; transform: scaleX(0); transform-origin: left; }
            to { width: 330px; opacity: 1; transform: scaleX(1); transform-origin: left; }
        }

        .avatar-container { 
            width: 50px; height: 50px; 
            position: relative; 
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(192, 163, 117, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }
        .avatar-img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(0 0 5px var(--gold)); }
        
        .info-box { display: flex; flex-direction: column; justify-content: center; }
        .name { font-family: 'Exocet', serif; font-size: 1.2rem; color: #fff; text-shadow: 0 2px 4px #000; text-transform: uppercase; line-height: 1; }
        .sub-info { font-size: 0.7rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .stat-box { text-align: right; border-left: 1px solid rgba(192, 163, 117, 0.1); padding-left: 15px; }
        .stat-value { font-family: 'Exocet', serif; font-size: 1rem; color: #fff; line-height: 1; }
        .stat-unit { font-size: 0.6rem; color: var(--gold); display: block; font-weight: bold; letter-spacing: 1px; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="linear-container">
        <!-- Logo -->
        <img src="../assets/images/logo/logosimple.png" class="header-logo">
        
        <!-- Header -->
        <div class="widget-header">
            <div class="header-label">NUEVOS</div>
            <div class="header-title">GUERREROS</div>
        </div>

        <!-- Lista de tarjetas -->
        <div class="cards-wrapper" id="list">
            <!-- Las tarjetas se generan dinámicamente -->
        </div>
    </div>
        <div class="cards-wrapper" id="list">
            <!-- Tarjetas dinámicas -->
        </div>
    </div>

    <script>
        const classMap = {
            0: { folder: 'SM', icon: 'dw-icon.png' },
            16: { folder: 'DK', icon: 'dk-icon.png' },
            32: { folder: 'FAIRY ELF', icon: 'elf-icon.png' },
            48: { folder: 'MG', icon: 'mg icon.png' },
            64: { folder: 'DL', icon: 'dl icon.png' },
            80: { folder: 'SUMONNER', icon: 'sm icon.png' },
            96: { folder: 'RAGE', icon: 'rf icon.png' }
        };

        const labels = ['NUEVA CREACIÓN', 'GUERRERO RECIENTE', 'ALMA DESPERTADA', 'SANGRE NUEVA'];
        let serverTime = new Date();
        let lastChars = [];

        function formatTimeAgo(dateStr) {
            const diff = Math.floor((serverTime - new Date(dateStr)) / 1000);
            if (diff < 60) return `${Math.max(0, diff)} SEG`;
            if (diff < 3600) return `${Math.floor(diff/60)} MIN`;
            return `${Math.floor(diff/3600)} HORAS`;
        }

        async function update() {
            try {
                // Cache buster con timestamp
                const res = await fetch('/api/stats?t=' + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                serverTime = new Date(data.timestamp);
                const chars = (data.recentCharacters || []).slice(0, 3);

                if (chars.length === 0) return;

                if (lastChars.length === 0) {
                    initialRender(chars);
                } else if (chars[0].name.trim() !== lastChars[0].name.trim()) {
                    // Si el nombre del primer personaje cambió, activamos el desplazamiento
                    shiftRender(chars[0]);
                } else {
                    // Si solo cambió el nivel o tiempo, refrescamos los datos sin mover nada
                    refreshData(chars);
                }
                lastChars = chars;
            } catch (e) { console.error("Error en update:", e); }
        }

        function createCardHtml(c, index, extraClass = '') {
            const info = classMap[c.classId] || classMap[0];
            const iconPath = `../assets/images/chars/${info.folder}/${info.icon}`;
            return `
                <div class="hall-card ${extraClass}" data-name="${c.name}">
                    <span class="category-label">${labels[index] || 'WARRIOR'}</span>
                    <div class="avatar-container">
                        <img src="${iconPath}" class="avatar-img">
                    </div>
                    <div class="info-box">
                        <div class="name">${c.name}</div>
                        <div class="sub-info">Nivel ${c.level} / ${c.resets} RR</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value time-ago">${formatTimeAgo(c.date)}</div>
                        <div class="stat-unit">ANTIGÜEDAD</div>
                    </div>
                </div>
            `;
        }

        function initialRender(chars) {
            const listEl = document.getElementById('list');
            listEl.innerHTML = chars.map((c, i) => createCardHtml(c, i)).join('');
        }

        function shiftRender(newChar) {
            const listEl = document.getElementById('list');
            const cards = listEl.querySelectorAll('.hall-card');
            
            // 1. Crear nueva tarjeta
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = createCardHtml(newChar, 0, 'new-entry');
            const newCard = tempDiv.firstElementChild;
            
            // 2. Insertar al inicio para el efecto "push"
            listEl.insertBefore(newCard, listEl.firstChild);
            
            // 3. Remover el excedente (si hay más de 3)
            if (cards.length >= 3) {
                const lastCard = cards[cards.length - 1];
                lastCard.classList.add('removing');
                setTimeout(() => lastCard.remove(), 800);
            }

            // 4. Corregir etiquetas de posición
            setTimeout(() => {
                const currentCards = listEl.querySelectorAll('.hall-card:not(.removing)');
                currentCards.forEach((card, i) => {
                    const label = card.querySelector('.category-label');
                    if (label) label.innerText = labels[i] || 'GUERRERO';
                });
            }, 100);
        }

        function refreshData(chars) {
            const listEl = document.getElementById('list');
            const cards = listEl.querySelectorAll('.hall-card:not(.removing)');
            chars.forEach((c, i) => {
                if (cards[i]) {
                    const timeEl = cards[i].querySelector('.time-ago');
                    if (timeEl) timeEl.innerText = formatTimeAgo(c.date);
                    const infoEl = cards[i].querySelector('.sub-info');
                    if (infoEl) infoEl.innerText = `Nivel ${c.level} / ${c.resets} RR`;
                    // Asegurar que el nombre esté actualizado si hubo micro-cambios
                    const nameEl = cards[i].querySelector('.name');
                    if (nameEl && nameEl.innerText !== c.name) nameEl.innerText = c.name;
                }
            });
        }

        setInterval(() => {
            serverTime.setSeconds(serverTime.getSeconds() + 1);
            if (lastChars.length > 0) refreshData(lastChars);
        }, 1000);

        setInterval(update, 5000); // Revisar cada 5 segundos
        update();
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
