
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Live Alerts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
            font-weight: 400;
        }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff1a1a;
            --gold: #c0a375;
            --dark-bg: rgba(10, 5, 5, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Alegreya', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CONTENEDOR PRINCIPAL DE LA ALERTA */
        .alert-wrapper {
            display: none; /* Se activa por JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 100;
        }

        /* EFECTO DE FLASH DE FONDO */
        .alert-flash {
            position: absolute;
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, var(--crimson) 0%, transparent 70%);
            opacity: 0;
            z-index: -1;
        }

        .alert-box {
            background: var(--dark-bg);
            border: 2px solid var(--crimson);
            padding: 40px 80px;
            position: relative;
            box-shadow: 0 0 60px rgba(0,0,0,1), inset 0 0 30px rgba(157, 10, 14, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: skewX(-5deg);
        }

        /* ORNAMENTOS DE ESQUINA */
        .alert-box::before, .alert-box::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid var(--gold);
            filter: drop-shadow(0 0 5px var(--gold));
        }

        .alert-box::before { top: -8px; left: -8px; border-right: 0; border-bottom: 0; }
        .alert-box::after { bottom: -8px; right: -8px; border-left: 0; border-top: 0; }

        .alert-header {
            font-family: 'Exocet', serif;
            font-size: 1.4rem;
            color: var(--crimson);
            letter-spacing: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px var(--crimson));
        }

        .alert-content {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .alert-icon {
            font-size: 4rem;
            color: var(--gold);
            filter: drop-shadow(0 0 20px rgba(192, 163, 117, 0.6));
        }

        .alert-name {
            font-family: 'Exocet', serif;
            font-size: 4rem;
            color: #ffffff;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 25px var(--crimson-bright), 0 5px 15px #000;
        }

        .alert-footer {
            margin-top: 20px;
            font-size: 1.3rem;
            color: #ccc;
            letter-spacing: 3px;
            font-style: italic;
            text-transform: uppercase;
        }

        /* ANIMACIONES */
        .animate-alert {
            animation: alertShow 8s ease-in-out forwards;
        }

        .animate-flash {
            animation: flashScale 8s ease-in-out forwards;
        }

        @keyframes alertShow {
            0% { opacity: 0; transform: scale(0.5) skewX(-20deg) translateY(200px); }
            5% { opacity: 1; transform: scale(1.1) skewX(-5deg) translateY(0); }
            8% { transform: scale(1) skewX(-5deg); }
            92% { opacity: 1; transform: scale(1) skewX(-5deg); }
            100% { opacity: 0; transform: scale(1.3) skewX(10deg) translateY(-200px); }
        }

        @keyframes flashScale {
            0% { opacity: 0; transform: scale(0.5); }
            5% { opacity: 0.8; transform: scale(1.5); }
            20% { opacity: 0.4; transform: scale(1.2); }
            80% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(2.5); }
        }

        /* PARTÍCULAS DE SANGRE */
        .blood-drop {
            position: absolute;
            background: var(--crimson);
            border-radius: 50%;
            pointer-events: none;
            z-index: 150;
        }
    </style>
</head>
<body>

    <div class="alert-wrapper" id="alert-wrapper">
        <div class="alert-flash" id="alert-flash"></div>
        <div class="alert-box" id="alert-box">
            <div class="alert-header" id="alert-type">NUEVO GUERRERO</div>
            <div class="alert-content">
                <i class="fas fa-sword alert-icon" id="alert-icon"></i>
                <div class="alert-name" id="alert-name">PLAYER_NAME</div>
            </div>
            <div class="alert-footer" id="alert-message">¡Bienvenido a MU OLIMPO!</div>
        </div>
    </div>

    <script>
        let lastUser = null;
        let lastChar = null;
        let isFirstLoad = true;

        async function checkStats() {
            try {
                let response = await fetch('/api/stats').catch(() => null);
                if (!response || !response.ok) {
                    response = await fetch('../latest-stats.json?t=' + Date.now());
                }
                if (!response.ok) return;
                
                const data = await response.json();
                
                if (isFirstLoad) {
                    lastUser = data.latestUser;
                    lastChar = data.latestCharacter?.name;
                    isFirstLoad = false;
                    return;
                }

                // Check for new user
                if (data.latestUser && data.latestUser !== lastUser) {
                    lastUser = data.latestUser;
                    triggerAlert('NUEVO REGISTRO', lastUser, '¡Se ha unido a la legión!', 'fa-user-plus');
                } 
                // Check for new character
                else if (data.latestCharacter?.name && data.latestCharacter.name !== lastChar) {
                    lastChar = data.latestCharacter.name;
                    triggerAlert('NUEVO PERSONAJE', lastChar, '¡Un nuevo héroe ha nacido!', 'fa-sword');
                }

            } catch (e) {
                console.error("Error polling stats:", e);
            }
        }

        function triggerAlert(type, name, message, iconClass) {
            const wrapper = document.getElementById('alert-wrapper');
            const flash = document.getElementById('alert-flash');
            const box = document.getElementById('alert-box');
            
            document.getElementById('alert-type').innerText = type;
            document.getElementById('alert-name').innerText = name.toUpperCase();
            document.getElementById('alert-message').innerText = message;
            
            const icon = document.getElementById('alert-icon');
            icon.className = `fas ${iconClass} alert-icon`;

            wrapper.style.display = 'flex';
            
            // Reiniciar animaciones
            box.classList.remove('animate-alert');
            flash.classList.remove('animate-flash');
            void box.offsetWidth; // Trigger reflow
            box.classList.add('animate-alert');
            flash.classList.add('animate-flash');

            // Partículas
            createParticles();

            setTimeout(() => {
                wrapper.style.display = 'none';
            }, 8000);
        }

        function createParticles() {
            for(let i=0; i<40; i++) {
                const p = document.createElement('div');
                p.className = 'blood-drop';
                
                const size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                
                p.style.left = '50%';
                p.style.top = '50%';
                
                const angle = Math.random() * Math.PI * 2;
                const dist = 150 + Math.random() * 300;
                const duration = 1000 + Math.random() * 1500;
                
                p.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(${-50 + Math.cos(angle)*dist}px, ${-50 + Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
                ], { duration: duration, easing: 'ease-out' });
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), duration);
            }
        }

        // Poll every 5 seconds
        setInterval(checkStats, 5000);
        
        // Demo shortcuts for testing
        window.testAlert = (type = 'NUEVO GUERRERO') => {
            triggerAlert(type, 'Leonardo_Dev', '¡Se ha unido a la legión!', 'fa-user-plus');
        };

    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
