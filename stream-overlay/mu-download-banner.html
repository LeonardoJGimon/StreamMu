<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU NEUTRO - Download Banner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face { 
            font-family: 'ExocetReal'; 
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); 
        }

        :root {
            --gold-shine: #ffffff;
            --gold-light: #f0d7a9;
            --gold-mid: #c0a375;
            --gold-dark: #6e501e;
            --fire: #7e0000;
            --bg-dark: #020202;
        }

        body {
            margin: 0; padding: 0; background: transparent;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; font-family: 'ExocetReal', serif;
        }

        .download-container {
            width: 750px; height: 130px;
            background: linear-gradient(135deg, #0a0a0a 0%, #000 100%);
            border: 2px solid var(--gold-mid);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px rgba(0,0,0,1), inset 0 0 20px rgba(126, 0, 0, 0.4);
            overflow: hidden;
            clip-path: polygon(3% 0%, 97% 0%, 100% 50%, 97% 100%, 3% 100%, 0% 50%);
            border-image: linear-gradient(to right, var(--gold-dark), var(--gold-light), var(--gold-dark)) 1;
        }

        /* BRILLO QUE PASA (GLINT) */
        .download-container::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            animation: glint 5s infinite;
        }

        @keyframes glint {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .content-wrapper {
            display: flex; align-items: center; gap: 30px; z-index: 10;
        }

        .main-icon {
            font-size: 3.5rem;
            color: var(--gold-light);
            filter: drop-shadow(0 0 10px var(--fire));
            animation: iconPulse 2s infinite ease-in-out;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--fire)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 20px var(--gold-light)); }
        }

        .text-group {
            display: flex; flex-direction: column; align-items: flex-start;
        }

        .main-text {
            font-size: 3.2rem;
            margin: 0;
            line-height: 1;
            background: linear-gradient(to bottom, 
                var(--gold-shine) 0%, 
                var(--gold-light) 25%, 
                var(--gold-mid) 50%, 
                var(--gold-dark) 52%, 
                var(--gold-mid) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,1));
            letter-spacing: 4px;
        }

        .url-text {
            font-size: 2.2rem;
            color: #fff;
            font-weight: 900;
            letter-spacing: 3px;
            margin-top: 5px;
            text-shadow: 0 0 15px var(--fire), 0 0 5px #000;
            opacity: 1;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        /* CHISPAS */
        .spark { position: absolute; background: var(--gold-light); border-radius: 50%; animation: floatUp 4s infinite linear; opacity: 0; }
        @keyframes floatUp {
            0% { transform: translateY(100px) scale(1); opacity: 0; }
            30% { opacity: 0.6; }
            100% { transform: translateY(-100px) translateX(20px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="download-container">
        <div id="spark-container"></div>

        <div class="content-wrapper">
            <i class="fas fa-download main-icon"></i>
            <div class="text-group">
                <h1 class="main-text">¡DESCARGALO YA!</h1>
                <div class="url-text">WWW.MU-NEUTRO.COM</div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('spark-container');
        for(let i=0; i<10; i++) {
            let spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.width = Math.random() * 2 + 'px';
            spark.style.height = spark.style.width;
            spark.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(spark);
        }
    </script>
</body>
</html>
