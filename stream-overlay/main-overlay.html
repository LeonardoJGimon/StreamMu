<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Master Overlay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
            font-weight: 400;
        }

        :root {
            --crimson: #9d0a0e;
            --gold: #c0a375;
            --bg-dark: #0a0505;
        }

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px; /* Tamaño fijo para OBS */
            background: #000 url('https://i.imgur.com/HQroNDd.png') no-repeat center center;
            background-size: cover;
            font-family: 'Alegreya', serif;
            overflow: hidden;
            color: white;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6); /* Fondo semi-transparente para ver el juego */
            z-index: 0;
        }

        .fog-container {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(157, 10, 14, 0.2) 0%, transparent 80%);
            z-index: 1;
        }

        /* LAYOUT PRINCIPAL */
        .master-grid {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 400px;
            grid-template-rows: 100px 1fr 80px;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ÁREA DE JUEGO (HUECO) */
        .game-window {
            grid-row: 1 / 3;
            background: rgba(0,0,0,0.3);
            border: 2px solid var(--crimson);
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 4px;
        }

        .game-window::after {
            content: 'GAME CAPTURE';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Exocet', serif;
            opacity: 0.1;
            font-size: 3rem;
        }

        /* ESQUINAS GÓTICAS PARA EL JUEGO */
        .corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 5px solid var(--crimson);
            z-index: 5;
        }
        .tl { top: -8px; left: -8px; border-right: none; border-bottom: none; }
        .tr { top: -8px; right: -8px; border-left: none; border-bottom: none; }
        .bl { bottom: -8px; left: -8px; border-right: none; border-top: none; }
        .br { bottom: -8px; right: -8px; border-left: none; border-top: none; }

        /* CÁMARA */
        .camera-window {
            background: #000;
            border: 2px solid var(--gold);
            aspect-ratio: 16/9;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        /* CHAT INTEGRADO */
        .chat-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px;
            overflow: hidden;
            mask-image: linear-gradient(to top, black 90%, transparent 100%);
        }

        .chat-title {
            font-family: 'Exocet', serif;
            color: var(--crimson);
            font-size: 1rem;
            letter-spacing: 4px;
            text-align: center;
            border-bottom: 1px solid var(--crimson);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* BARRA INFERIOR (TICKER) */
        .footer-bar {
            grid-column: 1 / 3;
            background: rgba(10, 5, 5, 0.9);
            border-top: 1px solid var(--crimson);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-label {
            font-family: 'Exocet', serif;
            font-size: 0.7rem;
            color: var(--crimson);
            letter-spacing: 2px;
        }

        .info-value {
            font-weight: 700;
            color: var(--gold);
            font-size: 1.1rem;
        }

        /* LOGO */
        .logo-box {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 80px;
            filter: drop-shadow(0 0 10px var(--crimson));
            animation: pulseLogo 4s infinite ease-in-out;
        }

        .server-name {
            font-family: 'Exocet', serif;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--crimson);
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* MENSAJES DE CHAT */
        .msg {
            animation: msgIn 0.4s ease-out forwards;
            margin-bottom: 10px;
        }
        .msg-user { color: var(--gold); font-family: 'Exocet', serif; font-size: 0.8rem; }
        .msg-text { color: #ccc; font-size: 0.95rem; }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>
    <div class="fog-container"></div>

    <div class="logo-box">
        <img src="../assets/images/logo/logosimple.png" class="logo-img">
        <span class="server-name">MU OLIMPO</span>
    </div>

    <div class="master-grid">
        <!-- ÁREA DE JUEGO -->
        <div class="game-window">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>

        <!-- LATERAL DERECHO (CÁMARA + CHAT) -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="camera-window">
                <!-- Marco de cámara se pone aquí -->
                <div class="corner tl" style="width:20px;height:20px;border-width:2px;"></div>
                <div class="corner tr" style="width:20px;height:20px;border-width:2px;"></div>
                <div class="corner bl" style="width:20px;height:20px;border-width:2px;"></div>
                <div class="corner br" style="width:20px;height:20px;border-width:2px;"></div>
                <div style="position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Exocet', serif; opacity:0.1;">CAMERA</div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-title">LEGION CHAT</div>
                <div id="chat-box" style="display: flex; flex-direction: column; justify-content: flex-end; height: 100%;">
                    <!-- Mensajes -->
                </div>
            </div>
        </div>

        <!-- BARRA INFERIOR -->
        <div class="footer-bar">
            <div class="info-item">
                <span class="info-label">LATEST WARRIOR</span>
                <span class="info-value" id="latest-user">LOADING...</span>
            </div>
            <div class="info-item">
                <span class="info-label">TOP HERO</span>
                <span class="info-value" id="top-hero">LOADING...</span>
            </div>
            <div class="info-item">
                <span class="info-label">SERVER STATUS</span>
                <span class="info-value" style="color: #2ecc71;">ONLINE</span>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const users = ["Arthan", "Valeria", "Grox", "Vayne"];
        const texts = ["Need party for BC", "Looking for trade", "MU OLIMPO is insane!", "GL everyone"];

        function addFakeMsg() {
            const u = users[Math.floor(Math.random() * users.length)];
            const t = texts[Math.floor(Math.random() * texts.length)];
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<div class="msg-user">${u}</div><div class="msg-text">${t}</div>`;
            chatBox.appendChild(div);
            if(chatBox.childNodes.length > 8) chatBox.removeChild(chatBox.firstChild);
        }

        async function fetchStats() {
            try {
                const res = await fetch('../latest-stats.json?t=' + Date.now());
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                document.getElementById('latest-user').innerText = (data.latestUser || "None").toUpperCase();
                if(data.topStrengthCharacters?.length) {
                    document.getElementById('top-hero').innerText = data.topStrengthCharacters[0].name.toUpperCase();
                }
            } catch(e) {}
        }

        setInterval(addFakeMsg, 5000);
        setInterval(fetchStats, 30000);
        fetchStats();
        addFakeMsg();
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
