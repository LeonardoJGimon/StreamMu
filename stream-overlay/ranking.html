<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Hall of Fame (Optimized)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); font-weight: 400; }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --row-bg: rgba(10, 8, 5, 0.9);
        }

        body {
            margin: 0; padding: 20px; background: transparent;
            font-family: 'Alegreya', serif; color: #ccc;
            width: 100%; min-height: 100vh; 
            display: flex; align-items: flex-end; justify-content: flex-end;
            overflow: hidden; box-sizing: border-box;
        }

        .outer-box {
            position: relative; background: rgba(0, 0, 0, 0.8); border: 2px solid var(--crimson);
            padding: 20px; width: 100%; max-width: 520px; box-sizing: border-box;
            box-shadow: 0 0 40px rgba(0,0,0,1), inset 0 0 20px rgba(157, 10, 14, 0.2);
            backdrop-filter: blur(8px);
            will-change: transform;
        }

        .outer-box::before, .outer-box::after {
            content: ''; position: absolute; width: 45px; height: 45px;
            z-index: 5;
        }
        .outer-box::before { 
            top: -8px; left: -8px; 
            border-top: 5px solid var(--crimson-bright); border-left: 5px solid var(--crimson-bright); 
            box-shadow: -5px -5px 15px rgba(255, 46, 46, 0.4);
        }
        .outer-box::after { 
            bottom: -8px; right: -8px; 
            border-bottom: 5px solid var(--crimson-bright); border-right: 5px solid var(--crimson-bright); 
            box-shadow: 5px 5px 15px rgba(255, 46, 46, 0.4);
        }

        .main-title {
            font-family: 'Exocet', serif; font-size: 1.5rem; color: var(--gold);
            letter-spacing: 6px; margin-bottom: 30px; text-align: center;
            text-transform: uppercase; text-shadow: 0 0 15px rgba(192, 163, 117, 0.4);
        }

        .hall-container { display: flex; flex-direction: column; gap: 20px; }

        .hall-card {
            display: grid; grid-template-columns: 80px 1fr 130px; gap: 20px;
            align-items: center; background: var(--row-bg); padding: 20px;
            position: relative; border: 1px solid rgba(157, 10, 14, 0.2);
            will-change: opacity, transform;
        }

        .category-label {
            position: absolute; top: -12px; left: 20px; background: var(--crimson);
            color: white; font-family: 'Exocet', serif; font-size: 0.7rem;
            padding: 4px 15px; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .avatar-container { width: 75px; height: 75px; position: relative; display: flex; align-items: center; justify-content: center; }
        .avatar-img { width: 100%; height: 100%; object-fit: contain; }
        
        .info-box { display: flex; flex-direction: column; gap: 5px; }
        .name { font-family: 'Exocet', serif; font-size: 1.6rem; color: #fff; text-shadow: 0 2px 5px #000; }
        .sub-info { font-size: 0.9rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

        .stat-box { text-align: right; }
        .stat-value { font-family: 'Exocet', serif; font-size: 1.8rem; color: #fff; }
        .stat-unit { font-size: 0.8rem; color: var(--gold); display: block; }

        .footer { margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .footer-tag { font-family: 'Exocet', serif; font-size: 0.7rem; color: #444; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div class="outer-box">
        <h1 class="main-title">SALÓN DE LA FAMA</h1>
        
        <div id="hall" class="hall-container">
            <!-- Dinámico -->
        </div>

        <div class="footer">
            <span class="footer-tag">MU OLIMPO Season 6</span>
        </div>
    </div>

    <script src="data-manager.js"></script>
    <script>
        const classMap = {
            0: { folder: 'SM', icon: 'dw-icon.png' },
            1: { folder: 'SM', icon: 'dw-icon.png' },
            2: { folder: 'SM', icon: 'dw-icon.png' },
            16: { folder: 'DK', icon: 'dk-icon.png' },
            17: { folder: 'DK', icon: 'dk-icon.png' },
            18: { folder: 'DK', icon: 'dk-icon.png' },
            32: { folder: 'FAIRY ELF', icon: 'elf-icon.png' },
            33: { folder: 'FAIRY ELF', icon: 'elf-icon.png' },
            48: { folder: 'MG', icon: 'mg icon.png' },
            50: { folder: 'MG', icon: 'mg icon.png' },
            64: { folder: 'DL', icon: 'dl icon.png' },
            66: { folder: 'DL', icon: 'dl icon.png' },
            80: { folder: 'SUMONNER', icon: 'sm icon.png' },
            81: { folder: 'SUMONNER', icon: 'sm icon.png' },
            96: { folder: 'RAGE', icon: 'rf icon.png' },
            98: { folder: 'RAGE', icon: 'rf icon.png' }
        };

        function guildMarkHexToDataUrl(hex, size = 80) {
            const raw = (hex || '').toString().trim();
            if (!raw || !/^[0-9a-fA-F]+$/.test(raw)) return '';
            try {
                const bytes = new Uint8Array(raw.length / 2);
                for (let i = 0; i < raw.length; i += 2) bytes[i / 2] = parseInt(raw.slice(i, i + 2), 16);
                const nibbles = [];
                for (const b of bytes) { nibbles.push((b >> 4) & 0xF); nibbles.push(b & 0xF); }
                if (nibbles.length < 64) return '';
                const palette = [[0,0,0,0],[0,0,0,255],[255,255,255,255],[255,0,0,255],[0,255,0,255],[0,0,255,255],[255,255,0,255],[255,0,255,255],[0,255,255,255],[160,160,160,255],[128,64,0,255],[255,128,0,255],[0,128,128,255],[128,0,128,255],[0,128,0,255],[128,0,0,255]];
                const canvas = document.createElement('canvas');
                canvas.width = 8; canvas.height = 8;
                const ctx = canvas.getContext('2d');
                const img = ctx.createImageData(8, 8);
                for (let i = 0; i < 64; i++) {
                    const [r, g, b, a] = palette[nibbles[i] & 0xF] || palette[0];
                    const off = i * 4;
                    img.data[off] = r; img.data[off + 1] = g; img.data[off + 2] = b; img.data[off + 3] = a;
                }
                ctx.putImageData(img, 0, 0);
                const out = document.createElement('canvas');
                out.width = size; out.height = size;
                const octx = out.getContext('2d');
                octx.imageSmoothingEnabled = false;
                octx.drawImage(canvas, 0, 0, size, size);
                return out.toDataURL('image/png');
            } catch (e) { return ''; }
        }

        let lastDataStr = "";

        window.onMuData((data) => {
            const dataStr = JSON.stringify(data);
            if (dataStr !== lastDataStr) {
                render(data);
                lastDataStr = dataStr;
            }
        });

        function render(data) {
            const hallEl = document.getElementById('hall');
            let html = '';

            if (data.topStrengthCharacters && data.topStrengthCharacters.length > 0) {
                const c = data.topStrengthCharacters[0];
                html += createCardHtml('REY DE RESETS', c.name, `NIVEL ${c.level} / ${c.resets} RR`, c.resets, 'RESETS', c.classId);
            }

            if (data.topGuild) {
                const g = data.topGuild;
                const logo = guildMarkHexToDataUrl(g.G_Mark, 80) || '../assets/images/logo/logosimple.png';
                html += createCardHtml('CLAN SUPREMO', g.G_Name, `LÍDER: ${g.G_Master || '-'}`, g.G_Score ?? 0, 'PUNTOS', null, logo);
            }

            if (data.topPvP) {
                const p = data.topPvP;
                html += createCardHtml('ASESINO DE ÉLITE', p.Name, 'MÁS PVP KILLS', p.PkCount ?? 0, 'MUERTES', p.Class || 0);
            }

            hallEl.innerHTML = html;
        }

        function createCardHtml(category, name, sub, val, unit, classId, manualIcon) {
            const info = classMap[classId] || classMap[0];
            const iconPath = manualIcon || `../assets/images/chars/${info.folder}/${info.icon}`;
            return `
                <div class="hall-card">
                    <span class="category-label">${category}</span>
                    <div class="avatar-container">
                        <img src="${iconPath}" class="avatar-img" onerror="this.src='../assets/images/characters/DW.png'">
                    </div>
                    <div class="info-box">
                        <div class="name">${name}</div>
                        <div class="sub-info">${sub}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${val}</div>
                        <div class="stat-unit">${unit}</div>
                    </div>
                </div>
            `;
        }
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
