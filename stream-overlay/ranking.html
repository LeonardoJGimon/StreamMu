<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Hall of Fame (Oficial)</title>
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); font-weight: 400; }

        :root {
            --bg-dark: #1e1e1e;
            --row-bg: #141414;
            --crimson: #8b0000;
            --gold: #c0a375;
            --white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            background: transparent;
            font-family: 'Alegreya', sans-serif;
            overflow: hidden;
            width: 1920px; height: 1080px;
        }

        /* CONTENEDOR PRINCIPAL (Sincronizado con Guerreros) */
        .widget-box {
            position: absolute;
            bottom: 50px;
            right: 50px; /* En el lado derecho para balancear el stream */
            width: 520px;
            background: var(--bg-dark);
            border: 1px solid var(--crimson);
            padding: 25px;
            box-shadow: -10px 10px 40px rgba(0,0,0,0.8);
        }

        .title {
            font-family: 'Exocet', serif;
            font-size: 1.1rem;
            color: var(--gold);
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--crimson);
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* FILA DE RANKING */
        .rank-row {
            display: flex;
            align-items: center;
            background: var(--row-bg);
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.5s ease forwards;
        }

        .category-icon {
            width: 40px;
            height: 40px;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.5rem;
            border: 1px solid var(--gold);
            border-radius: 50%;
        }

        .rank-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .rank-label {
            font-size: 0.75rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .rank-name {
            font-family: 'Exocet', serif;
            font-size: 1.2rem;
            color: var(--white);
            letter-spacing: 1px;
        }

        .rank-value {
            font-size: 0.95rem;
            color: var(--gold);
            font-style: italic;
            font-weight: bold;
            text-align: right;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="widget-box">
        <h1 class="title">HALL OF FAME</h1>
        <div class="divider"></div>
        <div id="ranking-list" class="list-wrapper">
            <!-- Cargando Ranking... -->
        </div>
    </div>

    <script>
        async function updateRanking() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) return;
                const data = await res.json();
                
                const topResets = data.topStrengthCharacters ? data.topStrengthCharacters[0] : null;
                const topGuild = data.topGuild;
                const topPvP = data.topPvP;

                let html = '';

                // 1. REY DE RESETS
                if (topResets) {
                    html += createRow('fa-crown', 'Rey de Resets', topResets.name, `${topResets.resets} RR`);
                }

                // 2. CLAN SUPREMO
                if (topGuild) {
                    html += createRow('fa-shield-halved', 'Clan Supremo', topGuild.G_Name, `${topGuild.G_Score} Pts`);
                }

                // 3. ASESINO DE ÉLITE
                if (topPvP) {
                    html += createRow('fa-skull', 'Asesino de Élite', topPvP.Name, `${topPvP.PkCount} Kills`);
                }

                document.getElementById('ranking-list').innerHTML = html;
            } catch (e) { console.error(e); }
        }

        function createRow(icon, label, name, value) {
            return `
                <div class="rank-row">
                    <div class="category-icon"><i class="fas ${icon}"></i></div>
                    <div class="rank-info">
                        <span class="rank-label">${label}</span>
                        <span class="rank-name">${name}</span>
                    </div>
                    <div class="rank-value">${value}</div>
                </div>
            `;
        }

        setInterval(updateRanking, 30000);
        updateRanking();
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
