<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Hall of Fame (Epic Edition)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); font-weight: 400; }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --row-bg: rgba(15, 10, 10, 0.9);
        }

        body {
            margin: 0; padding: 15px; background: transparent;
            font-family: 'Alegreya', serif; color: #ccc;
            width: 100vw; display: flex; justify-content: flex-start; overflow-x: hidden;
        }

        .outer-box {
            position: relative; background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(157, 10, 14, 0.4);
            padding: 25px; width: 100%; max-width: 600px; box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0,0,0,1); backdrop-filter: blur(8px);
        }

        .outer-box::before {
            content: ''; position: absolute; top: -6px; left: -6px; width: 40px; height: 40px;
            border-top: 4px solid var(--crimson-bright); border-left: 4px solid var(--crimson-bright);
        }

        .outer-box::after {
            content: ''; position: absolute; bottom: -6px; right: -6px; width: 40px; height: 40px;
            border-bottom: 4px solid var(--crimson-bright); border-right: 4px solid var(--crimson-bright);
        }

        .main-title {
            font-family: 'Exocet', serif; font-size: 1.5rem; color: var(--gold);
            letter-spacing: 6px; margin-bottom: 30px; text-align: center;
            text-transform: uppercase; text-shadow: 0 0 15px rgba(192, 163, 117, 0.4);
        }

        .hall-container { display: flex; flex-direction: column; gap: 20px; }

        .hall-card {
            display: grid; grid-template-columns: 100px 1fr 130px; gap: 20px;
            align-items: center; background: var(--row-bg); padding: 20px;
            position: relative; border: 1px solid rgba(157, 10, 14, 0.2);
            animation: fadeIn 0.8s ease-out forwards;
        }

        .category-label {
            position: absolute; top: -12px; left: 20px; background: var(--crimson);
            color: white; font-family: 'Exocet', serif; font-size: 0.7rem;
            padding: 4px 15px; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .avatar-container { width: 95px; height: 95px; position: relative; display: flex; align-items: center; justify-content: center; }
        .avatar-img { width: 100%; height: 100%; object-fit: contain; }
        
        .info-box { display: flex; flex-direction: column; gap: 5px; }
        .name { font-family: 'Exocet', serif; font-size: 1.6rem; color: #fff; text-shadow: 0 2px 5px #000; }
        .sub-info { font-size: 0.9rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

        .stat-box { text-align: right; }
        .stat-value { font-family: 'Exocet', serif; font-size: 1.8rem; color: #fff; }
        .stat-unit { font-size: 0.8rem; color: var(--crimson); display: block; }

        .footer { margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .footer-tag { font-family: 'Exocet', serif; font-size: 0.7rem; color: #444; letter-spacing: 3px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="outer-box">
        <h1 class="main-title">HALL OF FAME</h1>
        
        <div id="hall" class="hall-container">
            <!-- Bloques cargados vía JS -->
        </div>

        <div class="footer">
            <span class="footer-tag">Mu Neutro Season 6</span>
        </div>
    </div>

    <script>
        const classMap = {
            0: { folder: 'SM', icon: 'dw-icon.png' },
            1: { folder: 'SM', icon: 'dw-icon.png' },
            2: { folder: 'SM', icon: 'dw-icon.png' },
            16: { folder: 'DK', icon: 'dk-icon.png' },
            17: { folder: 'DK', icon: 'dk-icon.png' },
            18: { folder: 'DK', icon: 'dk-icon.png' },
            32: { folder: 'FAIRY ELF', icon: 'elf-icon.png' },
            33: { folder: 'FAIRY ELF', icon: 'elf-icon.png' },
            48: { folder: 'MG', icon: 'mg icon.png' },
            50: { folder: 'MG', icon: 'mg icon.png' },
            64: { folder: 'DL', icon: 'dl icon.png' },
            66: { folder: 'DL', icon: 'dl icon.png' },
            80: { folder: 'SUMONNER', icon: 'sm icon.png' },
            81: { folder: 'SUMONNER', icon: 'sm icon.png' },
            96: { folder: 'RAGE', icon: 'rf icon.png' },
            98: { folder: 'RAGE', icon: 'rf icon.png' }
        };

        async function update() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) return;
                const data = await res.json();

                let html = '';

                // 1. REY DE RESETS
                if (data.topStrengthCharacters && data.topStrengthCharacters.length > 0) {
                    const topRR = data.topStrengthCharacters[0];
                    html += createCard('REY DE RESETS', topRR.name, 'PUESTO #1 RR', topRR.resets, 'RESETS', topRR.classId);
                }

                // 2. CLAN SUPREMO
                if (data.topGuild) {
                    html += createCard('CLAN SUPREMO', data.topGuild.G_Name, 'CLAN LÍDER', data.topGuild.G_Score, 'SCORE', null, '../assets/images/characters/GUILD.png');
                }

                // 3. ASESINO DE ÉLITE
                if (data.topPvP) {
                    html += createCard('ASESINO DE ÉLITE', data.topPvP.Name, 'MÁS PVP KILLS', data.topPvP.PkCount || 0, 'KILLS', data.topPvP.Class);
                }

                document.getElementById('hall').innerHTML = html;
            } catch (e) { console.error(e); }
        }

        function createCard(category, name, sub, val, unit, classId, manualIcon) {
            const info = classMap[classId] || classMap[0];
            const iconPath = manualIcon || `../assets/images/chars/${info.folder}/${info.icon}`;
            return `
                <div class="hall-card">
                    <span class="category-label">${category}</span>
                    <div class="avatar-container">
                        <img src="${iconPath}" class="avatar-img" onerror="this.src='../assets/images/characters/DW.png'">
                    </div>
                    <div class="info-box">
                        <div class="name">${name}</div>
                        <div class="sub-info">${sub}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${val}</div>
                        <div class="stat-unit">${unit}</div>
                    </div>
                </div>
            `;
        }

        setInterval(update, 30000);
        update();
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
