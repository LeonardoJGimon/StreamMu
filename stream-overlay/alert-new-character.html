<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Alerta Jugador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff0000;
            --gold: #c0a375;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Exocet', serif;
        }

        #alert-container {
            display: none;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* PERSONAJE */
        .char-container {
            position: relative;
            width: 450px;
            height: 450px;
            margin-bottom: -80px;
            z-index: 5;
            opacity: 0;
            transform: translateY(100px);
        }
        .char-container.active { animation: charIn 0.6s ease-out forwards 0.3s; }
        @keyframes charIn { to { opacity: 1; transform: translateY(0); } }

        .char-img {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px var(--crimson-bright));
        }

        /* BANNER */
        .banner-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 900px;
            height: 160px;
        }

        .red-bar {
            position: absolute;
            width: 200px; height: 35px;
            background: linear-gradient(to right, var(--crimson), var(--crimson-bright));
            z-index: 1;
            transform: scaleX(0);
        }
        .bar-l { left: 0; transform: skewX(-45deg) scaleX(0); }
        .bar-r { right: 0; transform: skewX(45deg) scaleX(0); }

        .banner-main {
            position: relative;
            width: 650px; /* Más ancho para que quepa el nombre */
            height: 110px;
            background: #000;
            border-bottom: 4px solid var(--crimson-bright);
            clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transform: scaleY(0);
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .banner-main.active { animation: expandY 0.4s ease-out forwards; }
        .bar-l.active { animation: shootL 0.4s ease-out forwards 0.4s; }
        .bar-r.active { animation: shootR 0.4s ease-out forwards 0.4s; }

        @keyframes expandY { to { transform: scaleY(1); } }
        @keyframes shootL { to { transform: skewX(-45deg) scaleX(1); } }
        @keyframes shootR { to { transform: skewX(45deg) scaleX(1); } }

        /* TEXTOS AJUSTADOS */
        .label-new {
            color: var(--crimson-bright);
            font-size: 1.1rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            margin-bottom: 5px;
        }

        .player-name {
            color: #fff;
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
            opacity: 0;
        }

        .player-class {
            position: absolute;
            bottom: -25px;
            color: var(--gold);
            font-size: 0.9rem;
            letter-spacing: 5px;
            opacity: 0;
        }

        .label-new.active { animation: fadeIn 0.4s forwards 0.7s; }
        .player-name.active { animation: fadeIn 0.4s forwards 0.8s; }
        .player-class.active { animation: fadeIn 0.4s forwards 1s; }

        @keyframes fadeIn { to { opacity: 1; } }

        /* BOTÓN TEST */
        #test-btn {
            position: fixed; bottom: 20px; left: 20px; z-index: 1000;
            background: #000; border: 1px solid var(--crimson); color: #fff;
            padding: 8px 15px; cursor: pointer; font-family: 'Exocet', serif;
            font-size: 0.7rem; opacity: 0.2;
        }
        #test-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div id="test-btn" onclick="triggerTest()">Test Alert (T)</div>

    <div id="alert-container">
        <div class="char-container" id="char-cont">
            <img id="alert-img" src="" class="char-img">
        </div>

        <div class="banner-wrapper">
            <div class="red-bar bar-l" id="bar-l"></div>
            <div class="banner-main" id="b-main">
                <span class="label-new" id="l-new">NUEVO JUGADOR</span>
                <h1 id="alert-name" class="player-name">NAME</h1>
                <div id="alert-class" class="player-class">CLASS</div>
            </div>
            <div class="red-bar bar-r" id="bar-r"></div>
        </div>
    </div>

    <script>
        const charData = {
            0:  { name: 'Mago', folder: 'SM', img: 'dw-icon.png' },
            16: { name: 'Guerrero', folder: 'DK', img: 'dk-icon.png' },
            32: { name: 'Elfa', folder: 'FAIRY ELF', img: 'elf-icon.png' },
            48: { name: 'Gladiador', folder: 'MG', img: 'mg icon.png' },
            64: { name: 'Señor Oscuro', folder: 'DL', img: 'dl icon.png' },
            80: { name: 'Invocadora', folder: 'SUMONNER', img: 'sm icon.png' },
            96: { name: 'Luchador', folder: 'RAGE', img: 'rf icon.png' }
        };

        let isDisplaying = false;
        let lastChar = null;

        async function check() {
            if (isDisplaying) return;
            try {
                const res = await fetch('/api/stats?t='+Date.now());
                const data = await res.json();
                if (!data.recentCharacters?.length) return;
                const newest = data.recentCharacters[0];
                if (!lastChar) { lastChar = newest.name; return; }
                if (newest.name !== lastChar) { lastChar = newest.name; trigger(newest); }
            } catch(e){}
        }

        function trigger(char) {
            isDisplaying = true;
            const els = {
                cont: document.getElementById('alert-container'),
                char: document.getElementById('char-cont'),
                main: document.getElementById('b-main'),
                barL: document.getElementById('bar-l'),
                barR: document.getElementById('bar-r'),
                name: document.getElementById('alert-name'),
                class: document.getElementById('alert-class'),
                lNew: document.getElementById('l-new'),
                img: document.getElementById('alert-img')
            };

            const info = charData[char.classId] || charData[0];
            els.name.innerText = char.name;
            els.class.innerText = info.name;
            els.img.src = `../assets/images/chars/${info.folder}/${info.img}`;

            els.cont.style.display = 'flex';
            Object.values(els).forEach(el => { if(el.classList) el.classList.remove('active', 'exit-alert'); });

            setTimeout(() => {
                els.main.classList.add('active');
                els.barL.classList.add('active');
                els.barR.classList.add('active');
                els.char.classList.add('active');
                els.lNew.classList.add('active');
                els.name.classList.add('active');
                els.class.classList.add('active');
            }, 50);

            setTimeout(() => {
                els.cont.style.opacity = '0';
                setTimeout(() => { els.cont.style.display = 'none'; els.cont.style.opacity = '1'; isDisplaying = false; }, 600);
            }, 6000);
        }

        function triggerTest() {
            if (isDisplaying) return;
            trigger({ name: 'LEONARDO_GIMON', classId: 0 });
        }

        window.onkeydown = (e) => { if(e.key.toLowerCase()==='t') triggerTest(); };
        setInterval(check, 10000);
        check();
    </script>
</body>
</html>
