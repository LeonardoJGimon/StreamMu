<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Alerta Nuevo Guerrero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --deep-bg: rgba(10, 5, 5, 0.95);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Exocet', serif;
        }

        #alert-container {
            display: none;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 800px;
            height: 600px;
            perspective: 1000px;
        }

        /* FONDO DE PARTÍCULAS (Simulado con gradientes y animación) */
        .particles {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(157, 10, 14, 0.1) 0%, transparent 70%);
            z-index: 1;
        }

        /* FLASH DE IMPACTO */
        .flash-impact {
            position: absolute;
            width: 100%; height: 100%;
            background: white;
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0;
            z-index: 100;
            pointer-events: none;
        }
        .flash-impact.active { animation: impactAnim 1s ease-out forwards; }

        @keyframes impactAnim {
            0% { transform: scale(0.1); opacity: 1; background: #fff; }
            50% { transform: scale(1.5); opacity: 0.5; background: var(--crimson-bright); }
            100% { transform: scale(2); opacity: 0; }
        }

        /* CUERPO DE LA ALERTA */
        .alert-box {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.8) translateY(50px);
        }

        .alert-box.active {
            animation: boxIn 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.2) forwards;
        }

        @keyframes boxIn {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* MARCO DEL PERSONAJE */
        .avatar-frame {
            position: relative;
            width: 350px; height: 350px;
            margin-bottom: 30px;
        }

        .avatar-frame::before {
            content: ''; position: absolute; inset: -15px;
            border: 2px solid var(--gold);
            clip-path: polygon(0 15%, 15% 0, 85% 0, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0 85%);
            box-shadow: inset 0 0 30px var(--crimson);
            animation: borderPulse 2s infinite alternate;
        }

        @keyframes borderPulse {
            from { opacity: 0.5; box-shadow: inset 0 0 20px var(--crimson); }
            to { opacity: 1; box-shadow: inset 0 0 50px var(--crimson-bright); }
        }

        .char-avatar {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px var(--crimson));
            z-index: 5;
        }

        /* TEXTOS */
        .label-top {
            color: #fff;
            font-size: 1.2rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.8;
            text-shadow: 0 0 10px #000;
        }

        .char-name {
            font-size: 4.5rem;
            background: linear-gradient(to bottom, #fff 20%, var(--gold) 50%, #8a6d3b 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 0;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
            animation: textGlow 2s infinite alternate;
        }

        @keyframes textGlow {
            from { filter: drop-shadow(0 0 5px rgba(192, 163, 117, 0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(192, 163, 117, 0.6)); }
        }

        .char-class {
            color: var(--crimson-bright);
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin-top: 10px;
            font-weight: bold;
            text-transform: uppercase;
            border-top: 1px solid rgba(192, 163, 117, 0.3);
            padding-top: 10px;
            width: 100%;
            text-align: center;
        }

        /* SALIDA */
        .alert-box.exit {
            animation: boxOut 0.6s ease-in forwards;
        }

        @keyframes boxOut {
            to { opacity: 0; transform: scale(1.2) translateY(-100px); filter: blur(20px); }
        }
    </style>
</head>
<body>

    <div id="test-btn" onclick="triggerTest()" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: #000; border: 2px solid var(--crimson); color: #fff; padding: 10px 20px; cursor: pointer; font-family: 'Exocet', serif; font-size: 0.8rem; letter-spacing: 2px; transition: 0.3s; opacity: 0.8; border-radius: 4px; text-transform: uppercase; box-shadow: 0 0 15px rgba(0,0,0,1);" onmouseover="this.style.opacity=1; this.style.borderColor='var(--gold)'" onmouseout="this.style.opacity=0.8; this.style.borderColor='var(--crimson)'">
        Test Alert (T)
    </div>

    <div id="alert-container">
        <div class="particles"></div>
        <div class="flash-impact" id="flash"></div>
        
        <div id="alert-box" class="alert-box">
            <span class="label-top">Un nuevo guerrero ha despertado</span>
            
            <div class="avatar-frame">
                <img id="alert-img" src="" class="char-avatar">
            </div>

            <h1 id="alert-name" class="char-name">-</h1>
            <div id="alert-class" class="char-class">-</div>
        </div>
    </div>

    <script>
        const charData = {
            0:  { name: 'Mago', folder: 'SM', img: 'dw-icon.png' },
            16: { name: 'Guerrero', folder: 'DK', img: 'dk-icon.png' },
            32: { name: 'Elfa', folder: 'FAIRY ELF', img: 'elf-icon.png' },
            48: { name: 'Gladiador', folder: 'MG', img: 'mg icon.png' },
            64: { name: 'Señor Oscuro', folder: 'DL', img: 'dl icon.png' },
            80: { name: 'Invocadora', folder: 'SUMONNER', img: 'sm icon.png' },
            96: { name: 'Luchador', folder: 'RAGE', img: 'rf icon.png' }
        };

        let lastCharacterName = null;
        let isDisplaying = false;

        async function checkAlerts() {
            if (isDisplaying) return;
            try {
                const res = await fetch('/api/stats?t=' + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                if (!data.recentCharacters || data.recentCharacters.length === 0) return;
                
                const newest = data.recentCharacters[0];

                if (lastCharacterName === null) {
                    lastCharacterName = newest.name;
                    return;
                }

                if (newest.name !== lastCharacterName) {
                    lastCharacterName = newest.name;
                    triggerAlert(newest);
                }
            } catch (e) { console.error(e); }
        }

        function triggerAlert(char) {
            isDisplaying = true;
            const container = document.getElementById('alert-container');
            const box = document.getElementById('alert-box');
            const flash = document.getElementById('flash');
            const nameEl = document.getElementById('alert-name');
            const classEl = document.getElementById('alert-class');
            const imgEl = document.getElementById('alert-img');

            const info = charData[char.classId] || charData[0];
            nameEl.innerText = char.name;
            classEl.innerText = info.name;
            imgEl.src = `../assets/images/chars/${info.folder}/${info.img}`;

            container.style.display = 'flex';
            box.classList.remove('exit', 'active');
            
            // Disparar impacto
            flash.classList.add('active');
            
            setTimeout(() => {
                box.classList.add('active');
            }, 100);

            // Tiempo en pantalla (7 segundos para mayor impacto)
            setTimeout(() => {
                box.classList.add('exit');
                setTimeout(() => {
                    container.style.display = 'none';
                    flash.classList.remove('active');
                    isDisplaying = false;
                }, 600);
            }, 7000);
        }

        // Función para disparar un test manual
        function triggerTest() {
            if (isDisplaying) return;
            const classes = Object.keys(charData);
            const randomClass = classes[Math.floor(Math.random() * classes.length)];
            const dummyChar = {
                name: 'TEST_WARRIOR',
                classId: parseInt(randomClass)
            };
            triggerAlert(dummyChar);
        }

        // Tecla T para test
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't') triggerTest();
        });

        setInterval(checkAlerts, 10000);
        checkAlerts();
    </script>
</body>
</html>
