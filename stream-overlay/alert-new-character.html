<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Alerta Angular</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff0000;
            --gold: #c0a375;
            --bg-dark: #0a0a0a;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Exocet', serif;
        }

        #alert-container {
            display: none;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 1000px;
            height: 600px;
        }

        /* PERSONAJE AJUSTADO */
        .char-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: -60px; /* Integración con el banner */
            z-index: 5;
            opacity: 0;
            transform: translateY(100px) scale(0.8);
        }
        .char-container.active {
            animation: charReveal 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.2) forwards 0.3s;
        }
        @keyframes charReveal {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .char-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px var(--crimson-bright));
        }

        /* BANNER ANGULAR (ESTILO REFERENCIA) */
        .banner-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 800px;
            height: 140px;
            z-index: 10;
        }

        /* Barra Roja Lateral Izquierda */
        .red-bar-left {
            position: absolute;
            left: 50px;
            width: 150px; height: 40px;
            background: linear-gradient(to right, var(--crimson), var(--crimson-bright));
            transform: skewX(-45deg) scaleX(0);
            z-index: 1;
        }

        /* Barra Roja Lateral Derecha */
        .red-bar-right {
            position: absolute;
            right: 50px;
            width: 150px; height: 40px;
            background: linear-gradient(to left, var(--crimson), var(--crimson-bright));
            transform: skewX(45deg) scaleX(0);
            z-index: 1;
        }

        /* Cuerpo Principal (Negro Trapezoidal) */
        .banner-main {
            position: relative;
            width: 500px;
            height: 90px;
            background: #111;
            border-bottom: 3px solid var(--crimson-bright);
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transform: scaleY(0);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* ANIMACIONES DE BANNER */
        .banner-main.active { animation: bannerExpand 0.5s ease-out forwards; }
        .red-bar-left.active { animation: barShootLeft 0.5s ease-out forwards 0.4s; }
        .red-bar-right.active { animation: barShootRight 0.5s ease-out forwards 0.4s; }

        @keyframes bannerExpand {
            to { transform: scaleY(1); }
        }
        @keyframes barShootLeft {
            to { transform: skewX(-45deg) scaleX(1); left: 0; }
        }
        @keyframes barShootRight {
            to { transform: skewX(45deg) scaleX(1); right: 0; }
        }

        /* TEXTOS */
        .player-name {
            color: #fff;
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 5px;
            text-shadow: 0 0 15px var(--crimson-bright);
            opacity: 0;
        }
        .player-name.active { animation: fadeIn 0.4s forwards 0.7s; }

        .player-class {
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 10px;
            margin-top: -5px;
            opacity: 0;
        }
        .player-class.active { animation: fadeIn 0.4s forwards 0.9s; }

        @keyframes fadeIn { to { opacity: 1; } }

        /* EFECTO DE IMPACTO */
        .shockwave {
            position: absolute;
            width: 100px; height: 100px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            z-index: 0;
        }
        .shockwave.active { animation: shockAnim 0.6s ease-out forwards; }

        @keyframes shockAnim {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(8); opacity: 0; }
        }

        /* SALIDA */
        .exit-alert { animation: alertOut 0.5s ease-in forwards !important; }
        @keyframes alertOut {
            to { opacity: 0; transform: translateY(100px) scale(0.8); filter: blur(20px); }
        }

        /* BOTÓN DE TEST */
        #test-btn {
            position: fixed; bottom: 20px; left: 20px; z-index: 1000;
            background: #000; border: 1px solid var(--crimson); color: #fff;
            padding: 8px 15px; cursor: pointer; font-family: 'Exocet', serif;
            font-size: 0.7rem; letter-spacing: 2px; opacity: 0.2;
        }
        #test-btn:hover { opacity: 1; border-color: var(--gold); }
    </style>
</head>
<body>

    <div id="test-btn" onclick="triggerTest()">Test Alert (T)</div>

    <div id="alert-container">
        <div class="shockwave" id="shock"></div>
        
        <div class="char-container" id="char-cont">
            <img id="alert-img" src="" class="char-img">
        </div>

        <div class="banner-wrapper">
            <div class="red-bar-left" id="bar-l"></div>
            <div class="banner-main" id="b-main">
                <h1 id="alert-name" class="player-name">NAME</h1>
                <div id="alert-class" class="player-class">CLASS</div>
            </div>
            <div class="red-bar-right" id="bar-r"></div>
        </div>
    </div>

    <script>
        const charData = {
            0:  { name: 'Mago', folder: 'SM', img: 'dw-icon.png' },
            16: { name: 'Guerrero', folder: 'DK', img: 'dk-icon.png' },
            32: { name: 'Elfa', folder: 'FAIRY ELF', img: 'elf-icon.png' },
            48: { name: 'Gladiador', folder: 'MG', img: 'mg icon.png' },
            64: { name: 'Señor Oscuro', folder: 'DL', img: 'dl icon.png' },
            80: { name: 'Invocadora', folder: 'SUMONNER', img: 'sm icon.png' },
            96: { name: 'Luchador', folder: 'RAGE', img: 'rf icon.png' }
        };

        let isDisplaying = false;
        let lastChar = null;

        async function check() {
            if (isDisplaying) return;
            try {
                const res = await fetch('/api/stats?t='+Date.now());
                const data = await res.json();
                if (!data.recentCharacters?.length) return;
                const newest = data.recentCharacters[0];
                if (!lastChar) { lastChar = newest.name; return; }
                if (newest.name !== lastChar) { lastChar = newest.name; trigger(newest); }
            } catch(e){}
        }

        function trigger(char) {
            isDisplaying = true;
            const els = {
                cont: document.getElementById('alert-container'),
                char: document.getElementById('char-cont'),
                main: document.getElementById('b-main'),
                barL: document.getElementById('bar-l'),
                barR: document.getElementById('bar-r'),
                name: document.getElementById('alert-name'),
                class: document.getElementById('alert-class'),
                img: document.getElementById('alert-img'),
                shock: document.getElementById('shock')
            };

            const info = charData[char.classId] || charData[0];
            els.name.innerText = char.name;
            els.class.innerText = info.name;
            els.img.src = `../assets/images/chars/${info.folder}/${info.img}`;

            els.cont.style.display = 'flex';
            Object.values(els).forEach(el => { if(el.classList) el.classList.remove('active', 'exit-alert'); });

            setTimeout(() => {
                els.shock.classList.add('active');
                els.main.classList.add('active');
                els.barL.classList.add('active');
                els.barR.classList.add('active');
                els.char.classList.add('active');
                els.name.classList.add('active');
                els.class.classList.add('active');
            }, 50);

            setTimeout(() => {
                els.cont.classList.add('exit-alert');
                setTimeout(() => { els.cont.style.display = 'none'; isDisplaying = false; }, 600);
            }, 6000);
        }

        function triggerTest() {
            if (isDisplaying) return;
            trigger({ name: 'NUEVO_GUERRERO', classId: 16 });
        }

        window.onkeydown = (e) => { if(e.key.toLowerCase()==='t') triggerTest(); };
        setInterval(check, 10000);
        check();
    </script>
</body>
</html>
