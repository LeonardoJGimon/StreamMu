<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Alerta Nuevo Jugador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff0000;
            --gold: #c0a375;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Exocet', serif;
        }

        #alert-container {
            display: none;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* BANNER PRINCIPAL */
        .banner-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            max-width: 95vw;
        }

        .banner-main {
            position: relative;
            width: fit-content;
            min-width: 600px;
            padding: 20px 80px;
            background: rgba(0,0,0,0.95);
            border-bottom: 4px solid var(--crimson-bright);
            clip-path: polygon(50px 0%, calc(100% - 50px) 0%, 100% 100%, 0% 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transform: scaleY(0);
            box-shadow: 0 15px 50px rgba(0,0,0,1);
            white-space: nowrap;
        }

        .banner-main.active { animation: expandY 0.5s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards; }

        /* CONTENEDOR DE NOMBRE E IMAGEN */
        .content-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transform: translateY(20px);
        }
        .content-row.active { animation: slideUpFade 0.5s ease-out forwards 0.5s; }

        .char-mini {
            width: 110px; height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px var(--gold));
            image-rendering: -webkit-optimize-contrast;
            background: radial-gradient(circle, rgba(192, 163, 117, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            padding: 5px;
        }

        .player-name {
            color: #fff;
            font-size: 5.5rem; /* GIGANTE */
            margin: 0;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255,0,0,0.8), 0 0 5px #000;
        }

        /* ETIQUETAS */
        .label-top {
            color: var(--crimson-bright);
            font-size: 1.1rem;
            letter-spacing: 10px;
            margin-bottom: 5px;
            opacity: 0;
        }
        .label-top.active { animation: fadeIn 0.5s forwards 0.8s; }

        .welcome-msg {
            position: absolute;
            bottom: -35px;
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            text-shadow: 0 2px 4px #000;
        }
        .welcome-msg.active { animation: fadeIn 0.5s forwards 1.2s; }

        /* BARRAS LATERALES */
        .red-bar {
            position: absolute;
            width: 160px; height: 45px;
            background: linear-gradient(to right, #400, var(--crimson-bright), #400);
            z-index: 1;
            transform: scaleX(0);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255,0,0,0.4);
        }
        .bar-l { right: 100%; margin-right: -40px; transform: skewX(-45deg) scaleX(0); transform-origin: right; }
        .bar-r { left: 100%; margin-left: -40px; transform: skewX(45deg) scaleX(0); transform-origin: left; }

        .bar-text {
            color: #fff; font-size: 1.2rem; font-weight: bold; letter-spacing: 3px;
            transform: skewX(45deg); text-shadow: 0 2px 4px #000;
        }

        .bar-l.active { animation: shootL 0.5s ease-out forwards 0.4s; }
        .bar-r.active { animation: shootR 0.5s ease-out forwards 0.4s; }

        @keyframes expandY { to { transform: scaleY(1); } }
        @keyframes shootL { to { transform: skewX(-45deg) scaleX(1); } }
        @keyframes shootR { to { transform: skewX(45deg) scaleX(1); } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* BOTÓN TEST */
        #test-btn {
            position: fixed; bottom: 20px; left: 20px; z-index: 1000;
            background: #000; border: 1px solid var(--crimson); color: #fff;
            padding: 8px 15px; cursor: pointer; font-family: 'Exocet', serif;
            font-size: 0.7rem; opacity: 0.2;
        }
        #test-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div id="test-btn" onclick="triggerTest()">Test Alert (T)</div>

    <div id="alert-container">
        <div class="banner-wrapper">
            <!-- Barra Izquierda (Nivel) -->
            <div class="red-bar bar-l" id="bar-l">
                <span class="bar-text">LVL <span id="alert-lvl">1</span></span>
            </div>

            <!-- Contenido Central -->
            <div class="banner-main" id="b-main">
                <div class="label-top" id="l-top">NUEVO JUGADOR</div>
                
                <div class="content-row" id="c-row">
                    <img id="alert-img" src="" class="char-mini">
                    <h1 id="alert-name" class="player-name">NOMBRE</h1>
                </div>

                <div class="welcome-msg" id="w-msg">BIENVENIDO A MU NEUTRO</div>
            </div>

            <!-- Barra Derecha (Clase) -->
            <div class="red-bar bar-r" id="bar-r">
                <span class="bar-text" style="transform: skewX(-45deg);" id="alert-class">CLASS</span>
            </div>
        </div>
    </div>

    <script>
        const charData = {
            0:  { name: 'Mago', folder: 'SM', img: 'dw-icon.png' },
            16: { name: 'Guerrero', folder: 'DK', img: 'dk-icon.png' },
            32: { name: 'Elfa', folder: 'FAIRY ELF', img: 'elf-icon.png' },
            48: { name: 'Gladiador', folder: 'MG', img: 'mg icon.png' },
            64: { name: 'Señor Oscuro', folder: 'DL', img: 'dl icon.png' },
            80: { name: 'Invocadora', folder: 'SUMONNER', img: 'sm icon.png' },
            96: { name: 'Luchador', folder: 'RAGE', img: 'rf icon.png' }
        };

        let isDisplaying = false;
        let lastChar = null;

        async function check() {
            if (isDisplaying) return;
            try {
                const res = await fetch('/api/stats?t='+Date.now());
                const data = await res.json();
                if (!data.recentCharacters?.length) return;
                const newest = data.recentCharacters[0];
                if (!lastChar) { lastChar = newest.name; return; }
                if (newest.name !== lastChar) { lastChar = newest.name; trigger(newest); }
            } catch(e){}
        }

        function trigger(char) {
            isDisplaying = true;
            const els = {
                cont: document.getElementById('alert-container'),
                main: document.getElementById('b-main'),
                row: document.getElementById('c-row'),
                barL: document.getElementById('bar-l'),
                barR: document.getElementById('bar-r'),
                name: document.getElementById('alert-name'),
                class: document.getElementById('alert-class'),
                lvl: document.getElementById('alert-lvl'),
                lTop: document.getElementById('l-top'),
                wMsg: document.getElementById('w-msg'),
                img: document.getElementById('alert-img')
            };

            const info = charData[char.classId] || charData[0];
            els.name.innerText = char.name.toUpperCase();
            els.class.innerText = info.name.toUpperCase();
            els.lvl.innerText = char.level || char.cLevel || 1;
            els.img.src = `../assets/images/chars/${info.folder}/${info.img}`;

            els.cont.style.display = 'flex';
            els.cont.style.opacity = '1';
            
            // Reset classes
            [els.main, els.row, els.barL, els.barR, els.lTop, els.wMsg].forEach(el => el.classList.remove('active'));

            setTimeout(() => {
                els.main.classList.add('active');
                els.barL.classList.add('active');
                els.barR.classList.add('active');
                els.row.classList.add('active');
                els.lTop.classList.add('active');
                els.wMsg.classList.add('active');
            }, 50);

            setTimeout(() => {
                els.cont.style.transition = 'opacity 0.8s ease';
                els.cont.style.opacity = '0';
                setTimeout(() => { 
                    els.cont.style.display = 'none'; 
                    isDisplaying = false; 
                }, 800);
            }, 8000); // 8 segundos de gloria
        }

        function triggerTest() {
            if (isDisplaying) return;
            trigger({ name: 'HÉROE_NUEVO', classId: 0, level: 1 });
        }

        window.onkeydown = (e) => { if(e.key.toLowerCase()==='t') triggerTest(); };
        setInterval(check, 5000);
        check();
    </script>
</body>
</html>
