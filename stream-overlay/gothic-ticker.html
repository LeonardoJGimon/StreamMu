<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Barra de Noticias Gótica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face { 
            font-family: 'Exocet'; 
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); 
        }
        @font-face { 
            font-family: 'Alegreya'; 
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); 
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --stone: #0a0a0a;
        }

        body { 
            margin: 0; padding: 0; 
            background: transparent; 
            overflow: hidden; 
        }

        /* DOT ESTILO STARTING SOON */
        .online-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 10px #2ecc71;
            animation: pulse-dot 2s infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* CONTENEDOR PRINCIPAL */
        .ticker-wrapper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95vw;
            height: 60px;
            display: flex;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            border-top: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
        }

        /* CABEZAL FIJO */
        .ticker-label {
            background: linear-gradient(180deg, var(--crimson) 0%, #200 100%);
            color: #fff;
            font-family: 'Exocet', serif;
            font-size: 1.1rem;
            padding: 0 35px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 3px;
            border-right: 3px solid var(--gold);
            text-shadow: 0 0 10px var(--crimson-bright);
            white-space: nowrap;
            position: relative;
            z-index: 10;
        }

        /* ÁREA DE TEXTO MOVIBLE */
        .ticker-content {
            flex: 1;
            overflow: hidden;
            height: 100%;
            display: flex;
            align-items: center;
            background: radial-gradient(circle, rgba(157, 10, 14, 0.1) 0%, transparent 100%);
        }

        .ticker-scroll {
            display: flex;
            white-space: nowrap;
            animation: scroll-endless 100s linear infinite;
            will-change: transform;
            transform: translateZ(0);
        }

        .ticker-text {
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-family: 'Alegreya', sans-serif;
            font-size: 1.4rem;
            color: #ddd;
            letter-spacing: 2px;
            padding-right: 100px; /* Espacio entre repeticiones */
            backface-visibility: hidden;
            perspective: 1000px;
            -webkit-font-smoothing: antialiased;
        }

        .ticker-text i {
            color: var(--gold);
            margin: 0 20px;
            font-size: 1.1rem;
        }

        .ticker-text b {
            color: var(--crimson-bright);
            text-transform: uppercase;
            margin: 0 10px;
        }

        .ticker-separator {
            display: inline-block;
            margin: 0 60px;
            width: 1px;
            height: 25px;
            background: var(--gold);
            opacity: 0.3;
            vertical-align: middle;
        }

        @keyframes scroll-endless {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* ESQUINAS ORNAMENTALES */
        .ticker-wrapper::before, .ticker-wrapper::after {
            content: ''; position: absolute; width: 25px; height: 25px;
            filter: drop-shadow(0 0 8px var(--crimson-bright));
            z-index: 20;
        }
        .ticker-wrapper::before { top: -6px; left: -6px; border-top: 4px solid var(--crimson-bright); border-left: 4px solid var(--crimson-bright); }
        .ticker-wrapper::after { bottom: -6px; right: -6px; border-bottom: 4px solid var(--crimson-bright); border-right: 4px solid var(--crimson-bright); }
    </style>
</head>
<body>

    <div class="ticker-wrapper">
        <div class="ticker-label">NOTICIAS</div>
        <div class="ticker-content">
            <div class="ticker-scroll" id="ticker-scroll">
                <div class="ticker-text" id="news-text">
                    <span class="online-dot"></span> SERVIDOR <b id="server-status">ONLINE</b> <span class="ticker-separator"></span>
                    <i class="fas fa-users"></i> JUGADORES EN LÍNEA: <b id="stat-online">0</b> <span class="ticker-separator"></span>
                    <i class="fas fa-gift"></i> REGÍSTRATE Y OBTÉN <b>BATTLE PASS PREMIUM</b> <span class="ticker-separator"></span>
                    <i class="fas fa-download"></i> ¡DESCÁRGALO YA! EN <b>WWW.MU-OLIMPO.ONLINE</b> <span class="ticker-separator"></span>
                    <i class="fas fa-shield-halved"></i> DISFRUTA DE UN BALANCE <b>PVP~PVM ÚNICO</b> <span class="ticker-separator"></span>
                    <i class="fas fa-trophy"></i> PARTICIPA POR LA GLORIA EN EVENTOS ESPECIALES <span class="ticker-separator"></span>
                    <i class="fab fa-tiktok"></i> SÍGUENOS EN <b>TIKTOK</b> PARA CLIPS DIARIOS <span class="ticker-separator"></span>
                    <i class="fab fa-facebook"></i> ÚNETE A NUESTRA COMUNIDAD EN <b>FACEBOOK</b>
                </div>
                <!-- Copia idéntica para el bucle infinito -->
                <div class="ticker-text" id="news-text-copy"></div>
            </div>
        </div>
    </div>

        <script>
        const params = new URLSearchParams(window.location.search);
        const customText = params.get('text');
        const newsTextEl = document.getElementById('news-text');
        const newsTextCopyEl = document.getElementById('news-text-copy');

        if (customText) {
            newsTextEl.innerHTML = decodeURIComponent(customText);
        }

        async function updateServerStats() {
            try {
                const response = await fetch('/api/stats');
                if (response.ok) {
                    const data = await response.json();
                    const count = data.onlineCount || 0;
                    const onlineEls = document.querySelectorAll('#stat-online');
                    onlineEls.forEach(el => el.innerText = count);
                }
            } catch (e) { console.error("Error stats:", e); }
        }

        updateServerStats().then(() => {
            if (newsTextCopyEl && newsTextEl) {
                newsTextCopyEl.innerHTML = newsTextEl.innerHTML;
            }
        });

        setInterval(updateServerStats, 10000);
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
