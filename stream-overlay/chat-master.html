<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mu Neutro - Chat Master</title>
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); font-weight: 400; }

        :root {
            --crimson: #9d0a0e;
            --gold: #c0a375;
            --border-glow: rgba(157, 10, 14, 0.6);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: transparent;
            font-family: 'Alegreya', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .master-container {
            position: relative;
            width: 98vw;
            height: 98vh;
            max-width: 600px;
            background: transparent;
            border: 2px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            margin: auto;
        }

        /* TÍTULO SUPERIOR RESPONSIVO */
        .header {
            background: linear-gradient(180deg, var(--crimson) 0%, #1a0505 100%);
            padding: clamp(8px, 2vh, 15px);
            text-align: center;
            border-bottom: 2px solid var(--gold);
            position: relative;
            flex-shrink: 0;
        }

        .header-title {
            font-family: 'Exocet', serif;
            color: var(--gold);
            font-size: clamp(0.9rem, 4vw, 1.4rem);
            letter-spacing: clamp(2px, 1vw, 6px);
            text-shadow: 0 0 10px rgba(192, 163, 117, 0.5);
            margin: 0;
            text-transform: uppercase;
        }

        /* ESQUINAS ORNAMENTALES DINÁMICAS */
        .master-container::before, .master-container::after {
            content: ''; position: absolute; width: clamp(15px, 5vw, 35px); height: clamp(15px, 5vh, 35px); z-index: 10;
        }
        .master-container::before {
            top: -4px; left: -4px; border-top: 4px solid var(--crimson); border-left: 4px solid var(--crimson);
        }
        .master-container::after {
            bottom: -4px; right: -4px; border-bottom: 4px solid var(--crimson); border-right: 4px solid var(--crimson);
        }

        /* ÁREA DEL CHAT */
        .chat-wrapper {
            flex-grow: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            background: transparent;
        }

        .chat-iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            background: transparent;
        }

        /* DECORACIÓN INFERIOR */
        .footer-deco {
            height: 4px;
            background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
            opacity: 0.5;
            flex-shrink: 0;
        }

        @media (max-width: 400px) {
            .master-container {
                width: 100vw;
                height: 100vh;
                border-width: 1px;
            }
            .header-title { letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <div class="master-container">
        <header class="header">
            <h1 class="header-title">CHAT EN VIVO</h1>
        </header>
        
        <!-- El contenido del chat se puede superponer en OBS -->
        <div class="chat-wrapper"></div>

        <div class="footer-deco"></div>
    </div>

</body>
</html>
