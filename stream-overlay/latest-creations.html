<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Últimos Guerreros (Oficial)</title>
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); font-weight: 400; }

        :root {
            --bg-dark: #1e1e1e;
            --row-bg: #141414;
            --crimson: #8b0000;
            --gold: #c0a375;
            --white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            background: transparent;
            font-family: 'Alegreya', sans-serif;
            overflow: hidden;
            width: 1920px; height: 1080px;
        }

        /* CONTENEDOR PRINCIPAL (Estilo exacto a la imagen) */
        .widget-box {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 520px;
            background: var(--bg-dark);
            border: 1px solid var(--crimson);
            padding: 25px;
            box-shadow: 10px 10px 40px rgba(0,0,0,0.8);
        }

        .title {
            font-family: 'Exocet', serif;
            font-size: 1.1rem;
            color: var(--gold);
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--crimson);
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* FILA DE PERSONAJE */
        .char-row {
            display: flex;
            align-items: center;
            background: var(--row-bg);
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .icon-container {
            width: 55px;
            height: 55px;
            margin-right: 20px;
        }

        .char-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .char-name {
            font-family: 'Exocet', serif;
            font-size: 1.2rem;
            color: var(--white);
            flex-grow: 1;
            letter-spacing: 1px;
        }

        .time-ago {
            font-size: 0.95rem;
            color: var(--gold);
            font-style: italic;
            font-weight: bold;
        }

        /* ALERTA (Se mantiene oculta hasta que hay un nuevo personaje) */
        #alert-overlay {
            position: fixed; inset: 0;
            display: none; align-items: center; justify-content: center;
            z-index: 1000; pointer-events: none;
        }
        .alert-card {
            width: 500px; padding: 40px;
            background: #000; border: 2px solid var(--gold);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 0 50px var(--crimson);
        }
        .alert-name { font-family: 'Exocet', serif; font-size: 4rem; color: #fff; margin: 10px 0; }
        .alert-welcome { font-family: 'Exocet', serif; color: var(--gold); font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="alert-overlay">
        <div class="alert-card">
            <div class="alert-welcome">BIENVENIDOS A MU NEUTRO</div>
            <img id="alert-img" src="" style="width: 150px; margin: 20px 0;">
            <div id="alert-name" class="alert-name">NOMBRE</div>
            <div style="color: #fff; font-size: 1.2rem; opacity: 0.8;">NUEVO GUERRERO SE UNE A LA BATALLA</div>
        </div>
    </div>

    <div class="widget-box">
        <h1 class="title">ÚLTIMOS GUERREROS</h1>
        <div class="divider"></div>
        <div id="list" class="list-wrapper">
            <!-- Cargando datos... -->
        </div>
    </div>

    <script>
        const classMap = {
            0: { folder: 'SM', icon: 'dw-icon.png', head: 'DW encabezado.png' },
            16: { folder: 'DK', icon: 'dk-icon.png', head: 'dk encabezado.png' },
            32: { folder: 'FAIRY ELF', icon: 'elf-icon.png', head: 'ELf encabezado-WmkejHhTPPZ6wZaPMkqTLLQg1QRAoB.png' },
            48: { folder: 'MG', icon: 'mg icon.png', head: 'MG encabezado.png' },
            64: { folder: 'DL', icon: 'dl icon.png', head: 'DL encabezado.png' },
            80: { folder: 'SUMONNER', icon: 'sm icon.png', head: 'SM encabezado.png' },
            96: { folder: 'RAGE', icon: 'rf icon.png', head: 'RF-encabezado.png' }
        };

        let serverTime = new Date();
        let lastChars = [];
        let isFirstLoad = true;

        function formatTimeAgo(dateStr) {
            const diff = Math.floor((serverTime - new Date(dateStr)) / 1000);
            if (diff < 60) return `hace ${Math.max(0, diff)}s`;
            if (diff < 3600) return `hace ${Math.floor(diff/60)}m`;
            return `hace ${Math.floor(diff/3600)}h`;
        }

        async function updateData() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) return;
                const data = await res.json();
                serverTime = new Date(data.timestamp);
                const chars = (data.recentCharacters || []).slice(0, 3); // Top 3 como la imagen

                if (chars.length > 0) {
                    if (!isFirstLoad && lastChars.length > 0 && chars[0].name !== lastChars[0].name) {
                        triggerAlert(chars[0]);
                    }
                    renderList(chars);
                    lastChars = chars;
                    isFirstLoad = false;
                }
            } catch (e) { console.error(e); }
        }

        function renderList(chars) {
            let html = '';
            chars.forEach(c => {
                const info = classMap[c.classId] || classMap[0];
                const iconPath = `../assets/images/chars/${info.folder}/${info.icon}`;
                html += `
                    <div class="char-row">
                        <div class="icon-container">
                            <img src="${iconPath}" class="char-icon">
                        </div>
                        <div class="char-name">${c.name}</div>
                        <div class="time-ago" id="time-${c.name}">${formatTimeAgo(c.date)}</div>
                    </div>
                `;
            });
            document.getElementById('list').innerHTML = html;
        }

        function triggerAlert(char) {
            const overlay = document.getElementById('alert-overlay');
            const info = classMap[char.classId] || classMap[0];
            document.getElementById('alert-name').innerText = char.name.toUpperCase();
            document.getElementById('alert-img').src = `../assets/images/chars/${info.folder}/${info.head}`;
            
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.display = 'none'; }, 6000);
        }

        setInterval(() => {
            serverTime.setSeconds(serverTime.getSeconds() + 1);
            lastChars.forEach(c => {
                const el = document.getElementById(`time-${c.name}`);
                if (el) el.innerText = formatTimeAgo(c.date);
            });
        }, 1000);

        setInterval(updateData, 5000);
        updateData();
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
