<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Últimas Creaciones & Alertas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
            font-weight: 400;
        }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --row-bg: rgba(15, 10, 10, 0.95);
        }

        body {
            margin: 0; padding: 0;
            background: transparent;
            font-family: 'Alegreya', serif;
            color: #ccc;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            overflow: hidden;
        }

        /* --- CONTENEDOR DE LA LISTA --- */
        .outer-box {
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(157, 10, 14, 0.4);
            padding: 20px;
            width: 100%;
            max-width: 500px;
            margin: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 5;
        }

        .outer-box::before { content: ''; position: absolute; top: -5px; left: -5px; width: 30px; height: 30px; border-top: 4px solid var(--crimson-bright); border-left: 4px solid var(--crimson-bright); }
        .outer-box::after { content: ''; position: absolute; bottom: -5px; right: -5px; width: 30px; height: 30px; border-bottom: 4px solid var(--crimson-bright); border-right: 4px solid var(--crimson-bright); }

        .main-title { font-family: 'Exocet', serif; font-size: 1rem; color: #888; letter-spacing: 3px; margin-bottom: 15px; text-transform: uppercase; }

        .list-wrapper { display: flex; flex-direction: column; gap: 10px; }

        .char-row {
            display: grid; grid-template-columns: 60px 1fr 120px; gap: 15px; align-items: center;
            background: var(--row-bg); padding: 8px; border: 1px solid rgba(157, 10, 14, 0.2);
            animation: slideIn 0.5s ease forwards;
        }

        .avatar-container { width: 50px; height: 50px; }
        .avatar-img { width: 100%; height: 100%; border-radius: 4px; border: 1px solid #333; background: #000; }
        .char-name { font-family: 'Exocet', serif; font-size: 1.1rem; color: #eee; }
        .time-ago { font-size: 0.9rem; color: var(--gold); text-align: right; padding-right: 10px; font-style: italic; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        /* --- SISTEMA DE ALERTA INTEGRADO --- */
        #alert-overlay {
            position: fixed; inset: 0;
            display: none; align-items: center; justify-content: center;
            z-index: 100; pointer-events: none;
        }

        .flash { position: absolute; inset: 0; background: white; opacity: 0; z-index: 110; }
        .flash.active { animation: flashAnim 1.5s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 30% { opacity: 0.8; background: var(--crimson-bright); } 100% { opacity: 0; } }

        .alert-content {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            animation: alertIn 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards;
            z-index: 120;
        }

        @keyframes alertIn { 0% { transform: scale(0.5); opacity: 0; filter: blur(20px); } 100% { transform: scale(1); opacity: 1; filter: blur(0); } }

        .alert-avatar { width: 250px; height: 250px; border: 5px solid var(--gold); border-radius: 50%; box-shadow: 0 0 80px var(--crimson-bright); background: #000; margin-bottom: 20px; }
        .alert-text { font-family: 'Exocet', serif; color: #fff; text-shadow: 0 0 20px var(--crimson); }
        .alert-name { font-size: 4rem; color: var(--gold); letter-spacing: 10px; margin: 10px 0; }
        
        .alert-content.exit { animation: alertOut 0.8s ease-in forwards; }
        @keyframes alertOut { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; filter: blur(30px); } }

    </style>
</head>
<body>

    <div id="alert-overlay">
        <div class="flash" id="flash"></div>
        <div id="alert-body" class="alert-content">
            <div style="font-family: 'Exocet'; font-size: 1.2rem; letter-spacing: 4px; color: #fff;">NUEVO GUERRERO DESPIERTA</div>
            <img id="alert-img" src="" class="alert-avatar">
            <div id="alert-name" class="alert-name">NOMBRE</div>
            <div id="alert-class" style="font-size: 1.2rem; color: #fff; border-top: 1px solid var(--gold); padding-top: 5px;">CLASE</div>
        </div>
    </div>

    <div class="outer-box">
        <h1 class="main-title">ÚLTIMOS GUERREROS CREADOS</h1>
        <div id="list" class="list-wrapper">
            <!-- Data -->
        </div>
    </div>

    <script>
        const charData = {
            0: { name: 'Dark Wizard', img: 'DW.png' }, 1: { name: 'Soul Master', img: 'SM.png' }, 16: { name: 'Dark Knight', img: 'DK.png' },
            17: { name: 'Blade Knight', img: 'BK.png' }, 32: { name: 'Fairy Elf', img: 'ELF.png' }, 33: { name: 'Muse Elf', img: 'ME.png' },
            48: { name: 'Magic Gladiator', img: 'MG.png' }, 64: { name: 'Dark Lord', img: 'DL.png' }, 80: { name: 'Summoner', img: 'SUM.png' },
            96: { name: 'Rage Fighter', img: 'RF.png' }
        };

        let serverTime = new Date();
        let lastChars = [];
        let firstLoad = true;

        function formatTimeAgo(dateStr) {
            const diff = Math.floor((serverTime - new Date(dateStr)) / 1000);
            if (diff < 60) return `hace ${Math.max(0, diff)}s`;
            if (diff < 3600) return `hace ${Math.floor(diff/60)}m ${diff%60}s`;
            return `hace ${Math.floor(diff/3600)}h`;
        }

        async function update() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) return;
                const data = await res.json();
                const chars = (data.recentCharacters || []).slice(0, 3);
                serverTime = new Date(data.timestamp);

                if (chars.length > 0) {
                    // Detectar Alerta
                    if (!firstLoad && lastChars.length > 0 && chars[0].name !== lastChars[0].name) {
                        triggerAlert(chars[0]);
                    }
                    
                    render(chars);
                    lastChars = chars;
                    firstLoad = false;
                }
            } catch (e) { console.error(e); }
        }

        function render(chars) {
            let html = '';
            chars.forEach(c => {
                const info = charData[c.classId] || { img: 'DW.png' };
                html += `
                    <div class="char-row">
                        <div class="avatar-container"><img src="../assets/images/characters/${info.img}" class="avatar-img"></div>
                        <div class="char-name">${c.name}</div>
                        <div class="time-ago">${formatTimeAgo(c.date)}</div>
                    </div>
                `;
            });
            document.getElementById('list').innerHTML = html;
        }

        function triggerAlert(char) {
            const overlay = document.getElementById('alert-overlay');
            const body = document.getElementById('alert-body');
            const flash = document.getElementById('flash');
            const info = charData[char.classId] || { name: 'Guerrero', img: 'DW.png' };

            document.getElementById('alert-name').innerText = char.name;
            document.getElementById('alert-class').innerText = info.name;
            document.getElementById('alert-img').src = `../assets/images/characters/${info.img}`;

            overlay.style.display = 'flex';
            body.classList.remove('exit');
            flash.classList.add('active');

            setTimeout(() => flash.classList.remove('active'), 1500);
            setTimeout(() => {
                body.classList.add('exit');
                setTimeout(() => { overlay.style.display = 'none'; }, 800);
            }, 6000);
        }

        setInterval(() => {
            serverTime.setSeconds(serverTime.getSeconds() + 1);
            if (lastChars.length > 0) render(lastChars);
        }, 1000);

        setInterval(update, 3000); // Revisar cada 3 segundos para máxima velocidad
        update();

        // MODO PRUEBA: Si la URL tiene ?test=1, dispara una alerta ahora
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('test')) {
            setTimeout(() => {
                triggerAlert({ name: 'TEST_HERO', classId: 16, date: new Date().toISOString() });
            }, 2000);
        }
    </script>
</body>
</html>
