<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Últimos Guerreros (Epic Edition)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); font-weight: 400; }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --row-bg: rgba(15, 10, 10, 0.9);
        }

        body {
            margin: 0; padding: 15px; background: transparent;
            font-family: 'Alegreya', serif; color: #ccc;
            width: 100vw; display: flex; justify-content: flex-start; overflow: hidden;
        }

        .outer-box {
            position: relative; background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(157, 10, 14, 0.4);
            padding: 25px; width: 100%; max-width: 600px; box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0,0,0,1); backdrop-filter: blur(8px);
        }

        .outer-box::before {
            content: ''; position: absolute; top: -6px; left: -6px; width: 40px; height: 40px;
            border-top: 4px solid var(--crimson-bright); border-left: 4px solid var(--crimson-bright);
        }

        .outer-box::after {
            content: ''; position: absolute; bottom: -6px; right: -6px; width: 40px; height: 40px;
            border-bottom: 4px solid var(--crimson-bright); border-right: 4px solid var(--crimson-bright);
        }

        .main-title {
            font-family: 'Exocet', serif; font-size: 1.5rem; color: var(--gold);
            letter-spacing: 6px; margin-bottom: 30px; text-align: center;
            text-transform: uppercase; text-shadow: 0 0 15px rgba(192, 163, 117, 0.4);
        }

        .hall-container { display: flex; flex-direction: column; gap: 20px; }

        .hall-card {
            display: grid; grid-template-columns: 80px 1fr 130px; gap: 20px;
            align-items: center; background: var(--row-bg); padding: 20px;
            position: relative; border: 1px solid rgba(157, 10, 14, 0.2);
            animation: fadeIn 0.8s ease-out forwards;
        }

        .category-label {
            position: absolute; top: -12px; left: 20px; background: var(--crimson);
            color: white; font-family: 'Exocet', serif; font-size: 0.7rem;
            padding: 4px 15px; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .avatar-container { width: 70px; height: 70px; position: relative; }
        .avatar-img { width: 100%; height: 100%; border: 2px solid var(--gold); background: #000; border-radius: 4px; }
        
        .info-box { display: flex; flex-direction: column; gap: 5px; }
        .name { font-family: 'Exocet', serif; font-size: 1.6rem; color: #fff; text-shadow: 0 2px 5px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub-info { font-size: 0.8rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

        .stat-box { text-align: right; }
        .stat-value { font-family: 'Exocet', serif; font-size: 1.3rem; color: #fff; }
        .stat-unit { font-size: 0.8rem; color: var(--crimson); display: block; font-weight: bold; }

        /* ALERTA GIGANTE */
        #alert-overlay {
            position: fixed; inset: 0;
            display: none; align-items: center; justify-content: center;
            z-index: 1000; pointer-events: none;
        }
        .alert-card {
            width: 600px; padding: 40px; background: #000; border: 2px solid var(--gold);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 0 100px var(--crimson);
        }
        .hero-name { font-family: 'Exocet', serif; font-size: 4.5rem; color: #fff; letter-spacing: 12px; text-shadow: 0 0 20px var(--crimson); margin: 10px 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="alert-overlay">
        <div class="alert-card animate__animated animate__zoomIn" id="alert-box">
            <div style="font-family: 'Exocet'; color: var(--gold); font-size: 1.2rem; letter-spacing: 4px;">BIENVENIDOS A MU NEUTRO</div>
            <img id="alert-img" src="" style="width: 200px; margin: 20px 0; filter: drop-shadow(0 0 15px var(--gold));">
            <div id="alert-name" class="hero-name">NOMBRE</div>
            <div style="color: #fff; font-size: 1.5rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 2px;">LA LEYENDA COMIENZA</div>
        </div>
    </div>

    <div class="outer-box">
        <h1 class="main-title">ÚLTIMOS GUERREROS</h1>
        <div id="list" class="hall-container">
            <!-- Bloques se cargan aquí -->
        </div>
        <div style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
            <span style="font-family: 'Exocet'; font-size: 0.7rem; color: #444; letter-spacing: 3px;">Mu Neutro Season 6</span>
        </div>
    </div>

    <script>
        const classMap = {
            0: { folder: 'SM', icon: 'dw-icon.png', head: 'DW encabezado.png' },
            16: { folder: 'DK', icon: 'dk-icon.png', head: 'dk encabezado.png' },
            32: { folder: 'FAIRY ELF', icon: 'elf-icon.png', head: 'ELf encabezado-WmkejHhTPPZ6wZaPMkqTLLQg1QRAoB.png' },
            48: { folder: 'MG', icon: 'mg icon.png', head: 'MG encabezado.png' },
            64: { folder: 'DL', icon: 'dl icon.png', head: 'DL encabezado.png' },
            80: { folder: 'SUMONNER', icon: 'sm icon.png', head: 'SM encabezado.png' },
            96: { folder: 'RAGE', icon: 'rf icon.png', head: 'RF-encabezado.png' }
        };

        let serverTime = new Date();
        let lastChars = [];
        let isFirstLoad = true;

        function formatTimeAgo(dateStr) {
            const diff = Math.floor((serverTime - new Date(dateStr)) / 1000);
            if (diff < 60) return `${Math.max(0, diff)} SEG`;
            if (diff < 3600) return `${Math.floor(diff/60)} MIN`;
            return `${Math.floor(diff/3600)} HORAS`;
        }

        async function update() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) return;
                const data = await res.json();
                serverTime = new Date(data.timestamp);
                const chars = (data.recentCharacters || []).slice(0, 3);

                if (chars.length > 0) {
                    if (!isFirstLoad && lastChars.length > 0 && chars[0].name !== lastChars[0].name) {
                        triggerAlert(chars[0]);
                    }
                    render(chars);
                    lastChars = chars;
                    isFirstLoad = false;
                }
            } catch (e) { console.error(e); }
        }

        function render(chars) {
            const listEl = document.getElementById('list');
            const labels = ['NUEVA CREACIÓN', 'GUERRERO RECIENTE', 'ALMA DESPERTADA'];
            
            // Si el número de elementos cambió o es la primera vez, hacemos render completo
            if (listEl.children.length !== chars.length) {
                let html = '';
                chars.forEach((c, i) => {
                    const info = classMap[c.classId] || classMap[0];
                    const iconPath = `../assets/images/chars/${info.folder}/${info.icon}`;
                    html += `
                        <div class="hall-card" id="card-${i}">
                            <span class="category-label">${labels[i]}</span>
                            <div class="avatar-container">
                                <img src="${iconPath}" class="avatar-img">
                            </div>
                            <div class="info-box">
                                <div class="name" id="name-${i}">${c.name}</div>
                                <div class="sub-info" id="info-${i}">Nivel ${c.level} / ${c.resets} RR</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value" id="time-${i}">${formatTimeAgo(c.date)}</div>
                                <div class="stat-unit">ANTIGÜEDAD</div>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;
            } else {
                // Si solo cambiaron los datos, actualizamos solo el texto para evitar parpadeo
                chars.forEach((c, i) => {
                    const nameEl = document.getElementById(`name-${i}`);
                    const infoEl = document.getElementById(`info-${i}`);
                    const timeEl = document.getElementById(`time-${i}`);
                    
                    if (nameEl && nameEl.innerText !== c.name) nameEl.innerText = c.name;
                    if (infoEl) infoEl.innerText = `Nivel ${c.level} / ${c.resets} RR`;
                    if (timeEl) timeEl.innerText = formatTimeAgo(c.date);
                });
            }
        }

        function triggerAlert(char) {
            const overlay = document.getElementById('alert-overlay');
            const box = document.getElementById('alert-box');
            const info = classMap[char.classId] || classMap[0];

            document.getElementById('alert-name').innerText = char.name.toUpperCase();
            document.getElementById('alert-img').src = `../assets/images/chars/${info.folder}/${info.head}`;

            overlay.style.display = 'flex';
            setTimeout(() => {
                box.classList.remove('animate__zoomIn');
                box.classList.add('animate__zoomOut');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    box.classList.remove('animate__zoomOut');
                    box.classList.add('animate__zoomIn');
                }, 800);
            }, 6000);
        }

        // Intervalo para actualizar el "hace X seg" sin parpadeo
        setInterval(() => {
            serverTime.setSeconds(serverTime.getSeconds() + 1);
            if (lastChars.length > 0) {
                lastChars.forEach((c, i) => {
                    const timeEl = document.getElementById(`time-${i}`);
                    if (timeEl) timeEl.innerText = formatTimeAgo(c.date);
                });
            }
        }, 1000);

        setInterval(update, 5000);
        update();
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
