<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Alerta Gótica Diablo IV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }
        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
            font-weight: 400;
        }

        :root {
            --crimson: #7e0c0c;
            --crimson-glow: rgba(126, 12, 12, 0.8);
            --gold: #c0a375;
            --gold-bright: #f3e5ab;
        }

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background: transparent;
            font-family: 'Alegreya', serif;
            overflow: hidden;
        }

        /* --- LISTA DE GUERREROS (Sutil y Elegante) --- */
        .list-container {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 400px;
            background: rgba(0, 0, 0, 0.85);
            border-left: 3px solid var(--crimson);
            padding: 15px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,1);
            z-index: 10;
        }

        .main-title {
            font-family: 'Exocet', serif;
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .char-row {
            display: grid;
            grid-template-columns: 45px 1fr 90px;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .avatar-img { width: 35px; height: 35px; border: 1px solid #333; filter: grayscale(0.5); }
        .char-name { font-family: 'Exocet', serif; font-size: 1.1rem; color: #ddd; letter-spacing: 1px; }
        .time-ago { font-size: 0.8rem; color: var(--crimson); text-align: right; font-style: italic; font-weight: bold; }

        /* --- ALERTA DIABLO IV (Impactante) --- */
        #alert-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            pointer-events: none;
        }

        /* Fondo de humo carmesí */
        .blood-smoke {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--crimson-glow) 0%, transparent 70%);
            opacity: 0;
            z-index: 0;
        }

        .alert-frame {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 100px;
            z-index: 100;
        }

        /* Bordes Góticos (Usando pseudo-elementos para imitar piedra tallada) */
        .alert-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid var(--gold);
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            opacity: 0.5;
        }

        .char-portrait-container {
            width: 320px;
            height: 450px;
            position: relative;
            margin-bottom: -40px; /* Superponer con el texto */
            filter: drop-shadow(0 0 50px #000);
        }

        .char-portrait {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: floatChar 4s infinite ease-in-out;
            mask-image: linear-gradient(to bottom, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent);
        }

        .alert-header {
            font-family: 'Exocet', serif;
            font-size: 1.5rem;
            color: var(--gold);
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #000;
        }

        .alert-name-hero {
            font-family: 'Exocet', serif;
            font-size: 6rem;
            color: #fff;
            letter-spacing: 20px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px var(--crimson-glow));
            margin: 0;
            animation: textReveal 1.5s ease-out forwards;
        }

        .alert-welcome-text {
            font-family: 'Alegreya';
            font-size: 2rem;
            color: #ccc;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-style: italic;
            opacity: 0.8;
            margin-top: 10px;
        }

        /* --- ANIMACIONES --- */
        @keyframes floatChar {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 40px var(--crimson-glow)); }
            50% { transform: translateY(-20px) scale(1.05); filter: drop-shadow(0 0 70px var(--crimson-bright)); }
        }

        @keyframes textReveal {
            0% { letter-spacing: 40px; opacity: 0; filter: blur(10px); }
            100% { letter-spacing: 20px; opacity: 1; filter: blur(0); }
        }

        @keyframes smokeIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .smoke-active { animation: smokeIn 3s ease-out forwards; }

        /* FLASH DIABLO (Rojo oscuro) */
        .flash-diablo {
            position: absolute;
            inset: 0;
            background: var(--crimson);
            opacity: 0;
            z-index: 1000;
        }
        .flash-diablo.active { animation: flashD 1.2s ease-out forwards; }
        @keyframes flashD { 0% { opacity: 0.8; } 100% { opacity: 0; } }

    </style>
</head>
<body>

    <div id="alert-overlay">
        <div class="flash-diablo" id="flash"></div>
        <div class="blood-smoke" id="smoke"></div>
        
        <div class="alert-frame animate__animated" id="alert-frame">
            <div class="alert-header">UN NUEVO DESTINO DESPIERTA</div>
            
            <div class="char-portrait-container">
                <img id="alert-img" src="" class="char-portrait">
            </div>

            <h1 class="alert-name-hero" id="alert-name">LANCELOT</h1>
            <div class="alert-welcome-text">BIENVENIDO AL MUNDO DE MU NEUTRO</div>
        </div>
    </div>

    <div class="list-container">
        <h1 class="main-title">ÚLTIMOS GUERREROS</h1>
        <div id="list">
            <!-- Data -->
        </div>
    </div>

    <script>
        const charData = {
            0: { name: 'Dark Wizard', img: 'DW.png' }, 1: { name: 'Soul Master', img: 'SM.png' }, 2: { name: 'Grand Master', img: 'GM.png' },
            16: { name: 'Dark Knight', img: 'DK.png' }, 17: { name: 'Blade Knight', img: 'BK.png' }, 18: { name: 'Blade Master', img: 'BM.png' },
            32: { name: 'Fairy Elf', img: 'ELF.png' }, 33: { name: 'Muse Elf', img: 'ME.png' }, 34: { name: 'High Elf', img: 'HE.png' },
            48: { name: 'Magic Gladiator', img: 'MG.png' }, 50: { name: 'Duel Master', img: 'DM.png' },
            64: { name: 'Dark Lord', img: 'DL.png' }, 66: { name: 'Lord Emperor', img: 'LE.png' },
            80: { name: 'Summoner', img: 'SUM.png' }, 81: { name: 'Bloody Summoner', img: 'BS.png' }, 82: { name: 'Dimension Master', img: 'DSM.png' },
            96: { name: 'Rage Fighter', img: 'RF.png' }, 98: { name: 'Fist Master', img: 'FM.png' }
        };

        let serverTime = new Date();
        let lastChars = [];
        let isFirstLoad = true;
        let isAlertActive = false;

        function formatTimeAgo(dateStr) {
            const diff = Math.floor((serverTime - new Date(dateStr)) / 1000);
            if (diff < 60) return `hace ${Math.max(0, diff)}s`;
            if (diff < 3600) return `hace ${Math.floor(diff/60)}m`;
            return `hace ${Math.floor(diff/3600)}h`;
        }

        async function updateData() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) return;
                const data = await res.json();
                serverTime = new Date(data.timestamp);
                const chars = (data.recentCharacters || []).slice(0, 5);

                if (chars.length > 0) {
                    if (!isFirstLoad && lastChars.length > 0 && chars[0].name !== lastChars[0].name) {
                        triggerAlert(chars[0]);
                    }

                    const currentNames = chars.map(c => c.name).join('|');
                    const lastNames = lastChars.map(c => c.name).join('|');
                    
                    if (currentNames !== lastNames) renderList(chars);
                    
                    lastChars = chars;
                    isFirstLoad = false;
                }
            } catch (e) { console.error(e); }
        }

        function renderList(chars) {
            let html = '';
            chars.forEach(c => {
                const info = charData[c.classId] || { img: 'DW.png' };
                html += `
                    <div class="char-row animate__animated animate__fadeIn">
                        <img src="../assets/images/characters/${info.img}" class="avatar-img">
                        <div class="char-name">${c.name}</div>
                        <div class="time-ago" id="time-${c.name}">${formatTimeAgo(c.date)}</div>
                    </div>
                `;
            });
            document.getElementById('list').innerHTML = html;
        }

        setInterval(() => {
            serverTime.setSeconds(serverTime.getSeconds() + 1);
            lastChars.forEach(c => {
                const el = document.getElementById(`time-${c.name}`);
                if (el) el.innerText = formatTimeAgo(c.date);
            });
        }, 1000);

        function triggerAlert(char) {
            if (isAlertActive) return;
            isAlertActive = true;

            const overlay = document.getElementById('alert-overlay');
            const frame = document.getElementById('alert-frame');
            const flash = document.getElementById('flash');
            const smoke = document.getElementById('smoke');
            const info = charData[char.classId] || { name: 'Guerrero', img: 'DW.png' };

            document.getElementById('alert-name').innerText = char.name;
            document.getElementById('alert-img').src = `../assets/images/characters/${info.img}`;

            overlay.style.display = 'flex';
            frame.classList.add('animate__zoomIn');
            flash.classList.add('active');
            smoke.classList.add('smoke-active');
            
            setTimeout(() => {
                frame.classList.remove('animate__zoomIn');
                frame.classList.add('animate__fadeOut');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    frame.classList.remove('animate__fadeOut');
                    flash.classList.remove('active');
                    smoke.classList.remove('smoke-active');
                    isAlertActive = false;
                }, 1000);
            }, 7000); // 7 segundos cinemáticos
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('test')) {
            setTimeout(() => triggerAlert({ name: 'LILITH', classId: 82, date: new Date().toISOString() }), 2000);
        }

        setInterval(updateData, 4000);
        updateData();
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
