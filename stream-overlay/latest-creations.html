<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Overlays & Alertas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }
        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
            font-weight: 400;
        }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --gold-bright: #ffd700;
        }

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background: transparent;
            font-family: 'Alegreya', serif;
            color: #ccc;
            overflow: hidden;
        }

        /* --- LISTA DE GUERREROS (ESQUINA INFERIOR IZQUIERDA) --- */
        .list-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 450px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--crimson);
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .main-title {
            font-family: 'Exocet', serif;
            font-size: 1rem;
            color: var(--gold);
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--crimson);
            padding-bottom: 5px;
        }

        .char-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            gap: 15px;
            align-items: center;
            background: rgba(20, 10, 10, 0.8);
            margin-bottom: 8px;
            padding: 5px 10px;
            border: 1px solid rgba(157, 10, 14, 0.2);
        }

        .avatar-img { width: 40px; height: 40px; border: 1px solid var(--gold); border-radius: 4px; }
        .char-name { font-family: 'Exocet', serif; font-size: 1rem; color: #fff; }
        .time-ago { font-size: 0.85rem; color: var(--gold); text-align: right; font-style: italic; }

        /* --- ALERTA GIGANTE (Twitch Style) --- */
        #alert-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            pointer-events: none;
        }

        .alert-box {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 50px;
            background: radial-gradient(circle, rgba(157, 10, 14, 0.2) 0%, transparent 70%);
        }

        .alert-shield {
            width: 350px;
            height: 350px;
            position: relative;
            margin-bottom: 20px;
        }

        .alert-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px var(--crimson-bright));
            animation: pulseImg 2s infinite ease-in-out;
        }

        .alert-title {
            font-family: 'Exocet', serif;
            font-size: 2.2rem;
            color: #fff;
            letter-spacing: 5px;
            text-shadow: 0 0 20px var(--crimson-bright);
            margin-bottom: 10px;
        }

        .alert-welcome {
            font-family: 'Exocet', serif;
            font-size: 4.5rem;
            color: var(--gold-bright);
            letter-spacing: 10px;
            text-shadow: 0 5px 15px #000;
            margin-bottom: 5px;
        }

        .alert-footer {
            font-family: 'Alegreya';
            font-size: 1.8rem;
            color: #fff;
            letter-spacing: 2px;
            background: var(--crimson);
            padding: 5px 40px;
            clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);
        }

        @keyframes pulseImg {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 30px var(--crimson-bright)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 60px var(--gold)); }
        }

        /* FLASH DE IMPACTO */
        .flash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            z-index: 1000;
        }
        .flash.active { animation: flashImpact 1s ease-out forwards; }
        @keyframes flashImpact { 0% { opacity: 1; } 100% { opacity: 0; } }

    </style>
</head>
<body>

    <div id="alert-overlay">
        <div class="flash" id="flash"></div>
        <div class="alert-box animate__animated animate__zoomIn" id="alert-box">
            <div class="alert-title">¡NUEVO GUERRERO EN MU NEUTRO!</div>
            <div class="alert-shield">
                <img id="alert-img" src="" class="alert-img">
            </div>
            <div class="alert-welcome">BIENVENIDO, <span id="alert-name">NOMBRE</span></div>
            <div class="alert-footer">LA BATALLA COMIENZA AHORA</div>
        </div>
    </div>

    <div class="list-container">
        <h1 class="main-title">ÚLTIMOS GUERREROS</h1>
        <div id="list">
            <!-- Cargando... -->
        </div>
    </div>

    <script>
        const charData = {
            0: { name: 'Dark Wizard', img: 'DW.png' }, 1: { name: 'Soul Master', img: 'SM.png' }, 2: { name: 'Grand Master', img: 'GM.png' },
            16: { name: 'Dark Knight', img: 'DK.png' }, 17: { name: 'Blade Knight', img: 'BK.png' }, 18: { name: 'Blade Master', img: 'BM.png' },
            32: { name: 'Fairy Elf', img: 'ELF.png' }, 33: { name: 'Muse Elf', img: 'ME.png' }, 34: { name: 'High Elf', img: 'HE.png' },
            48: { name: 'Magic Gladiator', img: 'MG.png' }, 50: { name: 'Duel Master', img: 'DM.png' },
            64: { name: 'Dark Lord', img: 'DL.png' }, 66: { name: 'Lord Emperor', img: 'LE.png' },
            80: { name: 'Summoner', img: 'SUM.png' }, 81: { name: 'Bloody Summoner', img: 'BS.png' }, 82: { name: 'Dimension Master', img: 'DSM.png' },
            96: { name: 'Rage Fighter', img: 'RF.png' }, 98: { name: 'Fist Master', img: 'FM.png' }
        };

        let serverTime = new Date();
        let lastChars = [];
        let isFirstLoad = true;
        let isAlertActive = false;

        function formatTimeAgo(dateStr) {
            const diff = Math.floor((serverTime - new Date(dateStr)) / 1000);
            if (diff < 60) return `hace ${Math.max(0, diff)}s`;
            if (diff < 3600) return `hace ${Math.floor(diff/60)}m ${diff%60}s`;
            return `hace ${Math.floor(diff/3600)}h`;
        }

        async function updateData() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) return;
                const data = await res.json();
                serverTime = new Date(data.timestamp);
                const chars = (data.recentCharacters || []).slice(0, 5);

                if (chars.length > 0) {
                    // SI HAY UN PERSONAJE NUEVO Y NO ES LA PRIMERA VEZ
                    if (!isFirstLoad && lastChars.length > 0 && chars[0].name !== lastChars[0].name) {
                        triggerAlert(chars[0]);
                    }

                    // SOLO REDIBUJAMOS LA LISTA SI LOS NOMBRES CAMBIARON (Para evitar parpadeo)
                    const currentNames = chars.map(c => c.name).join('|');
                    const lastNames = lastChars.map(c => c.name).join('|');
                    
                    if (currentNames !== lastNames) {
                        renderList(chars);
                    }
                    
                    lastChars = chars;
                    isFirstLoad = false;
                }
            } catch (e) { console.error(e); }
        }

        function renderList(chars) {
            let html = '';
            chars.forEach(c => {
                const info = charData[c.classId] || { img: 'DW.png' };
                html += `
                    <div class="char-row animate__animated animate__fadeInLeft">
                        <img src="../assets/images/characters/${info.img}" class="avatar-img">
                        <div class="char-name">${c.name}</div>
                        <div class="time-ago" id="time-${c.name}">${formatTimeAgo(c.date)}</div>
                    </div>
                `;
            });
            document.getElementById('list').innerHTML = html;
        }

        // ACTUALIZAR SOLO LOS TEXTOS DEL TIEMPO CADA SEGUNDO (Sin redibujar todo)
        setInterval(() => {
            serverTime.setSeconds(serverTime.getSeconds() + 1);
            lastChars.forEach(c => {
                const el = document.getElementById(`time-${c.name}`);
                if (el) el.innerText = formatTimeAgo(c.date);
            });
        }, 1000);

        function triggerAlert(char) {
            if (isAlertActive) return;
            isAlertActive = true;

            const overlay = document.getElementById('alert-overlay');
            const box = document.getElementById('alert-box');
            const flash = document.getElementById('flash');
            const info = charData[char.classId] || { name: 'Guerrero', img: 'DW.png' };

            document.getElementById('alert-name').innerText = char.name;
            document.getElementById('alert-img').src = `../assets/images/characters/${info.img}`;

            overlay.style.display = 'flex';
            flash.classList.add('active');
            
            setTimeout(() => {
                box.classList.remove('animate__zoomIn');
                box.classList.add('animate__zoomOut');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    box.classList.remove('animate__zoomOut');
                    box.classList.add('animate__zoomIn');
                    flash.classList.remove('active');
                    isAlertActive = false;
                }, 800);
            }, 6000); // 6 segundos de gloria
        }

        // Modo Prueba (?test=1)
        const params = new URLSearchParams(window.location.search);
        if (params.get('test')) {
            setTimeout(() => triggerAlert({ name: 'LANCELOT', classId: 18, date: new Date().toISOString() }), 2000);
        }

        setInterval(updateData, 4000); // Revisar cada 4s
        updateData();
    </script>
</body>
</html>
