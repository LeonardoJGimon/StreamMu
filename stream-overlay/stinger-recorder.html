<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Generador de WebM</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #222; padding: 30px; border-radius: 10px; border: 1px solid #444; }
        #status { font-size: 18px; color: #c0a375; margin: 20px 0; padding: 10px; background: #000; border-radius: 5px; }
        #timer { font-size: 40px; font-weight: bold; color: #9d0a0e; margin: 10px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #9d0a0e; color: white; border: none; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #ff2e2e; }
        button:disabled { background: #555; cursor: not-allowed; }
        .instructions { text-align: left; margin: 20px 0; font-size: 14px; color: #aaa; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Generador de Video Stinger (Prueba 0s)</h1>
        <div id="timer">04</div>
        <div id="status">Esperando interacción...</div>
        <button id="btn">GRABAR AHORA (4 SEG)</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.js"></script>
    <script>
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');

        btn.onclick = async () => {
            try {
                btn.disabled = true;
                const win = window.open('stinger.html', '_blank', 'width=1920,height=1080');
                if (!win) { alert("Bloqueador de ventanas detectado."); btn.disabled = false; return; }

                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1920, height: 1080, frameRate: 60, cursor: 'never' },
                    audio: false
                });

                const recorder = new RecordRTC(stream, {
                    type: 'video',
                    mimeType: 'video/webm;codecs=vp9',
                    bitsPerSecond: 128000000
                });

                recorder.startRecording();
                
                // INICIO INMEDIATO (0 segundos)
                win.postMessage('START_STINGER', '*');

                let secondsLeft = 4;
                timer.innerText = secondsLeft;
                status.innerText = "🔴 GRABANDO...";

                const countdown = setInterval(() => {
                    secondsLeft--;
                    timer.innerText = (secondsLeft < 10 ? '0' : '') + secondsLeft;
                    if (secondsLeft <= 0) clearInterval(countdown);
                }, 1000);

                // DURACIÓN EXACTA (4 segundos)
                setTimeout(() => {
                    recorder.stopRecording(() => {
                        const blob = recorder.getBlob();
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'stinger_mu_neutro_test.webm';
                        a.click();
                        stream.getTracks().forEach(t => t.stop());
                        win.close();
                        status.innerText = "✅ ¡Prueba terminada!";
                        btn.disabled = false;
                    });
                }, 4000);

            } catch (err) {
                status.innerText = "Error: " + err.message;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
