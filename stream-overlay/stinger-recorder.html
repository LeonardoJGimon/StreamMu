<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Generador de WebM PRO</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; background: #1a1a1a; padding: 40px; border-radius: 15px; border: 1px solid #333; }
        h1 { color: #9d0a0e; text-transform: uppercase; }
        #timer { font-size: 50px; font-weight: bold; color: #9d0a0e; margin: 10px; }
        #status { font-size: 18px; color: #fff; margin: 20px 0; }
        button { padding: 18px 40px; font-size: 20px; cursor: pointer; background: #9d0a0e; color: white; border: none; border-radius: 8px; font-weight: bold; }
        button:hover { background: #ff2e2e; }
        button:disabled { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Generador de Stinger (Versión 6s)</h1>
        <p>Recuerda seleccionar la <strong>Pestaña</strong> llamada "MU OLIMPO - Stinger Transition"</p>
        <div id="status">Listo para capturar...</div>
        <div id="timer">06</div>
        <button id="btn">GRABAR 6 SEGUNDOS</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.js"></script>
    <script>
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');

        btn.onclick = async () => {
            try {
                btn.disabled = true;
                const win = window.open('stinger.html', 'stinger_window', 'width=1920,height=1080');
                
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { displaySurface: 'browser', width: 1920, height: 1080, frameRate: 60, cursor: 'never' },
                    audio: false
                });

                const recorder = new RecordRTC(stream, {
                    type: 'video',
                    mimeType: 'video/webm;codecs=vp9',
                    bitsPerSecond: 128000000
                });

                recorder.startRecording();
                win.postMessage('START_STINGER', '*');

                let secondsLeft = 6;
                timer.innerText = "0" + secondsLeft;
                status.innerText = "🔴 GRABANDO...";

                const countdown = setInterval(() => {
                    secondsLeft--;
                    timer.innerText = "0" + secondsLeft;
                    if (secondsLeft <= 0) clearInterval(countdown);
                }, 1000);

                setTimeout(() => {
                    recorder.stopRecording(() => {
                        const blob = recorder.getBlob();
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'stinger_mu_neutro_6s.webm';
                        a.click();
                        stream.getTracks().forEach(t => t.stop());
                        win.close();
                        status.innerText = "✅ ¡Finalizado!";
                        btn.disabled = false;
                    });
                }, 6000);

            } catch (err) {
                status.innerText = "Error: " + err.message;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
