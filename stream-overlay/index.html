<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MU OLIMPO - Stream Overlay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <div class="overlay-container">
        
        <!-- MARCO DE CÁMARA PREMIUM -->
        <div class="overlay-element cam-frame">
            <div class="corner-ornament tl"></div>
            <div class="corner-ornament br"></div>
            <div class="cam-placeholder">
                <i class="fas fa-video"></i>
                <span>ESPACIO DE CÁMARA</span>
            </div>
            <div class="cam-label">
                <span class="eyebrow">EN VIVO</span>
                <span class="username">MU OLIMPO</span>
            </div>
        </div>

        <!-- CAJA DE CHAT ESTILIZADA -->
        <div class="overlay-element chat-box">
            <div class="chat-header">
                <i class="fas fa-comments"></i>
                <span>CHAT DE LA CRÓNICA</span>
            </div>
            <div class="chat-messages">
                <div class="message">
                    <span class="user">Admin:</span>
                    <span class="text">¡Bienvenidos a la aventura!</span>
                </div>
                <div class="message">
                    <span class="user sub">Suscriptor:</span>
                    <span class="text">¡Vamos! El servidor se ve increíble.</span>
                </div>
            </div>
            <div class="corner-ornament bl"></div>
        </div>

        <!-- BARRA DE EVENTOS RECIENTES -->
        <div class="overlay-element event-bar">
            <div class="event-item">
                <i class="fas fa-heart"></i>
                <span class="label">NUEVO SEGUIDOR:</span>
                <span class="value">Gorgon_Mu</span>
            </div>
            <div class="divider"></div>
            <div class="event-item">
                <i class="fas fa-star"></i>
                <span class="label">ÚLTIMO SUB:</span>
                <span class="value">Lilith_Queen</span>
            </div>
            <div class="divider"></div>
            <div class="event-item">
                <i class="fas fa-coins"></i>
                <span class="label">MAYOR DONACIÓN:</span>
                <span class="value">$50.00</span>
            </div>
        </div>

    </div>
</body>
</html>
