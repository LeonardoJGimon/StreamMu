<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Socials Widget</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
            font-weight: 400;
        }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff1a1a;
            --gold: #c0a375;
            --dark-bg: rgba(10, 5, 5, 0.9);
        }

        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            font-family: 'Alegreya', serif;
            overflow: hidden;
            width: 350px;
        }

        .social-widget {
            display: flex;
            align-items: center;
            background: var(--dark-bg);
            border: 1px solid rgba(157, 10, 14, 0.4);
            padding: 12px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        /* ORNAMENTOS */
        .social-widget::before, .social-widget::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--crimson);
        }

        .social-widget::before { top: -4px; left: -4px; border-right: 0; border-bottom: 0; }
        .social-widget::after { bottom: -4px; right: -4px; border-left: 0; border-top: 0; }

        .social-icon {
            font-size: 1.8rem;
            color: var(--gold);
            margin-right: 15px;
            filter: drop-shadow(0 0 10px rgba(192, 163, 117, 0.4));
        }

        .social-info {
            display: flex;
            flex-direction: column;
        }

        .social-platform {
            font-family: 'Exocet', serif;
            font-size: 0.7rem;
            color: var(--crimson);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
            margin-bottom: 2px;
        }

        .social-user {
            font-family: 'Alegreya', serif;
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Animación de rotación */
        .rotating-item {
            display: none;
            width: 100%;
            align-items: center;
        }
        
        .rotating-item.active {
            display: flex;
            animation: slideIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateX(0); filter: blur(0); }
        }

        /* EFECTO DE BRILLO AL ROTAR */
        .shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: skewX(-20deg);
            pointer-events: none;
        }

        .animate-shimmer {
            animation: shimmerEffect 0.6s ease-out;
        }

        @keyframes shimmerEffect {
            from { left: -100%; }
            to { left: 200%; }
        }
    </style>
</head>
<body>
    <div class="social-widget" id="social-container">
        <div class="shimmer" id="shimmer"></div>
        
        <!-- Discord -->
        <div class="rotating-item active" data-platform="Discord">
            <i class="fab fa-discord social-icon"></i>
            <div class="social-info">
                <span class="social-platform">Discord</span>
                <span class="social-user">mu-olimpo_Official</span>
            </div>
        </div>

        <!-- Instagram -->
        <div class="rotating-item" data-platform="Instagram">
            <i class="fab fa-instagram social-icon"></i>
            <div class="social-info">
                <span class="social-platform">Instagram</span>
                <span class="social-user">@mu-olimpo</span>
            </div>
        </div>

        <!-- Facebook -->
        <div class="rotating-item" data-platform="Facebook">
            <i class="fab fa-facebook social-icon"></i>
            <div class="social-info">
                <span class="social-platform">Facebook</span>
                <span class="social-user">MU OLIMPO Season 6</span>
            </div>
        </div>
    </div>

    <script>
        const items = document.querySelectorAll('.rotating-item');
        const shimmer = document.getElementById('shimmer');
        let currentIndex = 0;

        function rotateSocials() {
            items[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % items.length;
            items[currentIndex].classList.add('active');
            
            // Trigger shimmer
            shimmer.classList.remove('animate-shimmer');
            void shimmer.offsetWidth;
            shimmer.classList.add('animate-shimmer');
        }

        // Cambia de red social cada 10 segundos
        setInterval(rotateSocials, 10000);
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
