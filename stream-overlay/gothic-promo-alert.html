<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Código Promocional Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
        }
        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --gold-light: #f0d7a9;
            --stone: #0a0a0a;
            --fire: #7e0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            font-family: 'Exocet', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL GÓTICO */
        .promo-card {
            position: relative;
            width: 720px;
            background: linear-gradient(135deg, rgba(12, 12, 12, 0.95) 0%, rgba(5, 5, 5, 0.98) 100%);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 22px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), inset 0 0 25px rgba(126, 0, 0, 0.45);
            overflow: hidden;
            clip-path: polygon(3% 0%, 97% 0%, 100% 12%, 100% 88%, 97% 100%, 3% 100%, 0% 88%, 0% 12%);
            animation: cardPulse 4s infinite ease-in-out;
        }

        @keyframes cardPulse {
            0%, 100% { box-shadow: 0 0 35px rgba(0,0,0,0.95), inset 0 0 25px rgba(126, 0, 0, 0.45); }
            50% { box-shadow: 0 0 50px rgba(255, 46, 46, 0.3), inset 0 0 35px rgba(192, 163, 117, 0.5); }
        }

        /* BRILLO DIAGONAL QUE PASA */
        .promo-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(240, 215, 169, 0.25), transparent);
            transform: skewX(-25deg);
            animation: glint 4s infinite;
        }

        @keyframes glint {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* BANNER SUPERIOR TITILANDO */
        .blinking-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            animation: blinkGlow 1.2s infinite ease-in-out alternate;
        }

        @keyframes blinkGlow {
            0% {
                opacity: 1;
                text-shadow: 0 0 10px var(--crimson-bright), 0 0 20px var(--gold-light);
                transform: scale(1);
            }
            100% {
                opacity: 0.45;
                text-shadow: 0 0 3px var(--crimson), 0 0 8px var(--gold);
                transform: scale(0.98);
            }
        }

        /* ICONO DE REGALO ANIMADO */
        .gift-icon {
            font-size: 1.8rem;
            color: var(--gold-light);
            filter: drop-shadow(0 0 12px var(--crimson-bright));
            animation: bounceGift 2s infinite ease-in-out;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-4px) rotate(-6deg) scale(1.1); }
            75% { transform: translateY(-4px) rotate(6deg) scale(1.1); }
        }

        /* CONTENEDOR DEL CÓDIGO CENTRAL */
        .code-box {
            position: relative;
            background: linear-gradient(180deg, rgba(128, 0, 0, 0.6) 0%, rgba(10, 10, 10, 0.9) 100%);
            border: 2px solid var(--gold-light);
            padding: 10px 40px;
            border-radius: 6px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 46, 46, 0.4);
            z-index: 10;
        }

        .code-text {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 15px var(--crimson-bright), 0 0 8px #000;
            animation: codePulse 2.5s infinite alternate;
        }

        @keyframes codePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px var(--gold)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 20px var(--crimson-bright)); }
        }

        /* RECOMPENSA / PIE DE PÁGINA */
        .reward-info {
            font-family: 'Alegreya', sans-serif;
            font-size: 1.25rem;
            color: #dddddd;
            letter-spacing: 1.5px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 6px rgba(0,0,0,0.9);
        }

        .reward-info b {
            color: var(--gold-light);
            text-shadow: 0 0 8px var(--crimson-bright);
        }

        /* CHISPAS Y PARTICULAS FLOTANTES */
        #spark-container {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            animation: floatUp 3.5s infinite linear;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(80px) scale(1); opacity: 0; }
            30% { opacity: 0.8; }
            100% { transform: translateY(-80px) translateX(25px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="promo-card">
        <div id="spark-container"></div>

        <!-- TEXTO TITILANDO DE REGALO -->
        <div class="blinking-banner">
            <i class="fas fa-gift gift-icon"></i>
            <span>¡USA ESTE CÓDIGO EN TU LAUNCHER / DASH PARA UN REGALO!</span>
            <i class="fas fa-gift gift-icon"></i>
        </div>

        <!-- CAJA DEL CÓDIGO PROMOCIONAL -->
        <div class="code-box">
            <span class="code-text" id="promo-code-display">CARGANDO...</span>
        </div>

        <!-- DETALLE DE LA RECOMPENSA -->
        <div class="reward-info" id="reward-info">
            <i class="fas fa-sparkles"></i>
            <span id="reward-text">CANJÉALO GRATIS HOY MISMO</span>
        </div>
    </div>

    <script>
        // Generar partículas de chispas góticas
        const container = document.getElementById('spark-container');
        for (let i = 0; i < 14; i++) {
            let spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.width = (Math.random() * 3 + 2) + 'px';
            spark.style.height = spark.style.width;
            spark.style.animationDelay = (Math.random() * 4) + 's';
            container.appendChild(spark);
        }

        let promoList = [];
        let currentIndex = 0;

        async function fetchPromoCodes() {
            try {
                const res = await fetch('/api/promos?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && Array.isArray(data.promos) && data.promos.length > 0) {
                        promoList = data.promos;
                        renderCurrentPromo();
                        return;
                    }
                }
            } catch (e) {
                console.error("Error fetching promos:", e);
            }
            // Fallback por defecto si no hay códigos creados en la DB
            promoList = [{ Code: 'OLIMPO2026', RewardDetails: '{"currency":"wcoins","amount":"GRATIS"}' }];
            renderCurrentPromo();
        }

        function renderCurrentPromo() {
            if (!promoList.length) return;
            const promo = promoList[currentIndex % promoList.length];
            const codeEl = document.getElementById('promo-code-display');
            const rewardEl = document.getElementById('reward-text');

            if (codeEl) {
                codeEl.innerText = promo.Code;
            }

            if (rewardEl) {
                try {
                    const details = typeof promo.RewardDetails === 'string' ? JSON.parse(promo.RewardDetails) : promo.RewardDetails;
                    if (details && details.currency && details.amount) {
                        rewardEl.innerHTML = `RECOMPENSA: <b>${details.amount} ${details.currency.toUpperCase()}</b>`;
                    } else if (details && details.name) {
                        rewardEl.innerHTML = `RECOMPENSA: <b>${details.name}</b>`;
                    } else {
                        rewardEl.innerHTML = `CANJÉALO GRATIS EN TU <b>LAUNCHER O DASH</b>`;
                    }
                } catch(e) {
                    rewardEl.innerHTML = `CANJÉALO GRATIS EN TU <b>LAUNCHER O DASH</b>`;
                }
            }
        }

        function rotatePromos() {
            if (promoList.length > 1) {
                currentIndex = (currentIndex + 1) % promoList.length;
                renderCurrentPromo();
            }
        }

        fetchPromoCodes();
        setInterval(fetchPromoCodes, 15000); // Consultar base de datos cada 15 segundos
        setInterval(rotatePromos, 8000);       // Rotar códigos en pantalla cada 8 segundos si hay varios
    </script>
</body>
</html>
