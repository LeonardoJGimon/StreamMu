<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Código Promocional Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
        }
        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --gold-bright: #ffd700;
            --gold-light: #f0d7a9;
            --exc-green: #00ff66;
            --anc-blue: #00ccff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            font-family: 'Exocet', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL GÓTICO ORIGINAL */
        .promo-card {
            position: relative;
            width: 780px;
            background: linear-gradient(135deg, rgba(14, 10, 10, 0.97) 0%, rgba(4, 4, 4, 0.99) 100%);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 20px 28px;
            display: none; /* Se activa cuando hay códigos activos */
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 45px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(126, 0, 0, 0.6);
            overflow: hidden;
            animation: cardPulse 4s infinite ease-in-out;
        }

        @keyframes cardPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(0,0,0,0.95), inset 0 0 30px rgba(126, 0, 0, 0.5); }
            50% { box-shadow: 0 0 60px rgba(255, 46, 46, 0.4), inset 0 0 40px rgba(192, 163, 117, 0.6); }
        }

        /* BRILLO DIAGONAL QUE PASA */
        .promo-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(240, 215, 169, 0.25), transparent);
            transform: skewX(-25deg);
            animation: glint 4.5s infinite;
        }

        @keyframes glint {
            0% { left: -100%; }
            22% { left: 200%; }
            100% { left: 200%; }
        }

        /* BANNER SUPERIOR TITILANDO EXACTO */
        .blinking-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
            color: var(--gold-light);
            letter-spacing: 1.5px;
            text-align: center;
            animation: blinkGlow 1.2s infinite ease-in-out alternate;
        }

        @keyframes blinkGlow {
            0% { opacity: 1; text-shadow: 0 0 12px var(--crimson-bright), 0 0 20px var(--gold-light); }
            100% { opacity: 0.55; text-shadow: 0 0 4px var(--crimson), 0 0 8px var(--gold); }
        }

        .gift-icon {
            font-size: 1.6rem;
            color: var(--gold-bright);
            filter: drop-shadow(0 0 10px var(--crimson-bright));
            animation: bounceGift 2s infinite ease-in-out;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-4px) rotate(-8deg) scale(1.15); }
            75% { transform: translateY(-4px) rotate(8deg) scale(1.15); }
        }

        /* CAJA DEL CÓDIGO CENTRAL */
        .code-box {
            position: relative;
            background: linear-gradient(180deg, rgba(140, 0, 0, 0.8) 0%, rgba(10, 5, 5, 0.98) 100%);
            border: 2px solid var(--gold-light);
            padding: 8px 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 46, 46, 0.45);
            z-index: 10;
        }

        .code-text {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 18px var(--crimson-bright), 0 0 10px #000;
            animation: codePulse 2.5s infinite alternate;
        }

        @keyframes codePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px var(--gold)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 22px var(--crimson-bright)); }
        }

        /* CONTENEDOR DEL ÍTEM Y SUS DETALLES (ORGANIZADO LIMPIO SIN CUADRO AMARILLO FEO) */
        .item-details-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            background: rgba(10, 8, 8, 0.85);
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 12px 20px;
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.9);
            z-index: 10;
        }

        /* CONTENEDOR DEL ICONO PNG REAL (LIMPIO, SIN CUADRO AMARILLO SOBREPUESTO) */
        .item-icon-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(255, 46, 46, 0.25) 0%, transparent 70%);
        }

        /* IMAGEN DEL ÍTEM CON FLOTACIÓN Y RESPLANDOR NATURAL */
        .item-icon-png {
            max-width: 75px;
            max-height: 75px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 12px var(--gold-bright));
            animation: floatIcon 3s infinite ease-in-out;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 10px var(--gold-bright)); }
            50% { transform: translateY(-4px) scale(1.06); filter: drop-shadow(0 0 20px var(--crimson-bright)); }
        }

        /* INFORMACIÓN DEL ÍTEM */
        .item-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-name-heading {
            font-size: 1.45rem;
            color: var(--gold-light);
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px var(--crimson-bright);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-qty-pill {
            font-family: 'Alegreya', sans-serif;
            font-size: 1.05rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(140, 0, 0, 0.9) 0%, rgba(30, 5, 5, 0.95) 100%);
            border: 1px solid var(--crimson-bright);
            padding: 2px 12px;
            border-radius: 14px;
            letter-spacing: 1px;
        }

        .item-tags-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .item-tag {
            font-family: 'Alegreya', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .tag-lvl {
            background: var(--gold-bright);
            color: #000000;
        }

        .tag-exc {
            background: rgba(0, 40, 10, 0.9);
            color: var(--exc-green);
            border: 1px solid var(--exc-green);
        }

        .tag-luck {
            background: rgba(0, 30, 60, 0.9);
            color: var(--anc-blue);
            border: 1px solid var(--anc-blue);
        }

        .tag-category {
            background: rgba(40, 10, 15, 0.9);
            color: var(--gold-light);
            border: 1px solid var(--gold);
        }

        /* FILA INFERIOR DE ESTADO DE USOS (¿CUÁNTO ESTÁ Y CUÁNTOS QUEDAN?) */
        .usage-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding-top: 4px;
            z-index: 10;
            font-family: 'Alegreya', sans-serif;
        }

        .usage-text {
            font-size: 1.2rem;
            color: #dddddd;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .usage-text i {
            color: var(--gold-bright);
        }

        .usage-text b {
            color: var(--gold-bright);
            font-size: 1.3rem;
            text-shadow: 0 0 8px var(--crimson-bright);
        }

        .remaining-badge {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(128, 0, 0, 0.9) 0%, rgba(20, 5, 5, 0.95) 100%);
            border: 1px solid var(--crimson-bright);
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(255, 46, 46, 0.4);
            letter-spacing: 1px;
        }

        /* CHISPAS Y PARTICULAS FLOTANTES GÓTICAS */
        #spark-container {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            background: var(--gold-bright);
            border-radius: 50%;
            animation: floatUp 3.5s infinite linear;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(80px) scale(1); opacity: 0; }
            30% { opacity: 0.85; }
            100% { transform: translateY(-80px) translateX(25px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="promo-card" id="promo-card">
        <div id="spark-container"></div>

        <!-- BANNER SUPERIOR TITILANDO EXACTO (SIN CARACTERES EXTRAÑOS) -->
        <div class="blinking-banner">
            <i class="fas fa-gift gift-icon"></i>
            <span>USA ESTE CÓDIGO EN TU LAUNCHER PARA QUE OBTENGAS UN REGALO</span>
            <i class="fas fa-gift gift-icon"></i>
        </div>

        <!-- CAJA DEL CÓDIGO PROMOCIONAL CENTRAL -->
        <div class="code-box">
            <span class="code-text" id="promo-code-display">---</span>
        </div>

        <!-- DETALLES DEL ÍTEM REGALADO (LIMPIO, SIN CUADROS AMARILLOS SOBREPUESTOS) -->
        <div class="item-details-card">
            <div class="item-icon-wrapper">
                <img src="../assets/icon/items/box.png" class="item-icon-png" id="item-icon-png" alt="Item">
            </div>

            <div class="item-text-group">
                <div class="item-name-heading">
                    <span id="item-name-display">ÍTEM DE REGALO</span>
                    <span class="item-qty-pill" id="item-qty-display">x1 UNIDAD</span>
                </div>

                <div class="item-tags-container">
                    <span class="item-tag tag-lvl" id="tag-lvl" style="display:none;">+15</span>
                    <span class="item-tag tag-exc" id="tag-exc" style="display:none;">EXCELLENT</span>
                    <span class="item-tag tag-luck" id="tag-luck" style="display:none;">LUCK</span>
                    <span class="item-tag tag-category" id="tag-cat">RECOMPENSA</span>
                </div>
            </div>
        </div>

        <!-- BARRA INFERIOR DE ESTADO DE USOS (¿CUÁNTO ESTÁ Y CUÁNTOS QUEDAN?) -->
        <div class="usage-bar">
            <div class="usage-text">
                <i class="fas fa-users"></i>
                <span>USOS: <b id="usage-val">0 de 50</b></span>
            </div>
            <div class="remaining-badge" id="remaining-val">
                ¡QUEDAN 50 DISPONIBLES!
            </div>
        </div>
    </div>

    <script>
        // Generar partículas de chispas góticas
        const container = document.getElementById('spark-container');
        for (let i = 0; i < 15; i++) {
            let spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.width = (Math.random() * 3.5 + 2) + 'px';
            spark.style.height = spark.style.width;
            spark.style.animationDelay = (Math.random() * 4) + 's';
            container.appendChild(spark);
        }

        let promoList = [];
        let currentIndex = 0;
        let itemDb = {};

        // Cargar Base de Datos de Ítems
        fetch('../item_db.json').then(r => r.json()).then(d => { itemDb = d; }).catch(e => {});

        async function fetchPromoCodes() {
            try {
                const res = await fetch('/api/promos?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && Array.isArray(data.promos)) {
                        promoList = data.promos.filter(p => {
                            const max = Number(p.MaxUses || 0);
                            const current = Number(p.CurrentUses || 0);
                            return max === 0 || current < max;
                        });

                        const promoCard = document.getElementById('promo-card');
                        if (!promoList.length) {
                            promoCard.style.display = 'none';
                        } else {
                            promoCard.style.display = 'flex';
                            renderCurrentPromo();
                        }
                        return;
                    }
                }
            } catch (e) {
                console.error("Error fetching promos:", e);
            }
        }

        function renderCurrentPromo() {
            if (!promoList.length) return;
            const promo = promoList[currentIndex % promoList.length];

            const codeEl = document.getElementById('promo-code-display');
            const itemImgEl = document.getElementById('item-icon-png');
            const itemNameEl = document.getElementById('item-name-display');
            const itemQtyEl = document.getElementById('item-qty-display');
            const usageValEl = document.getElementById('usage-val');
            const remainingValEl = document.getElementById('remaining-val');

            const tagLvl = document.getElementById('tag-lvl');
            const tagExc = document.getElementById('tag-exc');
            const tagLuck = document.getElementById('tag-luck');
            const tagCat = document.getElementById('tag-cat');

            if (codeEl) {
                // Prevenir caracteres extraños limpiando texto
                codeEl.innerText = (promo.Code || '').replace(/[^\x00-\x7F]/g, "").trim() || promo.Code;
            }

            // Usos y Disponibles
            const max = Number(promo.MaxUses || 0);
            const current = Number(promo.CurrentUses || 0);
            if (usageValEl) {
                usageValEl.innerText = max > 0 ? `${current} de ${max}` : `${current} (ILIMITADO)`;
            }
            if (remainingValEl) {
                if (max > 0) {
                    const remaining = max - current;
                    remainingValEl.innerText = remaining === 1 ? `¡QUEDA 1 DISPONIBLE!` : `¡QUEDAN ${remaining} DISPONIBLES!`;
                } else {
                    remainingValEl.innerText = `¡CÓDIGO ILIMITADO!`;
                }
            }

            // Reset Tags
            tagLvl.style.display = 'none';
            tagExc.style.display = 'none';
            tagLuck.style.display = 'none';
            tagCat.innerText = 'RECOMPENSA';

            let details = promo.RewardDetails;
            if (typeof details === 'string') {
                try { details = JSON.parse(details); } catch(e) { details = {}; }
            }

            let typeStr = (details.reward_type || details.currency || details.type || '').toString().toLowerCase();
            let amount = details.amount || details.qty || details.count || (details.details ? details.details.count : 1) || 1;

            // 1. Monedas y Beneficios
            if (typeStr.includes('wcoin')) {
                itemNameEl.innerText = 'WCOINS';
                itemQtyEl.innerText = `${amount} MONEDAS`;
                itemImgEl.src = '../assets/icon/items/wcoin.png';
                itemImgEl.onerror = () => { itemImgEl.src = '../assets/icon/items/box.png'; };
                tagCat.innerText = 'MONEDA VIRTUAL';
                return;
            }
            if (typeStr.includes('goblin') || typeStr.includes('gp')) {
                itemNameEl.innerText = 'GOBLIN POINTS';
                itemQtyEl.innerText = `${amount} PTS`;
                itemImgEl.src = '../assets/icon/items/wcoin.png';
                tagCat.innerText = 'PUNTOS GOBLIN';
                return;
            }
            if (typeStr.includes('zen')) {
                itemNameEl.innerText = 'ZEN';
                itemQtyEl.innerText = `${amount.toLocaleString()} ZEN`;
                itemImgEl.src = '../assets/icon/items/box.png';
                tagCat.innerText = 'MONEDA ORO';
                return;
            }
            if (typeStr.includes('vip')) {
                itemNameEl.innerText = 'VIP PREMIUM';
                itemQtyEl.innerText = `${amount} ${amount === 1 ? 'DÍA' : 'DÍAS'}`;
                itemImgEl.src = '../assets/icon/items/vip.png';
                tagCat.innerText = 'MEMBRESÍA VIP';
                return;
            }

            // 2. Ítems por ItemType y ItemIndex o Nombre
            let cat = details.ItemType !== undefined ? details.ItemType : (details.details ? details.details.ItemType : null);
            let idx = details.ItemIndex !== undefined ? details.ItemIndex : (details.details ? details.details.ItemIndex : null);
            let itemName = details.itemName || details.name || (details.details ? (details.details.itemName || details.details.name) : null);

            let itemLevel = details.level !== undefined ? details.level : (details.details ? details.details.level : null);
            let hasLuck = details.luck || (details.details ? details.details.luck : false);
            let isExc = details.exc || details.isExc || (details.details ? (details.details.exc || details.details.isExc) : false);

            if (itemLevel !== null && itemLevel > 0) {
                tagLvl.innerText = `+${itemLevel}`;
                tagLvl.style.display = 'inline-block';
            }
            if (isExc) {
                tagExc.style.display = 'inline-block';
            }
            if (hasLuck) {
                tagLuck.style.display = 'inline-block';
            }

            if (cat !== null && idx !== null) {
                let dbName = itemDb[`${cat}_${idx}`];
                if (dbName) itemName = dbName;
            }

            if (itemName && (itemName.toLowerCase() === 'item_vault' || itemName.toLowerCase() === 'ítem baúl' || itemName.toLowerCase() === 'item baul')) {
                itemName = null;
            }

            itemQtyEl.innerText = amount === 1 ? 'x1 UNIDAD' : `x${amount} UNIDADES`;

            if (cat !== null && idx !== null) {
                itemNameEl.innerText = itemName ? itemName.toUpperCase() : `ÍTEM [${cat}-${idx}]`;
                itemImgEl.src = `../assets/icon/items/${cat}/${idx}.png`;
                itemImgEl.onerror = () => { itemImgEl.src = '../assets/icon/items/box.png'; };
                tagCat.innerText = isExc ? 'EXCELLENT ITEM' : 'ÍTEM DE JUEGO';
            } else if (itemName) {
                itemNameEl.innerText = itemName.toUpperCase();
                let clean = itemName.toLowerCase().replace(/[^a-z0-9]/g, '');
                let found = itemDb['name_' + clean];
                if (found) {
                    itemImgEl.src = `../assets/icon/items/${found.category}/${found.index}.png`;
                } else {
                    itemImgEl.src = '../assets/icon/items/box.png';
                }
                itemImgEl.onerror = () => { itemImgEl.src = '../assets/icon/items/box.png'; };
                tagCat.innerText = 'ÍTEM ESPECIAL';
            } else {
                itemNameEl.innerText = 'ÍTEM REGALO';
                itemImgEl.src = '../assets/icon/items/box.png';
                tagCat.innerText = 'RECOMPENSA MISTERIOSA';
            }
        }

        function rotatePromos() {
            if (promoList.length > 1) {
                currentIndex = (currentIndex + 1) % promoList.length;
                renderCurrentPromo();
            }
        }

        fetchPromoCodes();
        setInterval(fetchPromoCodes, 5000);
        setInterval(rotatePromos, 8000);
    </script>
</body>
</html>
