<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Código Promocional Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
        }
        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --gold-light: #f0d7a9;
            --stone: #0a0a0a;
            --fire: #7e0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            font-family: 'Exocet', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL GÓTICO - OCULTO POR DEFECTO HASTA QUE HAYA CÓDIGO ACTIVO */
        .promo-card {
            position: relative;
            width: 800px;
            background: linear-gradient(135deg, rgba(12, 12, 12, 0.96) 0%, rgba(4, 4, 4, 0.98) 100%);
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 24px 35px;
            display: none; /* Se activa automáticamente cuando hay códigos activos */
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(126, 0, 0, 0.5);
            overflow: hidden;
            clip-path: polygon(3% 0%, 97% 0%, 100% 12%, 100% 88%, 97% 100%, 3% 100%, 0% 88%, 0% 12%);
            animation: cardPulse 4s infinite ease-in-out;
            transition: opacity 0.5s ease-in-out;
        }

        @keyframes cardPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(0,0,0,0.95), inset 0 0 30px rgba(126, 0, 0, 0.5); }
            50% { box-shadow: 0 0 60px rgba(255, 46, 46, 0.35), inset 0 0 40px rgba(192, 163, 117, 0.6); }
        }

        /* BRILLO DIAGONAL QUE PASA */
        .promo-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(240, 215, 169, 0.3), transparent);
            transform: skewX(-25deg);
            animation: glint 4s infinite;
        }

        @keyframes glint {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* BANNER SUPERIOR TITILANDO */
        .blinking-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1.18rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 14px;
            animation: blinkGlow 1.2s infinite ease-in-out alternate;
        }

        @keyframes blinkGlow {
            0% {
                opacity: 1;
                text-shadow: 0 0 12px var(--crimson-bright), 0 0 25px var(--gold-light);
                transform: scale(1);
            }
            100% {
                opacity: 0.45;
                text-shadow: 0 0 4px var(--crimson), 0 0 10px var(--gold);
                transform: scale(0.98);
            }
        }

        /* ICONO DE REGALO ANIMADO */
        .gift-icon {
            font-size: 1.9rem;
            color: var(--gold-light);
            filter: drop-shadow(0 0 12px var(--crimson-bright));
            animation: bounceGift 2s infinite ease-in-out;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-5px) rotate(-8deg) scale(1.15); }
            75% { transform: translateY(-5px) rotate(8deg) scale(1.15); }
        }

        /* CAJA DEL CÓDIGO CENTRAL */
        .code-box {
            position: relative;
            background: linear-gradient(180deg, rgba(140, 0, 0, 0.7) 0%, rgba(8, 8, 8, 0.95) 100%);
            border: 2px solid var(--gold-light);
            padding: 12px 45px;
            border-radius: 8px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 46, 46, 0.45);
            z-index: 10;
        }

        .code-text {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 18px var(--crimson-bright), 0 0 10px #000;
            animation: codePulse 2.5s infinite alternate;
        }

        @keyframes codePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px var(--gold)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 25px var(--crimson-bright)); }
        }

        /* FILA INFERIOR DE DETALLES (RECOMPENSA CON NOMBRE REAL + UNIDADES + CONTADOR DE USOS) */
        .details-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 14px;
            z-index: 10;
            flex-wrap: wrap;
        }

        .reward-badge-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--gold);
            padding: 8px 22px;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(192, 163, 117, 0.3);
        }

        .reward-icon-fa {
            font-size: 1.5rem;
            color: var(--gold-light);
            filter: drop-shadow(0 0 8px var(--crimson-bright));
        }

        .reward-info-text {
            font-family: 'Alegreya', sans-serif;
            font-size: 1.35rem;
            color: #eeeeee;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .reward-info-text b {
            color: var(--gold-light);
            font-size: 1.45rem;
            text-shadow: 0 0 10px var(--crimson-bright);
        }

        /* BADGE DEL CONTADOR DE USOS (ej. "USOS: 1 de 50") */
        .usage-badge-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(180deg, rgba(128, 0, 0, 0.8) 0%, rgba(20, 5, 5, 0.95) 100%);
            border: 1px solid var(--crimson-bright);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(255, 46, 46, 0.4);
            font-family: 'Alegreya', sans-serif;
            font-size: 1.35rem;
            color: #ffffff;
            letter-spacing: 1.5px;
        }

        .usage-badge-container i {
            color: var(--gold-light);
            font-size: 1.3rem;
            filter: drop-shadow(0 0 6px var(--gold));
        }

        .usage-badge-container b {
            color: #ffffff;
            font-size: 1.45rem;
            text-shadow: 0 0 10px var(--crimson-bright);
        }

        /* CHISPAS Y PARTICULAS FLOTANTES */
        #spark-container {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            animation: floatUp 3.5s infinite linear;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(80px) scale(1); opacity: 0; }
            30% { opacity: 0.8; }
            100% { transform: translateY(-80px) translateX(25px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="promo-card" id="promo-card">
        <div id="spark-container"></div>

        <!-- TEXTO TITILANDO EXACTO SOLICITADO -->
        <div class="blinking-banner">
            <i class="fas fa-gift gift-icon"></i>
            <span>USA ESTE CÓDIGO EN TU LAUNCHER PARA QUE OBTENGAS UN REGALO</span>
            <i class="fas fa-gift gift-icon"></i>
        </div>

        <!-- CAJA DEL CÓDIGO PROMOCIONAL -->
        <div class="code-box">
            <span class="code-text" id="promo-code-display">---</span>
        </div>

        <!-- FILA DE DETALLES (NOMBRE REAL DEL ÍTEM + CANTIDAD DE UNIDADES + USOS) -->
        <div class="details-row">
            <div class="reward-badge-container" id="reward-container">
                <i class="fas fa-gift reward-icon-fa" id="reward-icon"></i>
                <span class="reward-info-text" id="reward-text">REGALO: <b>--</b></span>
            </div>

            <div class="usage-badge-container" id="usage-container">
                <i class="fas fa-users"></i>
                <span id="usage-text">USOS: <b id="usage-count">0 de 50</b></span>
            </div>
        </div>
    </div>

    <script>
        // Generar partículas de chispas góticas
        const container = document.getElementById('spark-container');
        for (let i = 0; i < 15; i++) {
            let spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.width = (Math.random() * 3 + 2) + 'px';
            spark.style.height = spark.style.width;
            spark.style.animationDelay = (Math.random() * 4) + 's';
            container.appendChild(spark);
        }

        let promoList = [];
        let currentIndex = 0;

        async function fetchPromoCodes() {
            try {
                const res = await fetch('/api/promos?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && Array.isArray(data.promos)) {
                        // Filtrar únicamente códigos que estén activos y tengan usos disponibles
                        promoList = data.promos.filter(p => {
                            const max = Number(p.MaxUses || 0);
                            const current = Number(p.CurrentUses || 0);
                            return max === 0 || current < max;
                        });

                        const promoCard = document.getElementById('promo-card');
                        if (!promoList.length) {
                            promoCard.style.display = 'none'; // Ocultar automáticamente si no hay códigos operativos
                        } else {
                            promoCard.style.display = 'flex'; // Mostrar automáticamente al crear un código
                            renderCurrentPromo();
                        }
                        return;
                    }
                }
            } catch (e) {
                console.error("Error fetching promos:", e);
            }
        }

        function renderCurrentPromo() {
            if (!promoList.length) return;
            const promo = promoList[currentIndex % promoList.length];
            const codeEl = document.getElementById('promo-code-display');
            const rewardTextEl = document.getElementById('reward-text');
            const rewardIconEl = document.getElementById('reward-icon');
            const usageCountEl = document.getElementById('usage-count');

            if (codeEl) {
                codeEl.innerText = promo.Code;
            }

            // Mostrar usos consumidos (ej. "1 de 50")
            if (usageCountEl) {
                const max = Number(promo.MaxUses || 0);
                const current = Number(promo.CurrentUses || 0);
                if (max > 0) {
                    usageCountEl.innerText = `${current} de ${max}`;
                } else {
                    usageCountEl.innerText = `${current} (ILIMITADO)`;
                }
            }

            // Formatear Recompensa y Nombre Real del Ítem con su Cantidad Exacta
            if (rewardTextEl && rewardIconEl) {
                try {
                    let details = promo.RewardDetails;
                    if (typeof details === 'string') {
                        try { details = JSON.parse(details); } catch(e) {}
                    }
                    
                    let rawItemName = details ? (details.itemName || details.name || (details.details ? (details.details.itemName || details.details.name) : null)) : null;
                    if (rawItemName && (rawItemName.toLowerCase() === 'item_vault' || rawItemName.toLowerCase() === 'ítem baúl' || rawItemName.toLowerCase() === 'item baul')) {
                        rawItemName = null;
                    }

                    let count = details ? (details.count || details.qty || details.amount || (details.details ? details.details.count : 1) || 1) : 1;
                    let unitStr = count === 1 ? '1 UNIDAD' : `${count} UNIDADES`;

                    if (rawItemName) {
                        let nameUpper = rawItemName.toUpperCase();
                        rewardTextEl.innerHTML = `REGALO: <b>${nameUpper} (${unitStr})</b>`;

                        // Asignar icono según categoría del ítem
                        if (nameUpper.includes('RING') || nameUpper.includes('ANILLO')) rewardIconEl.className = 'fas fa-ring reward-icon-fa';
                        else if (nameUpper.includes('WING') || nameUpper.includes('ALAS')) rewardIconEl.className = 'fas fa-feather-pointed reward-icon-fa';
                        else if (nameUpper.includes('JEWEL') || nameUpper.includes('JOYA')) rewardIconEl.className = 'fas fa-gem reward-icon-fa';
                        else if (nameUpper.includes('PET') || nameUpper.includes('PANDA') || nameUpper.includes('SKELETON')) rewardIconEl.className = 'fas fa-paw reward-icon-fa';
                        else if (nameUpper.includes('SWORD') || nameUpper.includes('ESPADA')) rewardIconEl.className = 'fas fa-khanda reward-icon-fa';
                        else if (nameUpper.includes('SHIELD') || nameUpper.includes('ESCUDO')) rewardIconEl.className = 'fas fa-shield-halved reward-icon-fa';
                        else rewardIconEl.className = 'fas fa-box-open reward-icon-fa';

                    } else if (details && (details.currency || details.type)) {
                        let curr = (details.currency || details.type).toUpperCase();
                        let amt = details.amount || details.qty || count || 1;
                        let amtStr = (curr.includes('WCOIN') || curr.includes('GP') || curr.includes('ZEN')) ? `${amt} ${curr}` : (amt === 1 ? '1 UNIDAD' : `${amt} UNIDADES`);

                        rewardTextEl.innerHTML = `REGALO: <b>${curr} (${amtStr})</b>`;

                        if (curr.includes('WCOIN')) rewardIconEl.className = 'fas fa-gem reward-icon-fa';
                        else if (curr.includes('GOBLIN') || curr.includes('GP')) rewardIconEl.className = 'fas fa-flask reward-icon-fa';
                        else if (curr.includes('VIP')) rewardIconEl.className = 'fas fa-crown reward-icon-fa';
                        else rewardIconEl.className = 'fas fa-coins reward-icon-fa';

                    } else {
                        rewardTextEl.innerHTML = `REGALO: <b>RECOMPENSA ESPECIAL (${unitStr})</b>`;
                        rewardIconEl.className = 'fas fa-gift reward-icon-fa';
                    }
                } catch(e) {
                    rewardTextEl.innerHTML = `REGALO: <b>RECOMPENSA ESPECIAL</b>`;
                    rewardIconEl.className = 'fas fa-gift reward-icon-fa';
                }
            }
        }

        function rotatePromos() {
            if (promoList.length > 1) {
                currentIndex = (currentIndex + 1) % promoList.length;
                renderCurrentPromo();
            }
        }

        fetchPromoCodes();
        setInterval(fetchPromoCodes, 5000); // Consultar DB cada 5 segundos para actualización en vivo
        setInterval(rotatePromos, 8000);      // Rotar entre promociones cada 8 segundos
    </script>
</body>
</html>
