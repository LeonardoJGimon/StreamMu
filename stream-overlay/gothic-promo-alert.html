<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Código Promocional Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
        }
        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --gold-light: #f0d7a9;
            --stone: #0a0a0a;
            --fire: #7e0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            font-family: 'Exocet', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL GÓTICO */
        .promo-card {
            position: relative;
            width: 780px;
            background: linear-gradient(135deg, rgba(12, 12, 12, 0.96) 0%, rgba(4, 4, 4, 0.98) 100%);
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 24px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(126, 0, 0, 0.5);
            overflow: hidden;
            clip-path: polygon(3% 0%, 97% 0%, 100% 12%, 100% 88%, 97% 100%, 3% 100%, 0% 88%, 0% 12%);
            animation: cardPulse 4s infinite ease-in-out;
        }

        @keyframes cardPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(0,0,0,0.95), inset 0 0 30px rgba(126, 0, 0, 0.5); }
            50% { box-shadow: 0 0 60px rgba(255, 46, 46, 0.35), inset 0 0 40px rgba(192, 163, 117, 0.6); }
        }

        /* BRILLO DIAGONAL QUE PASA */
        .promo-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(240, 215, 169, 0.3), transparent);
            transform: skewX(-25deg);
            animation: glint 4s infinite;
        }

        @keyframes glint {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* BANNER SUPERIOR TITILANDO */
        .blinking-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1.18rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 14px;
            animation: blinkGlow 1.2s infinite ease-in-out alternate;
        }

        @keyframes blinkGlow {
            0% {
                opacity: 1;
                text-shadow: 0 0 12px var(--crimson-bright), 0 0 25px var(--gold-light);
                transform: scale(1);
            }
            100% {
                opacity: 0.45;
                text-shadow: 0 0 4px var(--crimson), 0 0 10px var(--gold);
                transform: scale(0.98);
            }
        }

        /* ICONO DE REGALO ANIMADO */
        .gift-icon {
            font-size: 1.9rem;
            color: var(--gold-light);
            filter: drop-shadow(0 0 12px var(--crimson-bright));
            animation: bounceGift 2s infinite ease-in-out;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-5px) rotate(-8deg) scale(1.15); }
            75% { transform: translateY(-5px) rotate(8deg) scale(1.15); }
        }

        /* CAJA DEL CÓDIGO CENTRAL */
        .code-box {
            position: relative;
            background: linear-gradient(180deg, rgba(140, 0, 0, 0.7) 0%, rgba(8, 8, 8, 0.95) 100%);
            border: 2px solid var(--gold-light);
            padding: 12px 45px;
            border-radius: 8px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 46, 46, 0.45);
            z-index: 10;
        }

        .code-text {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 18px var(--crimson-bright), 0 0 10px #000;
            animation: codePulse 2.5s infinite alternate;
        }

        @keyframes codePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px var(--gold)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 25px var(--crimson-bright)); }
        }

        /* CAJA DESTACADA DE RECOMPENSA / ÍTEM */
        .reward-badge-container {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--gold);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(192, 163, 117, 0.3);
            z-index: 10;
        }

        .reward-icon-img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--gold-light));
        }

        .reward-icon-fa {
            font-size: 1.6rem;
            color: var(--gold-light);
            filter: drop-shadow(0 0 8px var(--crimson-bright));
        }

        .reward-info-text {
            font-family: 'Alegreya', sans-serif;
            font-size: 1.4rem;
            color: #eeeeee;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .reward-info-text b {
            color: var(--gold-light);
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--crimson-bright);
        }

        /* CHISPAS Y PARTICULAS FLOTANTES */
        #spark-container {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            animation: floatUp 3.5s infinite linear;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(80px) scale(1); opacity: 0; }
            30% { opacity: 0.8; }
            100% { transform: translateY(-80px) translateX(25px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="promo-card">
        <div id="spark-container"></div>

        <!-- TEXTO TITILANDO EXACTO SOLICITADO -->
        <div class="blinking-banner">
            <i class="fas fa-gift gift-icon"></i>
            <span>USA ESTE CÓDIGO EN TU LAUNCHER PARA QUE OBTENGAS UN REGALO</span>
            <i class="fas fa-gift gift-icon"></i>
        </div>

        <!-- CAJA DEL CÓDIGO PROMOCIONAL -->
        <div class="code-box">
            <span class="code-text" id="promo-code-display">CARGANDO...</span>
        </div>

        <!-- CAJA DE LA RECOMPENSA / ÍTEM EN REGALO -->
        <div class="reward-badge-container" id="reward-container">
            <i class="fas fa-gem reward-icon-fa" id="reward-icon"></i>
            <span class="reward-info-text" id="reward-text">RECOMPENSA: <b>500 WCOINS</b></span>
        </div>
    </div>

    <script>
        // Generar partículas de chispas góticas
        const container = document.getElementById('spark-container');
        for (let i = 0; i < 15; i++) {
            let spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.width = (Math.random() * 3 + 2) + 'px';
            spark.style.height = spark.style.width;
            spark.style.animationDelay = (Math.random() * 4) + 's';
            container.appendChild(spark);
        }

        let promoList = [];
        let currentIndex = 0;

        async function fetchPromoCodes() {
            try {
                const res = await fetch('/api/promos?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && Array.isArray(data.promos) && data.promos.length > 0) {
                        promoList = data.promos;
                        renderCurrentPromo();
                        return;
                    }
                }
            } catch (e) {
                console.error("Error fetching promos:", e);
            }
            // Fallback si no hay códigos creados en la DB
            promoList = [{
                Code: 'STREAM-DAR-9DMJ1',
                RewardDetails: '{"currency":"wcoins","amount":5}'
            }];
            renderCurrentPromo();
        }

        function renderCurrentPromo() {
            if (!promoList.length) return;
            const promo = promoList[currentIndex % promoList.length];
            const codeEl = document.getElementById('promo-code-display');
            const rewardTextEl = document.getElementById('reward-text');
            const rewardIconEl = document.getElementById('reward-icon');

            if (codeEl) {
                codeEl.innerText = promo.Code;
            }

            if (rewardTextEl && rewardIconEl) {
                try {
                    const details = typeof promo.RewardDetails === 'string' ? JSON.parse(promo.RewardDetails) : promo.RewardDetails;
                    
                    // Ítem de Vault o Ítem Especial
                    if (details && (details.name || details.itemName)) {
                        const name = details.name || details.itemName;
                        const count = details.count || (details.details ? details.details.count : 1);
                        const countStr = count > 1 ? ` (x${count})` : '';
                        
                        rewardTextEl.innerHTML = `REGALO: <b>${name.toUpperCase()}${countStr}</b>`;
                        rewardIconEl.className = 'fas fa-box-open reward-icon-fa';
                    }
                    // Monedas (WCoins, GoblinPoints, Zen, Cash, VIP)
                    else if (details && (details.currency || details.type)) {
                        const curr = (details.currency || details.type).toUpperCase();
                        const amt = details.amount || details.qty || 1;
                        
                        rewardTextEl.innerHTML = `REGALO: <b>${amt} ${curr}</b>`;
                        
                        if (curr.includes('WCOIN')) rewardIconEl.className = 'fas fa-gem reward-icon-fa';
                        else if (curr.includes('GOBLIN') || curr.includes('GP')) rewardIconEl.className = 'fas fa-flask reward-icon-fa';
                        else if (curr.includes('VIP')) rewardIconEl.className = 'fas fa-crown reward-icon-fa';
                        else rewardIconEl.className = 'fas fa-coins reward-icon-fa';
                    } else {
                        rewardTextEl.innerHTML = `REGALO: <b>RECOMPENSA ESPECIAL</b>`;
                        rewardIconEl.className = 'fas fa-gift reward-icon-fa';
                    }
                } catch(e) {
                    rewardTextEl.innerHTML = `REGALO: <b>RECOMPENSA ESPECIAL</b>`;
                    rewardIconEl.className = 'fas fa-gift reward-icon-fa';
                }
            }
        }

        function rotatePromos() {
            if (promoList.length > 1) {
                currentIndex = (currentIndex + 1) % promoList.length;
                renderCurrentPromo();
            }
        }

        fetchPromoCodes();
        setInterval(fetchPromoCodes, 15000); // Consultar DB cada 15 segundos
        setInterval(rotatePromos, 8000);       // Rotar promociones cada 8 segundos
    </script>
</body>
</html>
