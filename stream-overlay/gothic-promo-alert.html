<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Código Promocional Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
        }
        @font-face {
            font-family: 'Alegreya';
            src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype');
        }

        :root {
            --crimson: #800000;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --gold-bright: #ffd700;
            --gold-light: #f0d7a9;
            --stone: #0a0a0a;
            --exc-green: #00ff66;
            --anc-blue: #00ccff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            font-family: 'Exocet', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL GÓTICO - OCULTO POR DEFECTO HASTA QUE HAYA CÓDIGO ACTIVO */
        .promo-card {
            position: relative;
            width: 820px;
            background: linear-gradient(135deg, rgba(14, 12, 12, 0.98) 0%, rgba(4, 4, 4, 0.99) 100%);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 24px 32px;
            display: none; /* Se activa automáticamente cuando hay códigos activos */
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.98), inset 0 0 35px rgba(126, 0, 0, 0.6);
            overflow: hidden;
            clip-path: polygon(3% 0%, 97% 0%, 100% 8%, 100% 92%, 97% 100%, 3% 100%, 0% 92%, 0% 8%);
            animation: cardPulse 4s infinite ease-in-out;
            transition: all 0.5s ease-in-out;
        }

        @keyframes cardPulse {
            0%, 100% { box-shadow: 0 0 45px rgba(0,0,0,0.98), inset 0 0 35px rgba(126, 0, 0, 0.5); }
            50% { box-shadow: 0 0 70px rgba(255, 46, 46, 0.4), inset 0 0 45px rgba(192, 163, 117, 0.7); }
        }

        /* BRILLO DIAGONAL QUE PASA */
        .promo-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(240, 215, 169, 0.25), transparent);
            transform: skewX(-25deg);
            animation: glint 4.5s infinite;
        }

        @keyframes glint {
            0% { left: -100%; }
            22% { left: 200%; }
            100% { left: 200%; }
        }

        /* BANNER SUPERIOR TITILANDO EXACTO */
        .blinking-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 12px;
            animation: blinkGlow 1.2s infinite ease-in-out alternate;
        }

        @keyframes blinkGlow {
            0% {
                opacity: 1;
                text-shadow: 0 0 12px var(--crimson-bright), 0 0 25px var(--gold-light);
                transform: scale(1);
            }
            100% {
                opacity: 0.5;
                text-shadow: 0 0 4px var(--crimson), 0 0 10px var(--gold);
                transform: scale(0.98);
            }
        }

        .gift-icon {
            font-size: 1.8rem;
            color: var(--gold-bright);
            filter: drop-shadow(0 0 12px var(--crimson-bright));
            animation: bounceGift 2s infinite ease-in-out;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-4px) rotate(-8deg) scale(1.15); }
            75% { transform: translateY(-4px) rotate(8deg) scale(1.15); }
        }

        /* CAJA DEL CÓDIGO CENTRAL */
        .code-box {
            position: relative;
            background: linear-gradient(180deg, rgba(140, 0, 0, 0.75) 0%, rgba(8, 8, 8, 0.98) 100%);
            border: 2px solid var(--gold-light);
            padding: 10px 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 46, 46, 0.45);
            z-index: 10;
            margin-bottom: 14px;
        }

        .code-text {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 18px var(--crimson-bright), 0 0 10px #000;
            animation: codePulse 2.5s infinite alternate;
        }

        @keyframes codePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px var(--gold)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 25px var(--crimson-bright)); }
        }

        /* SECCIÓN DEL ÍTEM REGALADO HERO (GRANDE Y LLAMATIVO) */
        .hero-item-section {
            display: flex;
            align-items: center;
            width: 100%;
            background: rgba(10, 8, 8, 0.9);
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 14px 22px;
            gap: 24px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 0 20px rgba(192, 163, 117, 0.25);
            position: relative;
            z-index: 10;
        }

        /* PEDESTAL/MARCO GÓTICO PARA EL ICONO DEL ÍTEM */
        .hero-icon-pedestal {
            position: relative;
            width: 110px;
            height: 110px;
            min-width: 110px;
            background: radial-gradient(circle, rgba(128, 0, 0, 0.6) 0%, rgba(10, 10, 10, 0.95) 75%);
            border: 2px solid var(--gold-bright);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4), inset 0 0 15px rgba(255, 46, 46, 0.5);
            overflow: visible;
        }

        /* ANILLO RESPLANDECINTE DETRÁS DEL ICONO */
        .hero-icon-pedestal::before {
            content: "";
            position: absolute;
            width: 125px; height: 125px;
            border: 1px stroke var(--gold-light);
            border-radius: 50%;
            border-top: 2px solid var(--gold-bright);
            border-bottom: 2px solid var(--crimson-bright);
            animation: rotateAura 6s linear infinite;
        }

        @keyframes rotateAura {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* IMAGEN PNG REAL DEL ÍTEM GRANDE */
        .hero-item-png {
            max-width: 90px;
            max-height: 90px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.8));
            animation: levitateItem 3s infinite ease-in-out;
            z-index: 5;
        }

        @keyframes levitateItem {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.7)); }
            50% { transform: translateY(-6px) scale(1.08); filter: drop-shadow(0 0 22px rgba(255, 46, 46, 0.9)); }
        }

        /* DETALLES Y OPCIONES DEL ÍTEM */
        .hero-item-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            flex-grow: 1;
        }

        .hero-item-title {
            font-size: 1.55rem;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--crimson-bright);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hero-item-qty {
            font-family: 'Alegreya', sans-serif;
            font-size: 1.1rem;
            color: #ffffff;
            background: rgba(128, 0, 0, 0.8);
            border: 1px solid var(--crimson-bright);
            padding: 2px 10px;
            border-radius: 12px;
            letter-spacing: 1px;
        }

        /* ETIQUETAS DE OPCIONES Y PROPIEDADES DEL ÍTEM */
        .item-options-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .option-tag {
            font-family: 'Alegreya', sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        }

        .tag-level {
            background: linear-gradient(135deg, #b8860b 0%, #ffd700 100%);
            color: #000000;
            border: 1px solid #ffffff;
        }

        .tag-exc {
            background: rgba(0, 40, 10, 0.9);
            color: var(--exc-green);
            border: 1px solid var(--exc-green);
            text-shadow: 0 0 6px var(--exc-green);
        }

        .tag-luck {
            background: rgba(0, 30, 60, 0.9);
            color: var(--anc-blue);
            border: 1px solid var(--anc-blue);
            text-shadow: 0 0 6px var(--anc-blue);
        }

        .tag-skill {
            background: rgba(60, 0, 60, 0.9);
            color: #ff66ff;
            border: 1px solid #ff66ff;
        }

        .tag-currency {
            background: linear-gradient(135deg, #7e0000 0%, #ff2e2e 100%);
            color: #ffffff;
            border: 1px solid var(--gold-light);
        }

        /* BARRA INFERIOR DE ESTADO DE USOS (¿CUÁNTO ESTÁ Y CUÁNTOS QUEDAN?) */
        .usage-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 14px;
            background: rgba(12, 12, 12, 0.95);
            border-top: 1px solid rgba(192, 163, 117, 0.4);
            padding-top: 10px;
            z-index: 10;
        }

        .usage-info-text {
            font-family: 'Alegreya', sans-serif;
            font-size: 1.25rem;
            color: #dddddd;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .usage-info-text i {
            color: var(--gold-bright);
            font-size: 1.2rem;
        }

        .usage-info-text b {
            color: var(--gold-bright);
            font-size: 1.35rem;
            text-shadow: 0 0 10px var(--crimson-bright);
        }

        .usage-remaining-badge {
            font-family: 'Alegreya', sans-serif;
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(128, 0, 0, 0.9) 0%, rgba(20, 5, 5, 0.95) 100%);
            border: 1px solid var(--crimson-bright);
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(255, 46, 46, 0.4);
            letter-spacing: 1px;
        }

        /* CHISPAS Y PARTICULAS FLOTANTES GÓTICAS */
        #spark-container {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            background: var(--gold-bright);
            border-radius: 50%;
            animation: floatUp 3.5s infinite linear;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(90px) scale(1); opacity: 0; }
            30% { opacity: 0.85; }
            100% { transform: translateY(-90px) translateX(30px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="promo-card" id="promo-card">
        <div id="spark-container"></div>

        <!-- BANNER SUPERIOR TITILANDO -->
        <div class="blinking-banner">
            <i class="fas fa-gift gift-icon"></i>
            <span>USA ESTE CÓDIGO EN TU LAUNCHER PARA QUE OBTENGAS UN REGALO</span>
            <i class="fas fa-gift gift-icon"></i>
        </div>

        <!-- CAJA DEL CÓDIGO PROMOCIONAL CENTRAL -->
        <div class="code-box">
            <span class="code-text" id="promo-code-display">---</span>
        </div>

        <!-- SECCIÓN PRINCIPAL HERO DEL ÍTEM (LLAMATIVO Y CON INFORMACIÓN COMPLETA) -->
        <div class="hero-item-section">
            <div class="hero-icon-pedestal" id="hero-icon-pedestal">
                <img src="../assets/icon/items/box.png" class="hero-item-png" id="hero-item-img" alt="Item Image">
            </div>

            <div class="hero-item-details">
                <div class="hero-item-title">
                    <span id="hero-item-name">ÍTEM REGALO</span>
                    <span class="hero-item-qty" id="hero-item-qty">x1 UNIDAD</span>
                </div>

                <div class="item-options-row" id="item-options-container">
                    <span class="option-tag tag-level" id="tag-level" style="display:none;">+15</span>
                    <span class="option-tag tag-exc" id="tag-exc" style="display:none;">EXCELLENT</span>
                    <span class="option-tag tag-luck" id="tag-luck" style="display:none;">LUCK</span>
                    <span class="option-tag tag-skill" id="tag-skill" style="display:none;">SKILL</span>
                    <span class="option-tag tag-currency" id="tag-category">RECOMPENSA</span>
                </div>
            </div>
        </div>

        <!-- BARRA INFERIOR DE ESTADO DE USOS (¿CUÁNTO ESTÁ Y CUÁNTOS QUEDAN?) -->
        <div class="usage-status-bar">
            <div class="usage-info-text">
                <i class="fas fa-users"></i>
                <span>USOS REGISTRADOS: <b id="usage-count">0 de 50</b></span>
            </div>
            <div class="usage-remaining-badge" id="usage-remaining">
                ¡QUEDAN 50 DISPONIBLES!
            </div>
        </div>
    </div>

    <script>
        // Generar partículas de chispas góticas
        const container = document.getElementById('spark-container');
        for (let i = 0; i < 18; i++) {
            let spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.width = (Math.random() * 4 + 2) + 'px';
            spark.style.height = spark.style.width;
            spark.style.animationDelay = (Math.random() * 4) + 's';
            container.appendChild(spark);
        }

        let promoList = [];
        let currentIndex = 0;
        let itemDb = {};

        // Cargar Base de Datos de Ítems
        fetch('../item_db.json').then(r => r.json()).then(d => { itemDb = d; }).catch(e => {});

        async function fetchPromoCodes() {
            try {
                const res = await fetch('/api/promos?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && Array.isArray(data.promos)) {
                        promoList = data.promos.filter(p => {
                            const max = Number(p.MaxUses || 0);
                            const current = Number(p.CurrentUses || 0);
                            return max === 0 || current < max;
                        });

                        const promoCard = document.getElementById('promo-card');
                        if (!promoList.length) {
                            promoCard.style.display = 'none';
                        } else {
                            promoCard.style.display = 'flex';
                            renderCurrentPromo();
                        }
                        return;
                    }
                }
            } catch (e) {
                console.error("Error fetching promos:", e);
            }
        }

        function renderCurrentPromo() {
            if (!promoList.length) return;
            const promo = promoList[currentIndex % promoList.length];
            const codeEl = document.getElementById('promo-code-display');
            const heroImgEl = document.getElementById('hero-item-img');
            const heroNameEl = document.getElementById('hero-item-name');
            const heroQtyEl = document.getElementById('hero-item-qty');
            const usageCountEl = document.getElementById('usage-count');
            const usageRemainingEl = document.getElementById('usage-remaining');

            // Tags de opciones
            const tagLevel = document.getElementById('tag-level');
            const tagExc = document.getElementById('tag-exc');
            const tagLuck = document.getElementById('tag-luck');
            const tagSkill = document.getElementById('tag-skill');
            const tagCategory = document.getElementById('tag-category');

            if (codeEl) {
                codeEl.innerText = promo.Code;
            }

            // Información de Usos
            const max = Number(promo.MaxUses || 0);
            const current = Number(promo.CurrentUses || 0);
            if (usageCountEl) {
                usageCountEl.innerText = max > 0 ? `${current} de ${max}` : `${current} (ILIMITADO)`;
            }
            if (usageRemainingEl) {
                if (max > 0) {
                    const remaining = max - current;
                    usageRemainingEl.innerText = remaining === 1 ? `¡QUEDA SOLO 1 DISPONIBLE!` : `¡QUEDAN ${remaining} DISPONIBLES!`;
                } else {
                    usageRemainingEl.innerText = `¡CÓDIGO ILIMITADO!`;
                }
            }

            // Reset Tags
            tagLevel.style.display = 'none';
            tagExc.style.display = 'none';
            tagLuck.style.display = 'none';
            tagSkill.style.display = 'none';
            tagCategory.innerText = 'RECOMPENSA';

            let details = promo.RewardDetails;
            if (typeof details === 'string') {
                try { details = JSON.parse(details); } catch(e) { details = {}; }
            }

            let typeStr = (details.reward_type || details.currency || details.type || '').toString().toLowerCase();
            let amount = details.amount || details.qty || details.count || (details.details ? details.details.count : 1) || 1;

            // 1. Monedas y Beneficios Especiales
            if (typeStr.includes('wcoin')) {
                heroNameEl.innerText = 'WCOINS';
                heroQtyEl.innerText = `${amount} MONEDAS`;
                heroImgEl.src = '../assets/icon/items/wcoin.png';
                heroImgEl.onerror = () => { heroImgEl.src = '../assets/icon/items/box.png'; };
                tagCategory.innerText = 'MONEDA VIRTUAL';
                return;
            }
            if (typeStr.includes('goblin') || typeStr.includes('gp')) {
                heroNameEl.innerText = 'GOBLIN POINTS';
                heroQtyEl.innerText = `${amount} PTS`;
                heroImgEl.src = '../assets/icon/items/wcoin.png';
                tagCategory.innerText = 'PUNTOS GOBLIN';
                return;
            }
            if (typeStr.includes('zen')) {
                heroNameEl.innerText = 'ZEN';
                heroQtyEl.innerText = `${amount.toLocaleString()} ZEN`;
                heroImgEl.src = '../assets/icon/items/box.png';
                tagCategory.innerText = 'MONEDA ORO';
                return;
            }
            if (typeStr.includes('vip')) {
                heroNameEl.innerText = 'VIP PREMIUM';
                heroQtyEl.innerText = `${amount} ${amount === 1 ? 'DÍA' : 'DÍAS'}`;
                heroImgEl.src = '../assets/icon/items/vip.png';
                tagCategory.innerText = 'MEMBRESÍA VIP';
                return;
            }

            // 2. Ítems por ItemType y ItemIndex o Nombre
            let cat = details.ItemType !== undefined ? details.ItemType : (details.details ? details.details.ItemType : null);
            let idx = details.ItemIndex !== undefined ? details.ItemIndex : (details.details ? details.details.ItemIndex : null);
            let itemName = details.itemName || details.name || (details.details ? (details.details.itemName || details.details.name) : null);

            // Opciones del Ítem (Nivel, Excelent, Luck, Skill)
            let itemLevel = details.level !== undefined ? details.level : (details.details ? details.details.level : null);
            let hasLuck = details.luck || (details.details ? details.details.luck : false);
            let hasSkill = details.skill || (details.details ? details.details.skill : false);
            let isExc = details.exc || details.isExc || (details.details ? (details.details.exc || details.details.isExc) : false);

            if (itemLevel !== null && itemLevel > 0) {
                tagLevel.innerText = `+${itemLevel}`;
                tagLevel.style.display = 'inline-block';
            }
            if (isExc) {
                tagExc.style.display = 'inline-block';
            }
            if (hasLuck) {
                tagLuck.style.display = 'inline-block';
            }
            if (hasSkill) {
                tagSkill.style.display = 'inline-block';
            }

            if (cat !== null && idx !== null) {
                let dbName = itemDb[`${cat}_${idx}`];
                if (dbName) itemName = dbName;
            }

            if (itemName && (itemName.toLowerCase() === 'item_vault' || itemName.toLowerCase() === 'ítem baúl' || itemName.toLowerCase() === 'item baul')) {
                itemName = null;
            }

            heroQtyEl.innerText = amount === 1 ? 'x1 UNIDAD' : `x${amount} UNIDADES`;

            if (cat !== null && idx !== null) {
                heroNameEl.innerText = itemName ? itemName.toUpperCase() : `ÍTEM [${cat}-${idx}]`;
                heroImgEl.src = `../assets/icon/items/${cat}/${idx}.png`;
                heroImgEl.onerror = () => { heroImgEl.src = '../assets/icon/items/box.png'; };
                tagCategory.innerText = isExc ? 'EXCELLENT ITEM' : 'ÍTEM DE JUEGO';
            } else if (itemName) {
                heroNameEl.innerText = itemName.toUpperCase();
                let clean = itemName.toLowerCase().replace(/[^a-z0-9]/g, '');
                let found = itemDb['name_' + clean];
                if (found) {
                    heroImgEl.src = `../assets/icon/items/${found.category}/${found.index}.png`;
                } else {
                    heroImgEl.src = '../assets/icon/items/box.png';
                }
                heroImgEl.onerror = () => { heroImgEl.src = '../assets/icon/items/box.png'; };
                tagCategory.innerText = 'ÍTEM ESPECIAL';
            } else {
                heroNameEl.innerText = 'ÍTEM MISTERIOSO';
                heroImgEl.src = '../assets/icon/items/box.png';
                tagCategory.innerText = 'RECOMPENSA MISTERIOSA';
            }
        }

        function rotatePromos() {
            if (promoList.length > 1) {
                currentIndex = (currentIndex + 1) % promoList.length;
                renderCurrentPromo();
            }
        }

        fetchPromoCodes();
        setInterval(fetchPromoCodes, 5000);
        setInterval(rotatePromos, 8000);
    </script>
</body>
</html>
