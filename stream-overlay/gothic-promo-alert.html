<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU ONLINE - Promo Alert Widget</title>
    <!-- GOOGLE FONTS PRO -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold-primary: #ffd700;
            --gold-accent: #e6b800;
            --gold-dark: #997a00;
            --crimson-glow: #ff1a40;
            --crimson-dark: #800014;
            --bg-glass: rgba(10, 8, 12, 0.94);
            --exc-green: #00ff77;
            --anc-blue: #00e1ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* CARD PRINCIPAL ULTRA-PRO SLIM (SIN CLIP-PATH QUE CORTABA EL TEXTO) */
        .promo-widget {
            position: relative;
            width: 720px;
            background: linear-gradient(135deg, rgba(16, 12, 16, 0.96) 0%, rgba(6, 4, 8, 0.98) 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            padding: 16px 24px;
            display: none; /* Se activa dinámicamente */
            flex-direction: column;
            gap: 12px;
            box-shadow: 
                0 0 35px rgba(0, 0, 0, 0.95),
                0 0 25px rgba(255, 215, 0, 0.2),
                inset 0 0 25px rgba(128, 0, 20, 0.5);
            backdrop-filter: blur(16px);
            animation: cardGlowPulse 4s infinite ease-in-out;
        }

        @keyframes cardGlowPulse {
            0%, 100% {
                border-color: rgba(255, 215, 0, 0.85);
                box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), 0 0 20px rgba(255, 215, 0, 0.25), inset 0 0 25px rgba(128, 0, 20, 0.5);
            }
            50% {
                border-color: rgba(255, 40, 60, 0.95);
                box-shadow: 0 0 50px rgba(255, 26, 64, 0.4), 0 0 30px rgba(255, 215, 0, 0.4), inset 0 0 35px rgba(255, 215, 0, 0.3);
            }
        }

        /* LÍNEA SUPERIOR DE ADORNO GÓTICO */
        .widget-header-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .header-glow-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--gold-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 26, 64, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: textBlink 1.5s infinite ease-in-out alternate;
        }

        @keyframes textBlink {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(0.99); }
        }

        .gift-sparkle-icon {
            font-size: 1.1rem;
            color: var(--gold-primary);
            filter: drop-shadow(0 0 8px var(--crimson-glow));
            animation: iconSpin 3s infinite ease-in-out;
        }

        @keyframes iconSpin {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(10deg); }
        }

        /* ESTRUCTURA DE CONTENIDO INTERNO: IZQUIERDA MOSTRADOR ÍTEM / DERECHA DETALLES */
        .widget-content-body {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* MOSTRADOR HOLOGRÁFICO DEL ÍTEM (HERO ICON) */
        .item-showcase-box {
            position: relative;
            width: 115px;
            height: 115px;
            min-width: 115px;
            background: radial-gradient(circle, rgba(120, 0, 20, 0.7) 0%, rgba(15, 10, 15, 0.95) 80%);
            border: 2px solid var(--gold-primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.35), inset 0 0 20px rgba(255, 26, 64, 0.5);
            overflow: visible;
        }

        /* ANILLO DE LUZ GIRATORIO */
        .item-showcase-box::before {
            content: "";
            position: absolute;
            width: 130px; height: 130px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 215, 0, 0.6);
            animation: ringRotate 8s linear infinite;
        }

        @keyframes ringRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* IMAGEN 3D DEL ÍTEM */
        .item-real-png {
            max-width: 90px;
            max-height: 90px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.9));
            animation: itemFloat 3s infinite ease-in-out;
            z-index: 5;
        }

        @keyframes itemFloat {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.8)); }
            50% { transform: translateY(-5px) scale(1.08); filter: drop-shadow(0 0 24px rgba(255, 26, 64, 1)); }
        }

        /* COLUMNA DERECHA DE DETALLES Y CÓDIGO */
        .item-info-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        /* CAJA DEL CÓDIGO PROMOCIONAL ESTILO BADGE DE LUJO */
        .code-badge-box {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(140, 0, 20, 0.9) 0%, rgba(30, 5, 10, 0.95) 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 10px;
            padding: 6px 20px;
            box-shadow: 0 0 20px rgba(255, 26, 64, 0.4), inset 0 0 12px rgba(255, 215, 0, 0.3);
            width: fit-content;
        }

        .code-title-text {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.85rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 14px var(--gold-primary), 0 0 25px var(--crimson-glow);
        }

        /* FILA DEL NOMBRE DEL ÍTEM Y CANTIDAD */
        .item-name-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .item-display-name {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--gold-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .item-qty-badge {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(255, 26, 64, 0.9) 0%, rgba(120, 0, 20, 0.95) 100%);
            border: 1px solid var(--gold-primary);
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 26, 64, 0.5);
        }

        /* ETIQUETAS DE ATRIBUTOS (+15, EXCELLENT, LUCK, SKILL) */
        .item-tags-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .attr-tag {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 6px;
            letter-spacing: 0.8px;
        }

        .tag-lvl {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000000;
            font-weight: 900;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .tag-exc {
            background: rgba(0, 30, 10, 0.95);
            color: var(--exc-green);
            border: 1px solid var(--exc-green);
            box-shadow: 0 0 8px rgba(0, 255, 119, 0.4);
        }

        .tag-luck {
            background: rgba(0, 25, 50, 0.95);
            color: var(--anc-blue);
            border: 1px solid var(--anc-blue);
            box-shadow: 0 0 8px rgba(0, 225, 255, 0.4);
        }

        .tag-type {
            background: rgba(40, 15, 25, 0.9);
            color: #ffb3c1;
            border: 1px solid rgba(255, 179, 193, 0.4);
        }

        /* BARRA INFERIOR DE USOS Y DISPONIBILIDAD */
        .widget-footer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: rgba(8, 6, 10, 0.8);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 8px;
            margin-top: 2px;
        }

        .usage-counter-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .usage-counter-text i {
            color: var(--gold-primary);
        }

        .usage-counter-text b {
            color: var(--gold-primary);
            font-size: 1.05rem;
        }

        .remaining-pill {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(160, 0, 30, 0.95) 0%, rgba(60, 0, 10, 0.95) 100%);
            border: 1px solid var(--crimson-glow);
            padding: 3px 14px;
            border-radius: 14px;
            letter-spacing: 0.8px;
            box-shadow: 0 0 10px rgba(255, 26, 64, 0.5);
        }
    </style>
</head>
<body>

    <div class="promo-widget" id="promo-widget">
        <!-- HEADER LINE -->
        <div class="widget-header-line">
            <i class="fas fa-gift gift-sparkle-icon"></i>
            <span class="header-glow-text">USA ESTE CÓDIGO EN TU LAUNCHER PARA QUE OBTENGAS UN REGALO</span>
            <i class="fas fa-gift gift-sparkle-icon"></i>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="widget-content-body">
            <!-- MOSTRADOR 3D HERO ICON -->
            <div class="item-showcase-box">
                <img src="../assets/icon/items/box.png" class="item-real-png" id="item-real-png" alt="Item Preview">
            </div>

            <!-- DETALLES Y CÓDIGO -->
            <div class="item-info-column">
                <!-- CAJA CÓDIGO -->
                <div class="code-badge-box">
                    <span class="code-title-text" id="code-title-text">---</span>
                </div>

                <!-- NOMBRE Y CANTIDAD -->
                <div class="item-name-row">
                    <span class="item-display-name" id="item-display-name">ÍTEM DE REGALO</span>
                    <span class="item-qty-badge" id="item-qty-badge">x1 UNIDAD</span>
                </div>

                <!-- TAGS ATRIBUTOS -->
                <div class="item-tags-row">
                    <span class="attr-tag tag-lvl" id="tag-lvl" style="display:none;">+15</span>
                    <span class="attr-tag tag-exc" id="tag-exc" style="display:none;">EXCELLENT</span>
                    <span class="attr-tag tag-luck" id="tag-luck" style="display:none;">LUCK</span>
                    <span class="attr-tag tag-type" id="tag-type">RECOMPENSA EXCLUSIVA</span>
                </div>
            </div>
        </div>

        <!-- FOOTER BAR -->
        <div class="widget-footer-bar">
            <div class="usage-counter-text">
                <i class="fas fa-users"></i>
                <span>USOS: <b id="usage-val">0 DE 50</b></span>
            </div>
            <div class="remaining-pill" id="remaining-pill">
                ¡QUEDAN 50 DISPONIBLES!
            </div>
        </div>
    </div>

    <script>
        let promoList = [];
        let currentIndex = 0;
        let itemDb = {};

        // Cargar Base de Datos de Ítems
        fetch('../item_db.json').then(r => r.json()).then(d => { itemDb = d; }).catch(e => {});

        async function fetchPromoCodes() {
            try {
                const res = await fetch('/api/promos?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && Array.isArray(data.promos)) {
                        promoList = data.promos.filter(p => {
                            const max = Number(p.MaxUses || 0);
                            const current = Number(p.CurrentUses || 0);
                            return max === 0 || current < max;
                        });

                        const widget = document.getElementById('promo-widget');
                        if (!promoList.length) {
                            widget.style.display = 'none';
                        } else {
                            widget.style.display = 'flex';
                            renderCurrentPromo();
                        }
                        return;
                    }
                }
            } catch (e) {
                console.error("Error fetching promos:", e);
            }
        }

        function renderCurrentPromo() {
            if (!promoList.length) return;
            const promo = promoList[currentIndex % promoList.length];

            const codeTextEl = document.getElementById('code-title-text');
            const itemImgEl = document.getElementById('item-real-png');
            const itemNameEl = document.getElementById('item-display-name');
            const itemQtyEl = document.getElementById('item-qty-badge');
            const usageValEl = document.getElementById('usage-val');
            const remainingPillEl = document.getElementById('remaining-pill');

            const tagLvl = document.getElementById('tag-lvl');
            const tagExc = document.getElementById('tag-exc');
            const tagLuck = document.getElementById('tag-luck');
            const tagType = document.getElementById('tag-type');

            if (codeTextEl) {
                codeTextEl.innerText = promo.Code;
            }

            // Usos
            const max = Number(promo.MaxUses || 0);
            const current = Number(promo.CurrentUses || 0);
            if (usageValEl) {
                usageValEl.innerText = max > 0 ? `${current} DE ${max}` : `${current} (ILIMITADO)`;
            }
            if (remainingPillEl) {
                if (max > 0) {
                    const remaining = max - current;
                    remainingPillEl.innerText = remaining === 1 ? `¡QUEDA 1 DISPONIBLE!` : `¡QUEDAN ${remaining} DISPONIBLES!`;
                } else {
                    remainingPillEl.innerText = `¡USO ILIMITADO!`;
                }
            }

            // Reset Tags
            tagLvl.style.display = 'none';
            tagExc.style.display = 'none';
            tagLuck.style.display = 'none';
            tagType.innerText = 'RECOMPENSA EXCLUSIVA';

            let details = promo.RewardDetails;
            if (typeof details === 'string') {
                try { details = JSON.parse(details); } catch(e) { details = {}; }
            }

            let typeStr = (details.reward_type || details.currency || details.type || '').toString().toLowerCase();
            let amount = details.amount || details.qty || details.count || (details.details ? details.details.count : 1) || 1;

            // 1. Monedas y Beneficios
            if (typeStr.includes('wcoin')) {
                itemNameEl.innerText = 'WCOINS';
                itemQtyEl.innerText = `${amount} MONEDAS`;
                itemImgEl.src = '../assets/icon/items/wcoin.png';
                itemImgEl.onerror = () => { itemImgEl.src = '../assets/icon/items/box.png'; };
                tagType.innerText = 'MONEDA VIRTUAL';
                return;
            }
            if (typeStr.includes('goblin') || typeStr.includes('gp')) {
                itemNameEl.innerText = 'GOBLIN POINTS';
                itemQtyEl.innerText = `${amount} PTS`;
                itemImgEl.src = '../assets/icon/items/wcoin.png';
                tagType.innerText = 'PUNTOS GOBLIN';
                return;
            }
            if (typeStr.includes('zen')) {
                itemNameEl.innerText = 'ZEN';
                itemQtyEl.innerText = `${amount.toLocaleString()} ZEN`;
                itemImgEl.src = '../assets/icon/items/box.png';
                tagType.innerText = 'MONEDA ORO';
                return;
            }
            if (typeStr.includes('vip')) {
                itemNameEl.innerText = 'VIP PREMIUM';
                itemQtyEl.innerText = `${amount} ${amount === 1 ? 'DÍA' : 'DÍAS'}`;
                itemImgEl.src = '../assets/icon/items/vip.png';
                tagType.innerText = 'MEMBRESÍA VIP';
                return;
            }

            // 2. Ítems por ItemType e ItemIndex o Nombre
            let cat = details.ItemType !== undefined ? details.ItemType : (details.details ? details.details.ItemType : null);
            let idx = details.ItemIndex !== undefined ? details.ItemIndex : (details.details ? details.details.ItemIndex : null);
            let itemName = details.itemName || details.name || (details.details ? (details.details.itemName || details.details.name) : null);

            let itemLevel = details.level !== undefined ? details.level : (details.details ? details.details.level : null);
            let hasLuck = details.luck || (details.details ? details.details.luck : false);
            let isExc = details.exc || details.isExc || (details.details ? (details.details.exc || details.details.isExc) : false);

            if (itemLevel !== null && itemLevel > 0) {
                tagLvl.innerText = `+${itemLevel}`;
                tagLvl.style.display = 'inline-block';
            }
            if (isExc) {
                tagExc.style.display = 'inline-block';
            }
            if (hasLuck) {
                tagLuck.style.display = 'inline-block';
            }

            if (cat !== null && idx !== null) {
                let dbName = itemDb[`${cat}_${idx}`];
                if (dbName) itemName = dbName;
            }

            if (itemName && (itemName.toLowerCase() === 'item_vault' || itemName.toLowerCase() === 'ítem baúl' || itemName.toLowerCase() === 'item baul')) {
                itemName = null;
            }

            itemQtyEl.innerText = amount === 1 ? 'x1 UNIDAD' : `x${amount} UNIDADES`;

            if (cat !== null && idx !== null) {
                itemNameEl.innerText = itemName ? itemName.toUpperCase() : `ÍTEM [${cat}-${idx}]`;
                itemImgEl.src = `../assets/icon/items/${cat}/${idx}.png`;
                itemImgEl.onerror = () => { itemImgEl.src = '../assets/icon/items/box.png'; };
                tagType.innerText = isExc ? 'EXCELLENT ITEM' : 'ÍTEM DE JUEGO';
            } else if (itemName) {
                itemNameEl.innerText = itemName.toUpperCase();
                let clean = itemName.toLowerCase().replace(/[^a-z0-9]/g, '');
                let found = itemDb['name_' + clean];
                if (found) {
                    itemImgEl.src = `../assets/icon/items/${found.category}/${found.index}.png`;
                } else {
                    itemImgEl.src = '../assets/icon/items/box.png';
                }
                itemImgEl.onerror = () => { itemImgEl.src = '../assets/icon/items/box.png'; };
                tagType.innerText = 'ÍTEM ESPECIAL';
            } else {
                itemNameEl.innerText = 'ÍTEM REGALO';
                itemImgEl.src = '../assets/icon/items/box.png';
                tagType.innerText = 'RECOMPENSA MISTERIOSA';
            }
        }

        function rotatePromos() {
            if (promoList.length > 1) {
                currentIndex = (currentIndex + 1) % promoList.length;
                renderCurrentPromo();
            }
        }

        fetchPromoCodes();
        setInterval(fetchPromoCodes, 5000);
        setInterval(rotatePromos, 8000);
    </script>
</body>
</html>
