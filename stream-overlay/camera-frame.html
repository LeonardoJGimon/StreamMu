<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Camera Frame Legendario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        :root {
            --crimson: #9d0a0e;
            --crimson-glow: rgba(157, 10, 14, 0.8);
            --gold: #c0a375;
            --gold-bright: #f3e5ab;
            --stone: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .master-frame {
            position: relative;
            width: 90%;
            height: 90%;
            border: 4px solid #111;
            box-shadow: 
                0 0 40px rgba(0,0,0,1),
                inset 0 0 30px rgba(0,0,0,1);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* TEXTURA DE PIEDRA TALLADA */
        .frame-edge {
            position: absolute;
            inset: -8px;
            border: 12px solid transparent;
            border-image: linear-gradient(to bottom, #333, #111, #333) 1;
            z-index: 1;
            pointer-events: none;
        }

        /* ENERGÍA CARMESÍ FLUYENDO */
        .energy-glow {
            position: absolute;
            inset: -4px;
            border: 2px solid var(--crimson);
            box-shadow: 0 0 15px var(--crimson-glow), inset 0 0 15px var(--crimson-glow);
            animation: breathe 4s infinite ease-in-out;
            z-index: 2;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; filter: blur(2px); }
            50% { opacity: 0.8; filter: blur(4px); }
        }

        /* ESQUINAS LEGENDARIAS */
        .corner-ornament {
            position: absolute;
            width: 80px;
            height: 80px;
            background: url('../assets/images/newimg/gold-border-ae.png') no-repeat;
            background-size: contain;
            z-index: 10;
            filter: drop-shadow(0 0 10px #000);
        }

        .tl { top: -20px; left: -20px; transform: rotate(0deg); }
        .tr { top: -20px; right: -20px; transform: rotate(90deg); }
        .bl { bottom: -20px; left: -20px; transform: rotate(-90deg); }
        .br { bottom: -20px; right: -20px; transform: rotate(180deg); }

        /* RUNAS EN LOS LATERALES */
        .runes {
            position: absolute;
            font-family: serif;
            color: var(--crimson);
            font-size: 1.2rem;
            letter-spacing: 10px;
            opacity: 0.4;
            z-index: 5;
            animation: runeGlow 5s infinite;
        }
        .runes-top { top: 5px; left: 50%; transform: translateX(-50%); }
        .runes-bottom { bottom: 5px; left: 50%; transform: translateX(-50%); }

        @keyframes runeGlow {
            0%, 100% { opacity: 0.2; text-shadow: none; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--crimson-bright); }
        }

        /* PLACA DE NOMBRE ESTILO DIABLO */
        .name-plaque {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 60px;
            background: #000;
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
        }

        .name-plaque::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(192, 163, 117, 0.3);
            clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
        }

        .streamer-name {
            font-family: 'Exocet', serif;
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 0 0 15px var(--gold);
            text-transform: uppercase;
        }

        /* ICONOS DE ESTADO */
        .status-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--crimson);
            color: #fff;
            font-family: 'Exocet', serif;
            font-size: 0.7rem;
            padding: 3px 20px;
            letter-spacing: 3px;
            border: 1px solid var(--gold);
            z-index: 25;
            box-shadow: 0 0 15px var(--crimson);
        }

    </style>
</head>
<body>

    <div class="master-frame">
        <div class="frame-edge"></div>
        <div class="energy-glow"></div>
        
        <!-- Esquinas Ornamentadas -->
        <div class="corner-ornament tl"></div>
        <div class="corner-ornament tr"></div>
        <div class="corner-ornament bl"></div>
        <div class="corner-ornament br"></div>

        <!-- Runas Místicas -->
        <div class="runes runes-top">ᛗᚢ ᚾᛖᚢᛏᚱᛟ</div>
        <div class="runes runes-bottom">ᛗᚢ ᚾᛖᚢᛏᚱᛟ</div>

        <div class="status-badge">LIVE</div>

        <!-- Placa de Nombre -->
        <div class="name-plaque">
            <div class="streamer-name" id="name-display">MU NEUTRO</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('name')) {
            document.getElementById('name-display').innerText = params.get('name').toUpperCase();
        }
    </script>
</body>
</html>
