<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Camera Frame</title>
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        :root {
            --crimson: #9d0a0e;
            --gold: #c0a375;
            --frame-glow: rgba(157, 10, 14, 0.4);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* EL MARCO */
        .camera-container {
            position: relative;
            width: 80vw; /* Se ajustará en OBS al tamaño de la cámara */
            aspect-ratio: 16/9;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* ESQUINAS GÓTICAS */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid var(--crimson);
            z-index: 5;
            filter: drop-shadow(0 0 5px var(--crimson));
        }

        .top-left { top: -6px; left: -6px; border-right: none; border-bottom: none; }
        .top-right { top: -6px; right: -6px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -6px; left: -6px; border-right: none; border-top: none; }
        .bottom-right { bottom: -6px; right: -6px; border-left: none; border-top: none; }

        /* DECORACIÓN DORADA */
        .camera-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border: 1px solid var(--gold);
            opacity: 0.3;
            pointer-events: none;
        }

        /* ETIQUETA DE NOMBRE / INFO */
        .info-tag {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
            padding: 5px 40px;
            border-top: 1px solid var(--crimson);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
            justify-content: center;
        }

        .info-label {
            font-family: 'Exocet', serif;
            font-size: 0.8rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .info-value {
            font-family: 'Alegreya', serif;
            font-size: 1rem;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 10px var(--crimson);
        }

        /* EFECTO DE PULSO LIGERO */
        @keyframes pulseFrame {
            0%, 100% { border-color: rgba(157, 10, 14, 0.4); }
            50% { border-color: rgba(157, 10, 14, 0.8); }
        }

        .camera-container {
            animation: pulseFrame 3s infinite ease-in-out;
        }

    </style>
</head>
<body>

    <div class="camera-container">
        <!-- Esquinas -->
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <!-- Etiqueta inferior -->
        <div class="info-tag">
            <span class="info-label">LIVE</span>
            <span class="info-value" id="streamer-name">MU NEUTRO</span>
        </div>
    </div>

    <script>
        // Permitir cambiar el nombre vía URL (?name=Leon)
        const params = new URLSearchParams(window.location.search);
        if (params.has('name')) {
            document.getElementById('streamer-name').innerText = params.get('name').toUpperCase();
        }
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
