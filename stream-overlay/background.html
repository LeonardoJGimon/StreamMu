<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mu Neutro - Master Background</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #0a0505 url('https://i.imgur.com/HQroNDd.png') no-repeat center center;
            background-size: cover;
            overflow: hidden;
        }

        /* CAPA DE OSCURIDAD */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 1;
        }

        /* NIEBLA ROJA DINÁMICA */
        .fog {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(157, 10, 14, 0.3) 0%, transparent 70%);
            animation: fogMove 10s infinite alternate ease-in-out;
            z-index: 2;
            opacity: 0.6;
        }

        @keyframes fogMove {
            from { transform: scale(1) translate(-2%, -2%); opacity: 0.4; }
            to { transform: scale(1.1) translate(2%, 2%); opacity: 0.7; }
        }

        /* CENIZAS / EMBER PARTICLES */
        .particle {
            position: absolute;
            background: rgba(255, 60, 0, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            filter: blur(1px);
            box-shadow: 0 0 5px rgba(255, 60, 0, 0.8);
        }

    </style>
</head>
<body>
    <div class="fog"></div>

    <script>
        function createParticle() {
            const p = document.createElement('div');
            p.className = 'particle';
            
            const size = Math.random() * 3 + 1;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = '110vh';
            
            const duration = 6000 + Math.random() * 8000;
            const xOffset = (Math.random() - 0.5) * 300;
            
            p.animate([
                { transform: `translateY(0) translateX(0)`, opacity: 0 },
                { transform: `translateY(-50vh) translateX(${xOffset/2}px)`, opacity: 0.8, offset: 0.3 },
                { transform: `translateY(-120vh) translateX(${xOffset}px)`, opacity: 0 }
            ], {
                duration: duration,
                easing: 'linear'
            });
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), duration);
        }

        // Generar partículas constantemente
        setInterval(createParticle, 150);
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
