<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Chat Frame Overlay</title>
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        
        :root {
            --crimson: #9d0a0e;
            --gold: #c0a375;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .frame-container {
            position: relative;
            width: 98%;
            height: 98%;
            border: 2px solid rgba(157, 10, 14, 0.5);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            pointer-events: none; /* Permite hacer click a través del marco */
        }

        /* TÍTULO SUPERIOR */
        .header {
            background: linear-gradient(180deg, var(--crimson) 0%, #1a0505 100%);
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 20;
        }

        .header-title {
            font-family: 'Exocet', serif;
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(192, 163, 117, 0.6);
            margin: 0;
        }

        /* ESQUINAS ORNAMENTALES */
        .frame-container::before {
            content: ''; position: absolute; top: -4px; left: -4px; width: 25px; height: 25px;
            border-top: 4px solid var(--crimson); border-left: 4px solid var(--crimson); z-index: 30;
        }
        .frame-container::after {
            content: ''; position: absolute; bottom: -4px; right: -4px; width: 25px; height: 25px;
            border-bottom: 4px solid var(--crimson); border-right: 4px solid var(--crimson); z-index: 30;
        }

        /* BRILLO EN LAS ESQUINAS */
        .corner-glow {
            position: absolute;
            width: 10px; height: 10px;
            background: var(--crimson);
            filter: blur(10px);
            z-index: 25;
        }
        .cg-tl { top: 0; left: 0; }
        .cg-tr { top: 0; right: 0; }
        .cg-bl { bottom: 0; left: 0; }
        .cg-br { bottom: 0; right: 0; }

    </style>
</head>
<body>

    <div class="frame-container">
        <div class="corner-glow cg-tl"></div>
        <div class="corner-glow cg-tr"></div>
        <div class="corner-glow cg-bl"></div>
        <div class="corner-glow cg-br"></div>

        <header class="header">
            <h1 class="header-title">CHAT EN VIVO</h1>
        </header>
        <iframe 
            src="https://beta.socialstream.ninja/dock.html?session=AAV8BwNna5&chatonly&hidemenu&darkmode&noavatar&firstnames&remote&scale=0.35&lang=es-ES&voice=Pablo&badkarma&rate&pitch&volume&speech&bubble&css=https://stream-mu-sand.vercel.app/stream-overlay/gothic-chat.css" 
            style="position: absolute; top: 50px; left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - 50px); border: none; z-index: 10;"
            title="Social Stream Chat">
        </iframe>
    </div>

    <script src="auto-refresh.js"></script>
</body>
</html>
