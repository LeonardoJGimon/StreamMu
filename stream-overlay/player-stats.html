<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Player Stats Widget</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Exocet'; src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); font-weight: 500; }
        @font-face { font-family: 'Alegreya'; src: url('../assets/images/font/AlegreyaSans-Regular.otf') format('opentype'); font-weight: 400; }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
            --row-bg: rgba(10, 8, 5, 0.9);
            --glass: rgba(0, 0, 0, 0.7);
        }

        body {
            margin: 0; padding: 20px; background: transparent;
            font-family: 'Alegreya', serif; color: #ccc;
            overflow: hidden; box-sizing: border-box;
        }

        .player-card {
            position: relative;
            background: var(--glass);
            border: 2px solid var(--crimson);
            padding: 15px 25px;
            width: fit-content;
            min-width: 350px;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,1), inset 0 0 15px rgba(157, 10, 14, 0.3);
            backdrop-filter: blur(10px);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .player-card::before, .player-card::after {
            content: ''; position: absolute; width: 30px; height: 30px;
            z-index: 5;
        }
        .player-card::before { 
            top: -5px; left: -5px; 
            border-top: 3px solid var(--crimson-bright); border-left: 3px solid var(--crimson-bright); 
        }
        .player-card::after { 
            bottom: -5px; right: -5px; 
            border-bottom: 3px solid var(--crimson-bright); border-right: 3px solid var(--crimson-bright); 
        }

        .class-avatar {
            width: 80px; height: 80px;
            position: relative;
            background: radial-gradient(circle, rgba(157, 10, 14, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(192, 163, 117, 0.2);
        }
        .class-img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(0 0 8px var(--crimson)); }

        .player-info { display: flex; flex-direction: column; gap: 2px; }
        .player-name {
            font-family: 'Exocet', serif;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 15px var(--crimson);
            margin: 0;
            line-height: 1.1;
        }

        .stats-row { display: flex; gap: 20px; margin-top: 5px; }
        .stat-item { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; color: var(--gold); }
        .stat-item i { color: var(--crimson-bright); font-size: 0.9rem; }
        .stat-value { font-family: 'Exocet', serif; color: #fff; font-size: 1.2rem; }

        .guild-badge {
            margin-left: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-left: 20px;
            border-left: 1px solid rgba(192, 163, 117, 0.2);
            min-width: 80px;
        }
        .guild-logo { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .guild-name { font-family: 'Exocet', serif; font-size: 0.7rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; text-align: center; }

        .loading-overlay {
            position: absolute; inset: 0; background: var(--glass);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; font-family: 'Exocet', serif; font-size: 1rem; color: var(--gold);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">CARGANDO ALMA...</div>

    <div id="card" class="player-card hidden">
        <div class="class-avatar">
            <img id="class-img" src="../assets/images/characters/DW.png" class="class-img">
        </div>
        
        <div class="player-info">
            <h1 id="p-name" class="player-name">-</h1>
            <div class="stats-row">
                <div class="stat-item">
                    <i class="fas fa-bolt"></i>
                    <span>LVL</span>
                    <span id="p-level" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-redo"></i>
                    <span>RES</span>
                    <span id="p-resets" class="stat-value">0</span>
                </div>
            </div>
        </div>

        <div id="guild-section" class="guild-badge">
            <img id="g-logo" src="../assets/images/logo/logosimple.png" class="guild-logo">
            <span id="g-name" class="guild-name">-</span>
        </div>
    </div>

    <script>
        const classMap = {
            0: { folder: 'SM', icon: 'dw-icon.png' },
            1: { folder: 'SM', icon: 'dw-icon.png' },
            16: { folder: 'DK', icon: 'dk-icon.png' },
            32: { folder: 'FAIRY ELF', icon: 'elf-icon.png' },
            48: { folder: 'MG', icon: 'mg icon.png' },
            64: { folder: 'DL', icon: 'dl icon.png' },
            80: { folder: 'SUMONNER', icon: 'sm icon.png' },
            96: { folder: 'RAGE', icon: 'rf icon.png' }
        };

        function guildMarkHexToDataUrl(hex, size = 60) {
            const raw = (hex || '').toString().trim();
            if (!raw || !/^[0-9a-fA-F]+$/.test(raw)) return '';
            try {
                const bytes = new Uint8Array(raw.length / 2);
                for (let i = 0; i < raw.length; i += 2) bytes[i / 2] = parseInt(raw.slice(i, i + 2), 16);
                const nibbles = [];
                for (const b of bytes) { nibbles.push((b >> 4) & 0xF); nibbles.push(b & 0xF); }
                if (nibbles.length < 64) return '';
                const palette = [[0,0,0,0],[0,0,0,255],[255,255,255,255],[255,0,0,255],[0,255,0,255],[0,0,255,255],[255,255,0,255],[255,0,255,255],[0,255,255,255],[160,160,160,255],[128,64,0,255],[255,128,0,255],[0,128,128,255],[128,0,128,255],[0,128,0,255],[128,0,0,255]];
                const canvas = document.createElement('canvas');
                canvas.width = 8; canvas.height = 8;
                const ctx = canvas.getContext('2d');
                const img = ctx.createImageData(8, 8);
                for (let i = 0; i < 64; i++) {
                    const [r, g, b, a] = palette[nibbles[i] & 0xF] || palette[0];
                    const off = i * 4;
                    img.data[off] = r; img.data[off + 1] = g; img.data[off + 2] = b; img.data[off + 3] = a;
                }
                ctx.putImageData(img, 0, 0);
                const out = document.createElement('canvas');
                out.width = size; out.height = size;
                const octx = out.getContext('2d');
                octx.imageSmoothingEnabled = false;
                octx.drawImage(canvas, 0, 0, size, size);
                return out.toDataURL('image/png');
            } catch (e) { return ''; }
        }

        async function fetchPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || 'TheGiwoN'; // Fallback to GiwoN for testing

            try {
                const res = await fetch(`/api/player?name=${name}`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();
                
                updateUI(data);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('card').classList.remove('hidden');
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerText = "ERROR: PERSONAJE NO ENCONTRADO";
            }
        }

        function updateUI(p) {
            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-level').innerText = p.level;
            document.getElementById('p-resets').innerText = p.resets;
            
            const info = classMap[p.classId] || classMap[0];
            document.getElementById('class-img').src = `../assets/images/chars/${info.folder}/${info.icon}`;

            document.getElementById('g-name').innerText = p.guildName;
            const logo = guildMarkHexToDataUrl(p.guildMark, 60);
            if (logo) {
                document.getElementById('g-logo').src = logo;
            } else {
                document.getElementById('g-logo').src = '../assets/images/logo/logosimple.png';
            }
        }

        fetchPlayer();
        setInterval(fetchPlayer, 15000);
    </script>
</body>
</html>
