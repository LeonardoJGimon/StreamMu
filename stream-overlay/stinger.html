<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU OLIMPO - Stinger Transition</title>
    <style>
        @font-face {
            font-family: 'Exocet';
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype');
            font-weight: 500;
        }

        :root {
            --crimson: #9d0a0e;
            --crimson-bright: #ff2e2e;
            --gold: #c0a375;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0) !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
        }

        .door {
            position: absolute;
            top: 0;
            width: 50.1vw;
            height: 100vh;
            background: #0a0505 url('../assets/images/newimg/stone-bg-2600.jpg');
            background-size: cover;
            border: 2px solid rgba(157, 10, 14, 0.5);
            box-sizing: border-box;
            z-index: 10;
        }

        .door-left {
            left: 0;
            transform: translateX(-105%);
            border-right: 5px solid var(--gold);
            box-shadow: 30px 0 150px rgba(0,0,0,1);
        }

        .door-right {
            right: 0;
            transform: translateX(105%);
            border-left: 5px solid var(--gold);
            box-shadow: -30px 0 150px rgba(0,0,0,1);
        }

        .stinger-logo {
            position: absolute;
            width: 500px;
            z-index: 20;
            opacity: 0;
            transform: scale(3);
            filter: drop-shadow(0 0 50px var(--crimson));
            pointer-events: none;
        }

        .glow-impact {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--crimson) 0%, transparent 70%);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
        }

        /* ANIMACIÓN DE 6 SEGUNDOS */
        body.animating .door-left { animation: slideDoorLeft 6s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        body.animating .door-right { animation: slideDoorRight 6s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        body.animating .stinger-logo { animation: logoImpact 6s forwards; }
        body.animating .glow-impact { animation: glowFlash 2s forwards; animation-delay: 1.2s; }

        @keyframes slideDoorLeft {
            0% { transform: translateX(-105%); }
            25% { transform: translateX(0); } /* Cierra en 1.5s */
            75% { transform: translateX(0); } /* Se queda cerrado hasta el 4.5s */
            100% { transform: translateX(-105%); } /* Abre */
        }

        @keyframes slideDoorRight {
            0% { transform: translateX(105%); }
            25% { transform: translateX(0); }
            75% { transform: translateX(0); }
            100% { transform: translateX(105%); }
        }

        @keyframes logoImpact {
            0% { opacity: 0; transform: scale(3); }
            25% { opacity: 1; transform: scale(1); }
            75% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 100px var(--crimson-bright)); }
            95% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 0; }
        }

        @keyframes glowFlash {
            0% { opacity: 0; transform: scale(0.5); }
            30% { opacity: 0.6; transform: scale(1.3); }
            100% { opacity: 0; transform: scale(2); }
        }
    </style>
</head>
<body>
    <div class="door door-left"></div>
    <div class="glow-impact"></div>
    <img src="../assets/images/logo/logosimple.png" class="stinger-logo" id="logo">
    <div class="door door-right"></div>

    <script>
        let isAnimating = false;
        function playStinger() {
            if (isAnimating) return;
            isAnimating = true;
            document.body.classList.add('animating');
            setTimeout(() => {
                document.body.classList.remove('animating');
                isAnimating = false;
            }, 7000);
        }
        window.addEventListener('message', (event) => {
            if (event.data === 'START_STINGER') { playStinger(); }
        });
        window.onload = () => {
            if (window.opener === null) { setTimeout(playStinger, 1000); }
        };
    </script>
    <script src="auto-refresh.js"></script>
</body>
</html>
