<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MU NEUTRO - Animated Banner</title>
    <style>
        @font-face { 
            font-family: 'ExocetReal'; 
            src: url('../assets/images/font/ExocetImmortal-Medium.otf') format('opentype'); 
        }

        :root {
            --gold-light: #f0d7a9;
            --gold-dark: #c0a375;
            --fire: #ff4500;
            --fire-bright: #ff8c00;
            --bg-dark: #050505;
        }

        body {
            margin: 0; padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'ExocetReal', serif;
        }

        .banner-container {
            width: 800px;
            height: 200px;
            background: radial-gradient(circle at center, #1a0505 0%, var(--bg-dark) 100%);
            border: 1px solid rgba(192, 163, 117, 0.2);
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 50px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
        }

        .spark {
            position: absolute;
            background: var(--fire-bright);
            border-radius: 50%;
            opacity: 0.6;
            filter: blur(1px);
            animation: floatUp 4s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(220px) translateX(0) scale(1); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-50px) translateX(20px) scale(0.5); opacity: 0; }
        }

        .fire-slash {
            position: absolute;
            width: 300px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--fire), var(--fire-bright), transparent);
            transform: rotate(-35deg);
            opacity: 0;
            z-index: 5;
        }

        .slash-1 { top: 20%; left: -10%; animation: slashMove 3s infinite 1s; }
        .slash-2 { top: 60%; left: 40%; animation: slashMove 4s infinite 2.5s; }

        @keyframes slashMove {
            0% { transform: rotate(-35deg) translateX(-500px); opacity: 0; }
            10% { opacity: 1; }
            20% { transform: rotate(-35deg) translateX(800px); opacity: 0; }
            100% { transform: rotate(-35deg) translateX(800px); opacity: 0; }
        }

        .logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .main-logo {
            font-size: 4rem;
            background: linear-gradient(to bottom, 
                var(--gold-light) 0%, 
                var(--gold-dark) 45%, 
                #5d4411 50%, 
                var(--gold-dark) 55%, 
                var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
            letter-spacing: 5px;
            animation: logoBreath 4s infinite ease-in-out;
        }

        .main-logo::after {
            content: 'MU NEUTRO';
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            background: linear-gradient(115deg, 
                transparent 0%, transparent 40%, 
                rgba(255,255,255,0.8) 50%, 
                transparent 60%, transparent 100%);
            -webkit-background-clip: text;
            background-size: 200% 100%;
            animation: glint 5s infinite linear;
        }

        @keyframes glint {
            0% { background-position: -150% 0; }
            25% { background-position: 150% 0; }
            100% { background-position: 150% 0; }
        }

        @keyframes logoBreath {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.03); filter: brightness(1.2); }
        }

        .stats-panel {
            margin-left: auto;
            text-align: right;
            z-index: 10;
            min-width: 250px;
        }

        .stat-item {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            opacity: 0;
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            animation: statCycle 12s infinite;
        }

        .stat-1 { animation-delay: 0s; }
        .stat-2 { animation-delay: 4s; }
        .stat-3 { animation-delay: 8s; }

        @keyframes statCycle {
            0% { opacity: 0; transform: translateY(-40%) scale(0.9); }
            5% { opacity: 1; transform: translateY(-50%) scale(1); }
            30% { opacity: 1; transform: translateY(-50%) scale(1); }
            35% { opacity: 0; transform: translateY(-60%) scale(0.9); }
            100% { opacity: 0; }
        }

        .stat-label { color: var(--gold-dark); font-size: 0.8rem; display: block; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div class="banner-container">
        <div id="spark-container"></div>

        <div class="fire-slash slash-1"></div>
        <div class="fire-slash slash-2"></div>

        <div class="logo-group">
            <div class="main-logo">MU NEUTRO</div>
        </div>

        <div class="stats-panel">
            <div class="stat-item stat-1">
                <span class="stat-label">EXPERIENCIA</span>
                XP: 300X
            </div>
            <div class="stat-item stat-2">
                <span class="stat-label">LEVEL CAP</span>
                MAX: 1750
            </div>
            <div class="stat-item stat-3">
                <span class="stat-label">DROP RATE</span>
                ITEMS: 40%
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('spark-container');
        for(let i=0; i<20; i++) {
            let spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = Math.random() * 100 + '%';
            spark.style.width = Math.random() * 4 + 'px';
            spark.style.height = spark.style.width;
            spark.style.animationDelay = Math.random() * 4 + 's';
            container.appendChild(spark);
        }
    </script>
</body>
</html>
